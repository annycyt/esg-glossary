<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG 永續領域功能分類圖</title>
<style>
:root{
  --bg:#0e1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#252d40;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.22);
  --text:#dde2f0;--text2:#8e98b5;--text3:#4e5875;
  --font:'IBM Plex Sans TC','Noto Sans TC',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
#app{display:flex;flex-direction:column;min-height:100vh}

/* ── header ── */
#hdr{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:100}
#hdr h1{font-size:12px;font-weight:500;white-space:nowrap}
#srch{flex:1;max-width:180px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text);font-family:var(--font);outline:none}
#srch:focus{border-color:var(--border3)}
#srch::placeholder{color:var(--text3)}
.hbtn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:var(--font);white-space:nowrap;transition:background .1s}
.hbtn:hover{background:var(--bg4);color:var(--text)}
.hbtn.primary{border-color:rgba(255,255,255,0.25);color:var(--text)}
#hdr-count{font-size:10px;color:var(--text3);white-space:nowrap;margin-left:auto}

/* ── panels ── */
.panel{background:var(--bg2);border-bottom:1px solid var(--border2);padding:14px 14px 12px}
.panel-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:10px}
.panel-row{display:grid;gap:8px;margin-bottom:8px}
.panel-row.c3{grid-template-columns:1fr 1fr 1fr}
.panel-row.c2{grid-template-columns:1fr 1fr}
.panel-row.c1{grid-template-columns:1fr}
.flabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);display:block;margin-bottom:3px}
.finput{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:6px 9px;font-size:12px;color:var(--text);font-family:var(--font);outline:none}
.finput:focus{border-color:var(--border3)}
.fta{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:7px 9px;font-size:12px;color:var(--text);font-family:var(--font);outline:none;resize:vertical;min-height:62px;line-height:1.6}
.fta:focus{border-color:var(--border3)}
select.finput{cursor:pointer}
.panel-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.cbtn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:5px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:var(--font)}
.cbtn:hover{color:var(--text);background:var(--bg4)}
.cbtn.ok{border-color:rgba(255,255,255,0.25);color:var(--text)}
.ai-result{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px;margin:8px 0;font-size:11px;line-height:1.7;color:var(--text2);max-height:200px;overflow-y:auto}
.ai-result .af{margin-bottom:6px}
.af-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:2px}
.af-val{font-size:11px;color:var(--text2)}
.apikey-note{font-size:11px;color:var(--text3);margin-bottom:8px;line-height:1.5}
.apikey-note a{color:#5DCAA5;text-decoration:none}

/* ── main layout ── */
#main{display:flex;flex:1;overflow:hidden}
#layers-wrap{flex:1;overflow-y:auto;padding:12px 14px 40px}
#layers-wrap::-webkit-scrollbar{width:4px}
#layers-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── panel right ── */
#detail{width:360px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border2);overflow-y:auto;transition:width .2s,opacity .2s}
#detail.closed{width:0;opacity:0;overflow:hidden;border:none}
#detail-inner{padding:14px;min-width:360px}
#detail-inner::-webkit-scrollbar{width:4px}

/* mobile */
@media(max-width:700px){
  #main{flex-direction:column}
  #detail{position:fixed;left:0;right:0;bottom:0;width:100%!important;max-height:72vh;border-left:none;border-top:2px solid var(--border2);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .3s ease;opacity:1!important;z-index:200}
  #detail.open{transform:translateY(0)}
  #detail.closed{transform:translateY(100%);width:100%!important;opacity:1!important;overflow:hidden}
  #detail-inner{min-width:0;padding:10px 14px 28px}
  #detail-inner::before{content:'';display:block;width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 10px}
}

/* ── layer ── */
.layer{border:1px solid var(--border2);border-radius:8px;overflow:hidden;margin-bottom:6px}
.layer-head{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:9px 12px}
.layer-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff;flex-shrink:0}
.layer-info{display:flex;flex-direction:column;gap:2px}
.layer-name{font-size:13px;font-weight:500;color:var(--text)}
.layer-desc{font-size:11px;color:var(--text3);line-height:1.4}
.layer-badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap}
.layer-body{padding:8px 12px 10px;display:flex;flex-wrap:wrap;gap:5px;border-top:1px solid var(--border);min-height:36px;transition:background .1s}
.layer-body.drag-over{background:rgba(93,202,165,.06);outline:1px dashed #1D9E75;outline-offset:-2px}

/* ── chips ── */
.chip{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:opacity .1s;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;user-select:none}
.chip:hover{opacity:.8}
.chip.active{border-color:rgba(255,255,255,0.3)!important;opacity:1}
.chip.dimmed{opacity:.2}
.chip.dragging{opacity:.3;cursor:grabbing}
.chip.drag-before{border-left:2px solid rgba(255,255,255,.5)!important}

/* ── detail panel content ── */
.p-close{display:flex;justify-content:flex-end;margin-bottom:8px}
.p-close button{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:var(--font)}
.p-close button:hover{background:var(--bg4)}
.p-badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 9px;border-radius:20px;margin-bottom:8px;letter-spacing:.03em}
.p-title{font-size:15px;font-weight:500;margin-bottom:2px;color:var(--text)}
.p-en{font-size:11px;color:var(--text3);margin-bottom:10px;font-family:var(--mono)}
.p-sec{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin:10px 0 4px;font-weight:500}
.p-box{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:12px;line-height:1.75;color:var(--text2)}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.p-cell{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:7px 9px}
.p-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:3px;font-weight:500}
.p-val{font-size:11px;line-height:1.65;color:var(--text2);white-space:pre-wrap}
.p-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.p-chip{font-size:10px;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--text2);cursor:pointer;border:1px solid var(--border2);transition:all .1s;font-family:var(--font)}
.p-chip:hover{background:rgba(255,255,255,.1);color:var(--text)}
.p-actions{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.p-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:140px;color:var(--text3);font-size:12px;text-align:center;gap:8px;padding:20px}
.drag-hint{font-size:10px;color:var(--text3);padding:2px 14px 8px;text-align:right}
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

<!-- header -->
<div id="hdr">
  <div><h1>ESG 永續領域功能分類圖</h1></div>
  <input id="srch" placeholder="搜尋名詞…" autocomplete="off" oninput="onSearch(this.value)">
  <button class="hbtn primary" onclick="togglePanel('add')">＋ 新增名詞</button>
  <span id="hdr-count"></span>
</div>

<!-- add panel -->
<div id="add-panel" class="panel" style="display:none">
  <div class="panel-title">新增名詞</div>
  <div class="panel-row c3">
    <div><span class="flabel">縮寫（必填）</span><input id="na" class="finput" placeholder="TCFD"></div>
    <div><span class="flabel">中文名稱 / 英文</span><input id="nz" class="finput" placeholder="氣候相關財務揭露"></div>
    <div><span class="flabel">功能層</span><select id="nl" class="finput"></select></div>
  </div>
  <div class="panel-row c2">
    <div><span class="flabel">解決什麼問題</span><textarea id="np" class="fta"></textarea></div>
    <div><span class="flabel">怎麼運作</span><textarea id="nh" class="fta"></textarea></div>
  </div>
  <div class="panel-row c2">
    <div><span class="flabel">台灣影響</span><textarea id="ntw" class="fta"></textarea></div>
    <div><span class="flabel">考試重點</span><textarea id="ne" class="fta"></textarea></div>
  </div>
  <div class="panel-row c2">
    <div><span class="flabel">關鍵數字</span><input id="nn" class="finput"></div>
    <div><span class="flabel">適用對象</span><input id="nw" class="finput"></div>
  </div>
  <div class="panel-row c1">
    <div><label class="flabel" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="nvol"> 標記為「自願性」（有別於強制法規）</label></div>
  </div>
  <div class="panel-btns">
    <button class="cbtn" onclick="togglePanel('add')">取消</button>
    <button class="cbtn" id="ai-fill-btn" onclick="runAIFill()" title="輸入縮寫後，AI 自動生成說明欄位">✦ AI 自動生成說明</button>
    <button class="cbtn ok" onclick="addTerm()">加入關係圖</button>
  </div>
  <div id="ai-fill-loading" style="display:none;font-size:11px;color:var(--text3);padding:4px 0;text-align:right">AI 生成中，請稍候…</div>
</div>

<!-- modal overlay backdrop -->
<div id="modal-bg" onclick="closeModal()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300"></div>

<!-- edit modal -->
<div id="edit-panel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:310;background:var(--bg2);border:1px solid var(--border3);border-radius:10px;width:min(700px,95vw);max-height:88vh;overflow-y:auto;padding:20px 20px 16px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:13px;font-weight:500">✏ 編輯名詞</div>
    <button class="cbtn" onclick="closeModal()">✕</button>
  </div>
  <div class="panel-row c3">
    <div><span class="flabel">縮寫</span><input id="ea" class="finput" readonly style="opacity:.5"></div>
    <div><span class="flabel">中文名稱 / 英文</span><input id="ez" class="finput"></div>
    <div><span class="flabel">功能層</span><select id="el" class="finput"></select></div>
  </div>
  <div class="panel-row c2">
    <div><span class="flabel">解決什麼問題</span><textarea id="ep" class="fta"></textarea></div>
    <div><span class="flabel">怎麼運作</span><textarea id="eh" class="fta"></textarea></div>
  </div>
  <div class="panel-row c2">
    <div><span class="flabel">台灣影響</span><textarea id="etw" class="fta"></textarea></div>
    <div><span class="flabel">考試重點</span><textarea id="ee" class="fta"></textarea></div>
  </div>
  <div class="panel-row c2">
    <div><span class="flabel">關鍵數字</span><input id="en2" class="finput"></div>
    <div><span class="flabel">適用對象</span><input id="ew" class="finput"></div>
  </div>
  <div class="panel-btns">
    <button class="cbtn" onclick="closeModal()">取消</button>
    <button class="cbtn ok" onclick="saveEdit()">儲存</button>
  </div>
</div>

<!-- ai modal -->
<div id="ai-panel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:310;background:var(--bg2);border:1px solid var(--border3);border-radius:10px;width:min(600px,95vw);max-height:88vh;overflow-y:auto;padding:20px 20px 16px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:13px;font-weight:500">✦ AI 重新生成說明</div>
    <button class="cbtn" onclick="closeModal()">✕</button>
  </div>
  <div id="ai-form">
    <div class="panel-row c1">
      <div><span class="flabel">補充說明或問題（可空白）</span><input id="ai-hint" class="finput" placeholder="例如：請加強台灣的實際影響說明"></div>
    </div>
    <div class="panel-btns" style="margin-bottom:8px">
      <button class="cbtn" onclick="closeModal()">取消</button>
      <button class="cbtn ok" id="ai-run-btn" onclick="runAI()">✦ 重新生成</button>
    </div>
    <div id="ai-loading" style="display:none;font-size:12px;color:var(--text3);padding:4px 0">AI 生成中，請稍候…</div>
    <div id="ai-result-wrap" style="display:none">
      <div class="ai-result" id="ai-result"></div>
      <div class="panel-btns">
        <button class="cbtn" onclick="closeModal()">取消</button>
        <button class="cbtn ok" onclick="applyAI()">套用此版本</button>
      </div>
    </div>
  </div>
</div>

<!-- main area -->
<div id="main">
  <div id="layers-wrap">
    <div class="drag-hint">拖曳名詞可移動至其他功能層</div>
    <div id="layers"></div>
  </div>
  <div id="detail" class="closed">
    <div id="detail-inner">
      <div class="p-empty">點擊任一名詞<br>查看完整說明</div>
    </div>
  </div>
</div>

</div><!-- #app -->
<script>
/* ════════════════════════════════
   API KEY — 存在 localStorage，第一次使用時提示輸入
════════════════════════════════ */
function getApiKey(){
  let k=localStorage.getItem('esg_apikey')||'';
  if(!k){
    k=prompt('請輸入 Anthropic API Key（只需輸入一次，之後自動記住）：','');
    if(k&&k.trim()) localStorage.setItem('esg_apikey',k.trim());
  }
  return k?k.trim():'';
}

/* ════════════════════════════════
   DATA — 所有名詞原始資料
════════════════════════════════ */
const D={
unfccc:{zh:'UNFCCC',en:'聯合國氣候框架公約',prob:'各國燒煤燒油，大氣CO₂濃度飆升，地球暖化。但沒有任何機構能要求主權國家減碳——UNFCCC就是為了填補這個空缺而誕生的全球第一個氣候談判框架。',how:'1992年里約地球高峰會通過，198個締約方加入。核心原則：CBDR-RC「共同但有區別的責任」——已開發國家（附件一，41國）歷史排碳多，要率先減；開發中國家依自身能力跟進。每年召開COP締約方大會評估進展。',tw:'台灣不是UNFCCC締約方（非UN成員）。但台灣主動對標UNFCCC精神，制定氣候法、NDC、2050淨零路徑，以非正式觀察員角色參與COP。',exam:'▸ UNFCCC最終目標：穩定大氣GHG濃度\n▸ CBDR-RC原則定義（必考）\n▸ 附件一（已開發41國）vs 非附件一\n▸ COP第一屆：1995年柏林\n▸ 1992年通過、1994年生效',num:'1992年通過 ／ 1994年生效 ／ 198締約方',who:'全球主權國家政府（政府層級）',rel:['kyoto','paris','cop','ipcc']},
kyoto:{zh:'京都議定書',en:'Kyoto Protocol',prob:'UNFCCC只是框架，沒有具體的減碳數字。1990年代科學已確認人為排碳造成暖化，需要給已開發國家設定法律約束的減量目標。',how:'只約束UNFCCC「附件一」的41個已開發國家（中印不受約束）。要求2008-2012年間平均減碳5.2%（vs 1990年基準）。設計三個彈性機制：CDM（幫開發中國家減碳算自己的）、JI（已開發國家互相合作）、ET（直接買賣碳配額）。',tw:'台灣非附件一，京都議定書無直接法律約束力。但CDM機制孕育了現在VCM自願碳市場的前身。',exam:'▸ 附件一國家平均減量5.2%（vs 1990）（高頻）\n▸ 第一期2008-2012；第二期2013-2020\n▸ 三彈性機制：CDM、JI、ET（必考）\n▸ 2005年2月16日生效；CDM 2026年落日',num:'附件一41國 ／ 平均-5.2% ／ 2008-2012',who:'UNFCCC附件一已開發國家（具法律約束力）',rel:['cdm','paris','unfccc']},
cdm:{voluntary:true,zh:'CDM / JI / ET',en:'京都三彈性機制',prob:'已開發國家在自己國內減碳成本很高，但在開發中國家做同樣減碳便宜很多。有沒有辦法讓錢花在最有效率的地方？',how:'CDM（清潔發展機制）：核發CER碳信用。JI（共同執行）：已開發國家互助。ET（排放交易）：已開發國家直接買賣碳配額。EU ETS就是ET邏輯的延伸。CDM 2026年正式落日，被巴黎協定第6條（ITMO/PACM）取代。',tw:'CDM時代台灣有部分企業參與林業碳匯專案。VCM的運作邏輯直接繼承自CDM。',exam:'▸ 三機制英文全名：CDM/JI/ET（高頻必考）\n▸ CDM核發CER；PACM核發A6.4ER\n▸ CDM 2026年落日→被第6.4條取代\n▸ ET是EU ETS的制度原型',num:'CDM已核發~20億噸CER ／ 2026年落日',who:'京都附件一國家 + 開發中國家（東道主）',rel:['vcm','itmo','pacm','euets']},
paris:{zh:'巴黎協定',en:'Paris Agreement',prob:'京都議定書只管已開發國家，中國印度完全不受約束，全球排碳繼續上升。需要一個覆蓋所有國家的新框架。',how:'2015年COP21通過，196個締約方全部加入。核心架構：① 溫度目標：2°C以內，努力1.5°C ② NDC機制：各國自訂目標，每5年更新（棘輪條款）③ 全球盤點GST每5年一次 ④ 第六條ITMO國際碳市場 ⑤ 氣候融資每年1,000億美元。',tw:'台灣非締約方，但2023年氣候法明訂2050淨零為國家目標。NDC 3.0設定2030年減28±2%（vs 2005年）。所有減碳政策均以1.5°C路徑為科學依據。',exam:'▸ 1.5°C努力目標 vs 2°C主要目標（超高頻）\n▸ NDC每5年更新、棘輪條款（只能更嚴）\n▸ 2016年11月4日生效\n▸ 第六條ITMO國際碳市場機制',num:'2°C主要 ／ 1.5°C努力 ／ 196締約方',who:'UNFCCC全體締約方（含開發中國家）',rel:['ndc','cop','sbti','itmo','pacm','unfccc']},
ndc:{zh:'NDC',en:'Nationally Determined Contributions',prob:'以前氣候協議是聯合國告訴你要減多少，沒人願意簽。巴黎協定改成「你自己說要減多少」——棘輪機制讓每次更新只能更嚴格。',how:'主要國家承諾：歐盟-55%（vs 1990）、美國-50-52%（vs 2005）、中國2030達峰、日本-46%（vs 2013）、台灣-28±2%（2030）。現行NDC合計只能達2.5-3.2°C情境，距1.5°C差距巨大。',tw:'台灣NDC 3.0（2024）是最新版本，2030目標比NDC 2.0更嚴格4個百分點。非UNFCCC締約方但主動提交。',exam:'▸ NDC棘輪條款（只能更嚴不能放寬）（必考）\n▸ 現行差距：2.5-3.2°C（排放差距報告）\n▸ INDC是巴黎協定生效前的過渡名稱\n▸ 台灣NDC 3.0：2030年-28±2%（vs 2005）',num:'5年更新週期 ／ 現行差距2.5-3.2°C',who:'UNFCCC所有締約方政府（自願提交）',rel:['paris','cop','sbti']},
cop:{zh:'COP 大事記',en:'Conference of the Parties',prob:'UNFCCC通過後需要一個每年召開的場合讓各國代表檢視進度、談判細節。COP就是全球最重要的氣候政治舞台。',how:'重要里程碑：COP3（1997京都）京都議定書 → COP21（2015巴黎）巴黎協定 → COP26（2021格拉斯哥）強化1.5°C → COP27（2022）損失與損害基金 → COP28（2023杜拜）首次全球盤點GST1 → COP30（2025貝倫）巴黎十周年。',tw:'台灣以NGO、學術機構身分出席COP，無投票權。COP決議直接影響台灣CBAM應對、碳費設計、金管會法規走向。',exam:'▸ COP3=京都議定書；COP21=巴黎協定（必考）\n▸ COP27=損失與損害基金\n▸ COP28=首次全球盤點GST1\n▸ COP30=2025年巴西貝倫',num:'COP3=京都 ／ COP21=巴黎 ／ COP28=首次GST',who:'UNFCCC全體締約方政府代表',rel:['paris','ndc','unfccc']},
ipcc:{zh:'IPCC',en:'Intergovernmental Panel on Climate Change',prob:'政策談判需要科學依據——哪個溫度目標才安全？現在暖化了幾度？IPCC就是回答這些問題的機構。',how:'1988年成立。不做新研究，整合全球頂尖科學家的研究成果，每5-6年發布評估報告（AR）。AR6（2023年）：2023年全球均溫比工業化前高1.45°C；維持1.5°C需2030年前減碳43%。',tw:'台灣科學家參與IPCC報告撰寫。IPCC的1.5°C目標是台灣NDC、SBTi、氣候法的科學基礎。',exam:'▸ IPCC不做研究，整合科學共識\n▸ AR6（2023）：均溫+1.45°C\n▸ 1.5°C目標的科學依據來源\n▸ 溫度每升0.5°C影響呈非線性',num:'1988年成立 ／ AR6（2023）最新 ／ 195成員國',who:'聯合國政府間機構，整合全球科學家研究',rel:['paris','ndc','unfccc']},
itmo:{zh:'ITMO（第6.2條）',en:'Intl Transferred Mitigation Outcomes',prob:'CDM落日後，各國還是想透過跨境合作實現更便宜的減碳。巴黎第六條就是新版的國際碳市場——這次要確保不「重複計算」。',how:'第6.2條「合作方法」：國家A投資國家B做減碳，減量成果轉讓給A用於NDC目標。關鍵是「相應調整」：B把這噸從自己NDC帳戶扣掉，A加進自己帳戶，確保不重複計算。',tw:'台灣企業參與ITMO需透過政府授權。目前台灣正評估如何在TCEX平台上銜接ITMO機制。',exam:'▸ ITMO = 國際轉讓減緩成果\n▸ 相應調整（Corresponding Adjustment）是核心\n▸ 第6.2條（雙邊）vs 第6.4條PACM（聯合國集中）\n▸ 與CDM差異：需相應調整、防雙重計算',num:'2021年COP26後正式啟動 ／ 需相應調整',who:'巴黎協定締約方政府（需官方授權）',rel:['pacm','vcm','cdm','tcex']},
pacm:{zh:'PACM（第6.4條）',en:'Paris Agreement Crediting Mechanism',prob:'CDM品質良莠不齊、環境效益存疑。PACM是CDM的升級版，由聯合國集中管理，標準更嚴格。',how:'由聯合國A6.4監督機構統一管理，核發A6.4ER碳信用。比ITMO更中央化。CDM專案需重新申請才能轉換。強制扣除2%用於全球減排（OMGE）、5%用於調適基金。',tw:'台灣企業可作為計畫開發者或買家參與PACM。TCEX已開始引進符合PACM標準的碳信用。',exam:'▸ PACM vs CDM（更嚴格、聯合國集中管理）\n▸ CDM 2026落日→PACM取代\n▸ A6.4ER是新碳信用名稱（取代CER）\n▸ 扣除2%OMGE + 5%調適基金',num:'CDM 2026落日 ／ A6.4ER取代CER',who:'巴黎協定締約方 + 授權企業實體',rel:['cdm','itmo','vcm','ccp']},
csrd:{zh:'CSRD',en:'企業永續報告指令',prob:'以前歐盟只要求少數大型企業做非財務報告，而且格式五花八門。CSRD要大幅擴大適用範圍、統一格式、強制查證。',how:'取代NFRD。採「雙重重大性」評估，強制第三方查證。適用：①歐盟大型企業 ②在歐盟上市公司 ③在歐盟年營業額>1.5億歐元的非歐盟企業。分階段：2024→2025→2026→2028。',tw:'台灣企業三種情境：①在歐盟有子公司 ②在歐盟年營業額>1.5億歐元 ③是歐洲品牌供應商（需提供Scope 3數據）。台積電、鴻海、廣達需配合客戶提供CSRD所需數據。',exam:'▸ CSRD取代NFRD（必考）\n▸ ESRS是CSRD底層準則（12項）\n▸ 雙重重大性：財務+衝擊兩維度\n▸ 非歐盟門檻：在歐盟年營業額>1.5億歐元\n▸ 分四階段2024-2028',num:'1.5億歐元非歐盟門檻 ／ 2024-2028四階段',who:'歐盟大型企業 + 部分非歐盟企業（含台灣子公司）',rel:['esrs','csddd','issb','gri','doubmat','cbam']},
esrs:{zh:'ESRS',en:'歐洲永續報告準則',prob:'CSRD法規說「要揭露ESG資訊」，但用什麼格式、揭露哪些項目？ESRS就是具體的填報規格書。',how:'共12項準則：通用（2項）＋ 環境（5項：E1氣候、E2污染、E3水資源、E4生物多樣性、E5循環經濟）＋ 社會（4項）＋ 治理（1項：G1商業行為）。企業需先完成雙重重大性評估決定揭露哪些項目。',tw:'E1（氣候）準則要求揭露Scope 1/2/3、1.5°C情境分析、轉型計畫，是台灣廠商最難準備的部分。',exam:'▸ 12項準則分類：2通用+5環境+4社會+1治理（必考）\n▸ E1氣候：含Scope 1/2/3、轉型計畫\n▸ 雙重重大性決定哪些準則需揭露',num:'12項準則 ／ 5項環境 ／ 4項社會',who:'依CSRD需申報的企業',rel:['csrd','issb','gri','tcfd','doubmat']},
csddd:{zh:'CSDDD',en:'企業永續盡職調查指令',prob:'以前歐洲品牌只管自己工廠，供應商（台灣、越南工廠）怎樣都不管。CSDDD說：不行，你要對整條供應鏈的人權和環境負責。',how:'要求大型歐盟企業對整個供應鏈進行人權與環境盡職調查。義務：識別→預防→減輕→補救→設申訴機制→公開報告。違規最高罰5%全球營業額。2027年起分階段。',tw:'台灣電子（RBA）、紡織、食品等供應鏈首當其衝。歐洲品牌客戶會發問卷給台灣供應商，填不出來訂單可能就沒了。',exam:'▸ CSRD=報告義務；CSDDD=行動義務（必考差異）\n▸ 最高罰5%全球營業額\n▸ 2027年起分階段適用\n▸ UNGP三支柱是理念基礎',num:'5%全球營業額罰款上限 ／ 2027年起',who:'歐盟大型企業 + 在歐盟年營業額>4.5億歐元的非歐盟企業',rel:['csrd','ungp','rba','ilo','sa8000']},
cbam:{zh:'CBAM',en:'碳邊境調整機制',prob:'歐盟工廠要付碳費，但台灣、中國工廠不用——歐盟企業就輸了，而且碳排跑到別的地方繼續排（碳洩漏）。CBAM就是補這個漏洞的。',how:'對從高碳排國家進口至歐盟的6大產業產品徵收碳費：水泥、鋼鐵、鋁、化肥、電力、氫。按「內嵌排放量」計算，費率與EU ETS碳價掛鉤（現約€65/噸）。2026正式課費→2034免費配額歸零。',tw:'中鋼、東和鋼鐵等出口歐盟的鋼材，2026年起開始繳費。台灣廠商現在要學會算「內嵌碳排放」（依ISO 14067方法）。台灣碳費越高，CBAM可扣抵的金額就越多。',exam:'▸ CBAM 6大產業（必考）：水泥、鋼鐵、鋁、化肥、電力、氫\n▸ 2026正式課費；2034免費配額歸零\n▸ 碳洩漏定義\n▸ 內嵌排放量（embedded emissions）',num:'6大產業 ／ 2026正式課費 ／ ~€65/噸',who:'向歐盟進口6大產業產品的進口商（含台灣出口商）',rel:['euets','iso14067','csrd','twcf']},
euets:{zh:'EU ETS',en:'歐盟碳排放交易體系',prob:'如何確保歐洲排放量不超標，同時讓市場自己找到最便宜的減碳方式？EU ETS用總量管制+市場交易來解決這個問題。',how:'全球最大強制性碳市場，2005年啟動。政府設定排放總量上限（cap），每年遞減4.3%；管制業者超出免費配額的部分需購買EUA（1 EUA=1噸CO₂e），現價約€60-80/噸。ETS 2.0（2027年）擴展至建築和道路運輸。',tw:'CBAM計算可扣抵金額時，以EU ETS碳價為基準。台灣碳費（300元≈€9）遠低於EU ETS（€65/噸），差距=台灣企業需額外繳的CBAM費用。',exam:'▸ Cap-and-trade機制原理（必考）\n▸ EU ETS是全球最大「強制性」碳市場\n▸ EUA=歐洲排放配額，1 EUA=1噸CO₂e\n▸ 2027年ETS 2.0擴展至建築、道路運輸\n▸ cap年遞減4.3%',num:'€60-80/噸 ／ 2027年ETS 2.0 ／ cap年遞減4.3%',who:'EU境內電力業、重工業、航空、航運業者',rel:['cbam','eua','vcm','cap','corsia','twcf']},
eudr:{zh:'EUDR',en:'歐盟反毀林規章',prob:'全球每年超過1,000萬公頃森林消失，很大一部分是為了種大豆、油棕、養牛而砍伐。歐盟說：只要你的產品和毀林有關，就不準進歐盟。',how:'禁止進口與毀林相關的7大商品：牛肉、大豆、棕櫚油、木材、可可、咖啡、橡膠。進口商須提供盡職調查聲明，證明商品來自2020年12月31日後未發生毀林的土地，可溯源至GPS坐標層級。',tw:'台灣食品業（棕櫚油、大豆）、紙漿造紙（木材）、橡膠業可能受上游供應鏈影響。需要求供應商提供EUDR合規文件和農場層級溯源數據。',exam:'▸ EUDR 7大商品（必知）\n▸ 2020年12月31日截止日期\n▸ GPS坐標層級溯源要求\n▸ 與FSC森林認證的關係',num:'7大商品 ／ 2020.12.31截止日期 ／ GPS溯源',who:'向歐盟出口7大商品及其衍生品的所有企業',rel:['fsc','csddd']},
ppwr:{zh:'PPWR',en:'歐盟包材廢棄物法規',prob:'歐盟每人每年產生約180公斤包裝廢棄物，其中大量無法回收。需要強制要求包材設計更環保，並讓生產者承擔回收責任。',how:'核心：①2030年起塑膠包材含≥30%再生料 ②2030年起所有包材需可回收 ③2040年人均包材廢棄物減15% ④禁止過度包裝 ⑤EPR費率依可回收性調整。2026年8月生效。',tw:'台灣出口至歐盟的電商、食品、電子產品包材需符合PPWR。短期影響以設計改良為主，中期需建立再生料供應鏈。',exam:'▸ 2026年8月生效\n▸ 2030年：30%再生料、所有包材可回收\n▸ 2040年：減量15%\n▸ EPR費率差異化概念',num:'2026年8月生效 ／ 2030年30%再生料',who:'在歐盟市場銷售產品的所有製造商與進口商',rel:['epr','circular']},
corsia:{zh:'CORSIA',en:'國際航空碳抵換計劃',prob:'航空業是成長最快的排碳行業之一，但又難以電氣化。如何讓航空業對氣候暖化負責？',how:'ICAO主導的全球航空碳抵換計劃。要求航空公司將2021年後國際航班排放量超過2019年水準的部分，以購買符合資格的碳信用加以抵換。SAF可100%抵減CORSIA義務。2027年進入強制階段。',tw:'長榮、華航的國際航線受CORSIA約束，需購買碳信用或使用SAF。台灣桃園機場目標成為亞太SAF樞紐。',exam:'▸ CORSIA vs EU ETS航空版差異\n▸ SAF可100%抵減CORSIA義務\n▸ 第二期2027年強制所有締約方\n▸ 2020年後碳中性成長目標',num:'2027年強制 ／ SAF可100%抵減',who:'ICAO成員國的國際民航業者',rel:['saf','vcm','euets','imo']},
imo:{zh:'IMO 2050',en:'國際航運淨零目標',prob:'航運業約佔全球排碳2-3%，且使用的重燃油是最骯髒的化石燃料之一。如何讓全球船隊走向淨零？',how:'2023年修訂的航運去碳化策略：2030年前使用至少5%（努力10%）零碳或近零碳燃料；2050年淨零。落地機制：CII（碳強度指標，A-E五級評分）、EEXI（現有船舶能源效率）、EEDI（新造船）。',tw:'台灣貨運、散裝航運業者需提升能源效率（CII評級）。台灣造船業面臨綠色船舶（氨燃料、甲醇燃料）訂單轉型壓力。',exam:'▸ IMO 2050 vs 2018策略（50%→淨零升級）\n▸ CII A-E五級評分（A最好）\n▸ Well-to-wake全生命週期計算\n▸ EEXI vs EEDI差異',num:'2030：5-10%零碳燃料 ／ 2050淨零',who:'400總噸以上的國際航行船舶',rel:['saf','greenh2','greenamm','corsia','p2x']},
ira:{zh:'IRA（美國）',en:'Inflation Reduction Act',prob:'美國要追趕歐盟在清潔能源的投資，同時應對通脹和能源安全。IRA是美國史上最大的氣候法案。',how:'2022年通過，10年3,690億美元。三大稅抵減：45X（太陽能板、電池美國製造補貼）、45Q（CCUS每噸$85）、45V（綠氫最高$3/kg）。「本地製造」要求（domestic content）引發台廠赴美投資潮。',tw:'IRA 45X驅使台積電赴美設廠、台灣太陽能板廠商設立美國製造基地。2025年後部分補貼面臨政策調整風險。',exam:'▸ 三大稅抵減：45X/45Q/45V（必記）\n▸ 45Q CCUS：$85/噸\n▸ 45V綠氫：最高$3/kg\n▸ Domestic content要求影響台廠',num:'3,690億美元 ／ 45V綠氫$3/kg',who:'在美生產的製造商、美國消費者（電動車補貼）',rel:['ccus','greenh2']},
secrule:{zh:'SEC 氣候規則',en:'SEC Climate Disclosure Rule',prob:'美國上市公司的氣候風險揭露格式各異，投資人無法比較。SEC要統一格式，但又不想像CSRD那麼嚴格。',how:'2024年3月通過（目前被法院暫停執行）。要求：①Scope 1&2強制揭露 ②極端氣候事件的財務影響 ③轉型計畫。原計畫Scope 3強制要求最終版刪除。',tw:'台積電ADR（NYSE上市）直接受SEC規則約束。其他在美發行ADR的台灣企業同樣適用。',exam:'▸ SEC規則 vs ISSB S2差異（Scope 3不強制）\n▸ 與CSRD比較（美vs歐嚴格程度）\n▸ 目前被法院暫停執行\n▸ 台灣ADR企業適用',num:'2024年3月通過 ／ 目前法院暫停',who:'在美上市公司（含外國企業ADR，如台積電）',rel:['issb','csrd','tcfd','scope']},
twlaw:{zh:'氣候變遷因應法',en:'Climate Change Response Act',prob:'台灣需要一個能涵蓋減碳、碳費、強制盤查、氣候調適的全面性氣候法律，同時明確設定2050淨零目標。',how:'2023年修正通過，取代2015年舊法。重大變化：①明訂2050淨零排放為國家目標 ②授權碳費徵收 ③強制盤查（年排放>2.5萬噸）④自願減量額度制度 ⑤碳費收入進「氣候基金」（專款）。',tw:'台灣所有碳費、ETS、自願減量的法律依據就是這部法。企業需熟悉三大子法的規定，特別是碳費起徵門檻和費率。',exam:'▸ 氣候法三大機制：碳費/強制盤查/減量額度\n▸ 2023年修正通過\n▸ 主管機關：行政院環境部\n▸ 2050淨零排放入法',num:'2023年修正 ／ 三大機制 ／ 2050淨零入法',who:'所有台灣企業（特別是高排放行業）',rel:['twcf','tcex','twpath']},
twcf:{zh:'台灣碳費',en:'Taiwan Carbon Fee',prob:'台灣需要把碳排放的外部成本（氣候損害）內部化，讓高碳排企業承擔責任，同時籌措綠色轉型資金。',how:'氣候變遷因應法授權環境部對年排放量>2.5萬噸CO₂e的工廠收取碳費。費率：初期300元/噸（2025）；2030後預計調升至1,200-1,800元/噸。收入進入「氣候基金」，首批約500家廠商（鋼鐵、石化、水泥、電力為主）。',tw:'台灣碳費（300元/噸≈€9）遠低於EU ETS（€65/噸）。這個差距意味著台灣鋼鐵業在CBAM上還有大量額外費用要付。未來費率調升是必然趨勢。',exam:'▸ 碳費門檻：>2.5萬噸CO₂e/年（必考）\n▸ 初期費率：300元/噸（2025）\n▸ 碳費 vs 碳稅差異（行政收費vs立法課稅）\n▸ 收入進入氣候基金（專款專用）',num:'>2.5萬噸門檻 ／ 300元初期費率 ／ 約500家',who:'年排放>2.5萬噸CO₂e的台灣工廠（約500家）',rel:['euets','cbam','tcex','cfvst']},
uflpa:{zh:'UFLPA',en:'維吾爾強迫勞動防止法',prob:'新疆生產的商品（多晶矽、棉花等）可能涉及強迫勞動，但企業難以追溯供應鏈。美國UFLPA採取「推定有罪」的極強硬立場。',how:'2022年美國通過。推定原則：凡是來自新疆的商品，一律推定涉及強迫勞動，禁止進口，除非企業能「清楚且有說服力地」舉證清白（舉證責任倒置）。',tw:'台灣太陽能業：使用中國多晶矽的模組被美國海關扣押（多起案例）。台灣紡織業：棉花溯源要求。台灣業者需建立全面的供應鏈溯源體系。',exam:'▸ UFLPA「推定有罪」原則（舉證責任倒置）（必考）\n▸ 影響最大：太陽能多晶矽、紡織棉花\n▸ 企業須清楚舉證清白\n▸ 2022年通過',num:'2022年通過 ／ 推定原則（舉證責任倒置）',who:'向美國出口含新疆原料商品的所有企業',rel:['csddd','rba','ungp']},
msa:{zh:'現代奴隸法',en:'Modern Slavery Act (UK/Aus)',prob:'強迫勞動不只是發展中國家的問題，企業供應鏈中可能在任何地方存在現代奴隸制。英國和澳洲率先立法要求企業披露風險。',how:'英國《現代奴隸法》（2015）：年營業額>3,600萬英鎊的企業每年須發布《現代奴隸聲明》。澳洲《現代奴隸法》（2018）：年營業額>1億澳幣。與CSDDD不同，只要求「報告」不要求「行動」。',tw:'台灣在英澳有客戶關係的企業，需配合英澳客戶的現代奴隸調查。長期趨勢：從「報告義務」走向CSDDD式的「行動義務」。',exam:'▸ 英國：>£3,600萬；澳洲：>A$1億\n▸ 只要求「報告」（vs CSDDD要求「行動」）\n▸ 每年須發布現代奴隸聲明',num:'英國：>£3,600萬 ／ 澳洲：>A$1億',who:'符合規模門檻的英澳企業及外國供應商',rel:['csddd','rba','ungp','uflpa']},
clitigation:{zh:'氣候訴訟',en:'Climate Litigation',prob:'各國政府和企業在氣候上的承諾跟實際行動有巨大落差。NGO、受氣候影響的民眾開始透過法庭強制執行氣候責任——這是全新的法律風險類別。',how:'全球氣候訴訟案件超過2,300件（2023年）。代表性案例：Shell荷蘭案（2021）：法院要求Shell遵守巴黎協定，2030年Scope 1/2/3減45%。趨勢：從「政府被告」轉向「企業被告」。',tw:'台灣雖無代表性案例，但隨台灣加入全球供應鏈的深度加深，氣候訴訟風險上升。企業的氣候資訊揭露不實可能成訴訟標的。',exam:'▸ Shell荷蘭案：法院要求企業遵守巴黎協定（里程碑判決）\n▸ 氣候訴訟從「政府」轉向「企業」\n▸ 漂綠（greenwashing）也成訴訟標的',num:'全球>2,300件訴訟（2023）',who:'高碳排企業、化石燃料公司、漂綠企業',rel:['paris','csrd','tcfd']},
issb:{zh:'ISSB S1/S2',en:'國際永續揭露準則',prob:'全球每家公司的永續報告書格式都不一樣，投資人無法比較。ISSB要統一全球永續揭露的「語言」。',how:'IFRS基金會設立。S1：一般永續揭露（治理、策略、風險管理、指標目標）。S2：氣候相關揭露（以TCFD為基礎，要求揭露Scope 1/2/3、轉型計畫、情境分析）。台灣採用時程：資本額100億以上2026年編制、其餘上市櫃2028年開始。',tw:'台灣金管會依ISSB制定本土永續揭露準則，上市櫃公司分階段強制適用。S2要求揭露Scope 1/2/3，這是目前多數台灣企業最大的挑戰。',exam:'▸ S1：一般揭露 vs S2：氣候揭露（必考差異）\n▸ ISSB整合了TCFD、SASB、CDSB\n▸ S2要求Scope 1/2/3全部揭露\n▸ 台灣：資本額100億以上2026年起',num:'資本額100億↑：2026編制 ／ 其餘：2028',who:'各司法管轄區採納後，轄區內上市公司',rel:['tcfd','sasb','gri','csrd','scope']},
gri:{voluntary:true,zh:'GRI',en:'全球報告倡議組織準則',prob:'企業對社會和環境的影響很廣，僅聚焦財務影響不夠。GRI從「所有利害關係人」的角度，要求企業揭露對社會、環境的衝擊。',how:'最廣泛使用的永續報告框架，採「雙重重大性」。架構：GRI 1（基礎）、GRI 2（一般揭露）、GRI 3（重大性評估）+ 200-400系列議題準則（環境/社會/經濟）。企業需執行重大性評估決定揭露主題。',tw:'台灣上市公司永續報告書多依GRI準則。金管會要求上市公司揭露GRI對照表；GRI 3重大性評估流程是合規重點。',exam:'▸ GRI vs ISSB差異（利害關係人vs投資人；雙重vs財務重大性）\n▸ GRI通用準則：GRI 1/2/3\n▸ 議題準則200-400系列\n▸ 雙重重大性定義',num:'使用最廣泛的永續報告框架',who:'所有規模企業（自願，但台灣上市櫃公司強制參考）',rel:['sasb','issb','tcfd','csrd','doubmat']},
tcfd:{zh:'TCFD',en:'氣候相關財務揭露',prob:'氣候變遷會影響企業財務表現（颱風摧毀工廠、碳稅提高成本），但投資人根本不知道哪些企業面臨最大風險。TCFD提供統一架構讓企業揭露這些風險。',how:'FSB設立。四大支柱：治理（Governance）、策略（Strategy）、風險管理（Risk Management）、指標與目標（Metrics & Targets）。風險類型：①實體風險（急性：颱風；慢性：海平面上升）②轉型風險（政策法規、技術、市場、聲譽）。TCFD已於2023年正式整合入ISSB S2。',tw:'台灣「上市公司永續發展行動方案」已要求分階段納入TCFD揭露。ISSB S2以TCFD為基礎，兩者實質相同。',exam:'▸ 四大支柱名稱（必背）\n▸ 實體風險（急性/慢性）vs 轉型風險（政策/技術/市場/聲譽）\n▸ TCFD已整合入ISSB S2\n▸ 轉型風險四子類型',num:'已整合入ISSB S2（2023）',who:'自願採用（各地漸強制），台灣特定規模上市公司',rel:['issb','gri','cdp','sbti']},
tnfd:{voluntary:true,zh:'TNFD',en:'自然相關財務揭露框架',prob:'TCFD處理氣候風險，但企業對自然（土地、水、海洋、生物多樣性）的依賴和衝擊也是重大財務風險。TNFD就是「自然版的TCFD」。',how:'2023年正式發布v1.0。架構仿效TCFD四大支柱，使用LEAP方法論（Locate, Evaluate, Assess, Prepare）評估對生態系統的依賴與衝擊。',tw:'台灣金管會已將TNFD納入永續報告書參考框架。農業、採礦、食品等行業自然依賴度高。',exam:'▸ TCFD=氣候；TNFD=自然（必考對照）\n▸ LEAP方法論（Locate/Evaluate/Assess/Prepare）\n▸ 2023年v1.0正式發布\n▸ 對應GBF 30x30生物多樣性目標',num:'2023年v1.0發布',who:'農業、採礦、食品、基礎設施等自然依賴行業',rel:['tcfd','gbf','sbtn','naturalcap']},
cdp:{voluntary:true,zh:'CDP',en:'碳揭露評比平台',prob:'機構投資人想知道企業的環境表現，但沒有統一平台蒐集這些資訊。CDP提供一個由投資人驅動的自願揭露系統。',how:'全球最大環境資訊揭露平台。企業自願回應CDP問卷（氣候、水安全、森林），由管理超過100兆美元資產的機構投資人驅動。評分從D-到A（Leadership）。',tw:'台灣超過200家企業填報CDP。蘋果、BMW等要求供應商填CDP，是驅動台灣廠商參與的主要動力。',exam:'▸ CDP是「自願揭露平台」（非強制）\n▸ 由機構投資人（100兆美元）驅動\n▸ 問卷三類型：氣候、水安全、森林\n▸ 評分：D→C→B→A（A=最佳）',num:'100兆美元資產規模的投資人驅動',who:'自願企業（但供應鏈客戶要求者視同強制）',rel:['tcfd','issb','gri','sbti']},
sasb:{voluntary:true,zh:'SASB',en:'永續會計準則委員會',prob:'不同行業面對的ESG重大議題完全不同——銀行業和採礦業截然不同。GRI的通用框架無法做到行業別的財務重大性分析。',how:'依產業別制定77個行業別準則，聚焦「財務重大性」（對投資人有財務影響的ESG議題）。已整合入ISSB框架。與GRI差異：SASB=行業別+投資人+財務重大性；GRI=通用+利害關係人+雙重重大性。',tw:'台灣金管會藍圖鼓勵企業參考SASB依行業揭露。台積電、聯發科等適用「半導體行業準則」。',exam:'▸ SASB vs GRI差異（行業別vs通用；投資人vs利害關係人）\n▸ 77個行業別準則\n▸ 已整合入ISSB框架\n▸ 財務重大性（非雙重重大性）',num:'77個行業別準則',who:'自願使用，常見於與機構投資人溝通的企業',rel:['gri','issb','tcfd','cdp']},
doubmat:{zh:'雙重重大性',en:'Double Materiality',prob:'ISSB只要求揭露「ESG對企業財務的影響」，但企業對環境和社會造成的衝擊呢？CSRD和GRI主張這兩個維度都要評估。',how:'雙重重大性=財務重大性（ESG如何影響企業財務）+衝擊重大性（企業活動如何影響環境/社會）取聯集。CSRD強制要求。步驟：識別潛在議題→評估財務影響→評估環境/社會衝擊→確認重大議題→排序。',tw:'台灣上市公司依GRI 3執行重大性評估，實質上就是雙重重大性。需訪談各類利害關係人（員工、客戶、社區、投資人）。',exam:'▸ 雙重重大性 vs 財務重大性（CSRD用雙重；ISSB用財務）（必考）\n▸ 財務重大性+衝擊重大性取「聯集」\n▸ GRI 3是執行工具\n▸ ESRS要求雙重重大性評估',num:'CSRD強制 ／ GRI鼓勵',who:'依CSRD需申報的企業 + 自願採用GRI的企業',rel:['csrd','gri','issb','esrs']},
sbti:{voluntary:true,zh:'SBTi',en:'科學基礎減量目標倡議',prob:'企業宣稱「2050年碳中和」，但說說而已，沒有具體時程。SBTi要求企業設定與IPCC 1.5°C路徑一致的「科學基礎」減碳目標，並提交認證。',how:'由CDP、UN Global Compact、WRI、WWF四大組織聯合發起。申請五步驟：承諾→發展→提交→認證→揭露。通過認證後每5年更新。蘋果要求整個供應鏈設定SBTi目標。',tw:'台積電、台達電等大廠已通過SBTi認證。台灣SBTi認證企業數量快速成長，供應鏈壓力是主要驅動力。',exam:'▸ SBTi=科學基礎（IPCC 1.5°C路徑）\n▸ Scope 3目標：若Scope 3佔比>40%則必須\n▸ 申請五步驟\n▸ 每5年更新目標',num:'全球超過7,000家企業認證',who:'自願企業（但供應鏈客戶要求者視同強制）',rel:['paris','scope','netzero','tcfd']},
re100:{voluntary:true,zh:'RE100',en:'100%再生能源倡議',prob:'企業如何展示100%使用再生能源的承諾，並推動再生能源市場發展？RE100提供一個國際公認的倡議平台。',how:'由氣候組織與CDP共同管理的全球企業倡議，承諾100%使用再生能源。達成路徑：自發自用太陽能、CPPA長期購電、T-REC購買、國際EAC。需每年向CDP報告進度。',tw:'台灣超過20家企業加入RE100，推動本土綠電市場快速發展。RE100要求驅動了T-REC和CPPA的需求。',exam:'▸ RE100達成途徑：自發自用/CPPA/T-REC/EAC\n▸ 蘋果要求供應鏈加入RE100\n▸ 每年向CDP報告進度',num:'全球>400家企業加入',who:'有公開承諾100%RE目標的企業',rel:['trec','cppa','cdp','twpath']},
ungp:{zh:'UNGP',en:'聯合國工商業與人權指導原則',prob:'企業在全球各地運營，可能在知情或不知情的情況下侵害人權（使用強迫勞動的供應商、污染原住民土地等）。需要一個全球性框架規範企業對人權的責任。',how:'2011年聯合國通過，「保護、尊重、救濟」三支柱框架：①國家保護人權（制定法律）②企業尊重人權（盡職調查）③提供救濟機制（申訴管道）。是CSDDD和各國人權盡職調查立法的理念基礎。',tw:'台灣國家人權行動計畫（2022）以UNGP為基礎。台灣外貿協會協助廠商建立人權盡職調查能力以應對CSDDD。',exam:'▸ UNGP三支柱：保護/尊重/救濟（必背）\n▸ 企業責任是「尊重」而非「保護」\n▸ CSDDD法律基礎源自UNGP\n▸ 2011年通過（非強制，但為立法基礎）',num:'2011年通過 ／ 三支柱框架',who:'所有企業（跨國企業為主要對象）',rel:['csddd','rba','ilo','sa8000']},
ungc:{voluntary:true,zh:'UNGC',en:'聯合國全球盟約',prob:'企業如何展示對永續發展和人權的承諾？UNGC提供一個全球最大的企業永續倡議平台，10項原則涵蓋人權、勞工、環境、反貪腐。',how:'10項原則：人權（1-2條）、勞工（3-6條）、環境（7-9條）、反貪腐（10條）。加入後每年需提交「進度通報（CoP）」，否則被移出。目前全球超過20,000家企業加入。',tw:'台灣超過100家企業加入UNGC。加入UNGC是展示國際ESG承諾的重要方式，對台灣想進入歐洲市場的企業尤其重要。',exam:'▸ UNGC 10項原則分4大領域（必記）\n▸ CoP年度進度通報要求\n▸ 未提交CoP→被移出盟約',num:'10項原則 ／ 全球>20,000家企業',who:'自願加入的企業（任何規模皆可）',rel:['sdgs','gri','ungp']},
ilo:{zh:'ILO 核心公約',en:'Intl Labour Organization Core Conventions',prob:'全球各地勞工標準差異巨大——有的地方允許童工、強迫勞動、禁止工會。ILO核心公約設定了全球最低勞工標準底線。',how:'8項核心公約：禁止童工（138號、182號）、禁止強迫勞動（29號、105號）、結社自由（87號）、集體協商（98號）、同等報酬（100號）、反就業歧視（111號）。供應鏈稽核（RBA、SA8000）均以ILO核心公約為標準。',tw:'台灣已批准部分ILO公約（精神），並在勞基法中落實。台灣外銷歐洲的企業，客戶會稽核ILO核心公約的遵循情況。',exam:'▸ ILO 8項核心公約（重點：禁童工、禁強迫、結社自由）\n▸ 是RBA、SA8000的標準基礎\n▸ CSDDD要求供應鏈盡職調查時參考ILO標準',num:'8項核心公約 ／ 188個成員國',who:'ILO成員國及在其境內運營的企業',rel:['csddd','rba','sa8000','ungp']},
rba:{zh:'RBA',en:'責任商業聯盟',prob:'電子供應鏈（蘋果、戴爾到台積電）遍佈全球，如何確保整條供應鏈都符合勞工、環境、道德標準？RBA提供電子業專屬的統一稽核標準。',how:'前身EICC，涵蓋：勞工（工時、工資、強迫勞動、童工）、健康安全、環境、管理體系、道德（反貪腐）。要求第三方VAP（驗證稽核程序）稽核，分公告和未公告稽核。',tw:'台灣電子業是全球RBA參與最密集的地區之一。台積電、鴻海、廣達等要求供應商通過RBA VAP稽核。台灣供應商每年接受大量RBA稽核。',exam:'▸ RBA=電子供應鏈標準（前身EICC）\n▸ VAP=驗證稽核程序（RBA特有）\n▸ 涵蓋：勞工/健安/環境/道德/管理\n▸ RBA vs SA8000（電子 vs 跨產業）',num:'全球超過6,000家成員企業',who:'電子供應鏈企業（台積電、鴻海的供應商）',rel:['csddd','ungp','ilo','sa8000','uflpa']},
sa8000:{zh:'SA8000',en:'Social Accountability 8000',prob:'電子業有RBA，但紡織、食品、化工等其他行業的供應鏈勞工標準呢？SA8000提供跨產業的第三方認證標準。',how:'由SAI制定，涵蓋9大標準：童工、強迫勞動、健康安全、結社自由與集體協商、歧視、懲戒措施、工時、薪酬、管理體系。需第三方機構現場稽核並頒發認證證書，有效期3年。',tw:'台灣紡織、製鞋、食品等產業的歐洲客戶常要求SA8000認證。與RBA不同，SA8000是認證（發證書），RBA是稽核（出報告）。',exam:'▸ SA8000 9大標準（重點：童工、強迫勞動、工時）\n▸ SA8000 vs RBA差異（跨產業vs電子；認證vs稽核）\n▸ 3年認證有效期',num:'9大標準 ／ 3年認證有效期',who:'紡織、食品、化工等非電子業供應鏈企業',rel:['rba','ungp','ilo','csddd']},
oecd:{zh:'OECD 指導方針',en:'OECD Guidelines for MNEs',prob:'跨國企業在東道國可能鑽法律漏洞，規避環保和勞工標準。OECD指導方針要求跨國企業在全球保持一致的負責任行為標準。',how:'OECD多國企業指導方針，適用於在OECD成員國和合作國境內商業活動的跨國企業。2023年更新版加入氣候和生物多樣性章節。設有「國家聯絡點（NCP）」處理企業申訴。',tw:'台灣雖非OECD成員，但台灣企業在OECD成員國（美、歐、日、澳）的投資須遵守。荷蘭NCP曾處理涉台企業投訴案。',exam:'▸ OECD指導方針 vs UNGP的關係（互補）\n▸ NCP（國家聯絡點）是申訴機制\n▸ 2023年更新版加入氣候章節',num:'2023年更新版 ／ OECD成員國38國',who:'在OECD成員國營業的跨國企業',rel:['ungp','ungc','csddd']},
equator:{voluntary:true,zh:'赤道原則',en:'Equator Principles',prob:'銀行資助大型基礎設施時，這些項目可能造成嚴重的環境破壞和人權侵害。赤道原則讓銀行把環境社會標準納入放貸決策。',how:'自願性的金融業框架（目前140家銀行採用）。適用於融資金額>1,000萬美元的大型專案。要求銀行評估專案的環境社會風險，分為三類：A類（高風險）、B類（中）、C類（低）。',tw:'台灣多家大型銀行（如玉山、台灣銀行）已簽署赤道原則。影響台灣銀行業的海外大型專案融資決策。',exam:'▸ 赤道原則：銀行業大型專案融資標準\n▸ 融資門檻：>1,000萬美元\n▸ 三類風險：A（高）/B（中）/C（低）',num:'>$1,000萬適用 ／ 140家銀行採用',who:'提供大型專案融資的銀行',rel:['ungp','sfdr','greenbond']},
sbtn:{voluntary:true,zh:'SBTN',en:'Science Based Targets Network',prob:'SBTi處理氣候減碳目標，但自然（土地、水、海洋、生物多樣性）的目標呢？SBTN是「自然版的SBTi」。',how:'2023年發布企業框架。要求企業針對自然設定科學基礎目標：陸地、淡水、海洋、生物多樣性四大系統。五步驟：評估→解讀→衡量→設定→揭露。',tw:'農業、採礦、食品等行業台灣企業需關注SBTN要求。目前仍為自願性，但趨勢向強制化發展。',exam:'▸ SBTN vs SBTi（自然 vs 氣候）\n▸ 四大自然系統：陸地、淡水、海洋、生物多樣性\n▸ 五步驟框架',num:'2023年企業框架發布（自願）',who:'農業、採礦、食品等自然依賴度高的行業（自願）',rel:['tnfd','gbf','sbti','naturalcap']},
fpic:{zh:'FPIC',en:'自由事先知情同意',prob:'採礦、農業開發常常在原住民傳統領地上進行，造成土地被剝奪、文化被破壞。FPIC要求在動土前必須獲得原住民族的真實同意。',how:'Free, Prior and Informed Consent。三個要素：①Free（無脅迫）②Prior（計畫開始前）③Informed（提供完整、真實資訊）。採礦、農業、林業、基礎設施開發的國際項目必須遵守。',tw:'台灣原住民族基本法已包含FPIC精神。台灣企業在東南亞、非洲投資採礦、農業時面臨FPIC要求。',exam:'▸ FPIC三要素：Free/Prior/Informed（必記）\n▸ 採礦、農業開發的核心人權議題\n▸ CSDDD盡職調查需考慮FPIC',num:'Free + Prior + Informed（三要素）',who:'在原住民傳統領地進行開發的採礦、農業、基礎設施企業',rel:['ungp','csddd','gbf']},
cbcr:{zh:'稅務透明 CbCR',en:'Country-by-Country Reporting',prob:'跨國企業透過移轉定價把利潤轉移到低稅地區（如開曼群島），逃避在真正創造價值地點的納稅義務。',how:'OECD要求全球營業額>7.5億歐元的跨國企業逐國提交「國別報告（CbCR）」，揭露各國的利潤、稅款、員工數、資產等資訊。是BEPS行動計畫的一部分。',tw:'台灣已要求符合規模門檻的跨國企業提交CbCR。台積電、台達電等大型跨國集團已建立CbCR合規系統。',exam:'▸ CbCR門檻：全球營業額>7.5億歐元\n▸ 是OECD BEPS行動計畫的工具\n▸ 目的：防止租稅規避',num:'門檻：>€7.5億全球營業額',who:'全球營業額>7.5億歐元的跨國企業',rel:['oecd','ungc']},
sdgs:{zh:'SDGs',en:'聯合國永續發展目標',prob:'全球面對的問題——貧窮、氣候、不平等、海洋污染——互相關聯，需要一個整合性的全球目標框架來引導各國和企業的行動。',how:'聯合國2030議程的17項目標、169項細項指標。與氣候相關的重點目標：SDG7（清潔能源）、SDG13（氣候行動）、SDG12（負責任消費）。企業常對照SDGs說明永續策略和貢獻。',tw:'台灣政院已訂定永續發展目標台灣版本（對標UN SDGs）。台灣上市公司永續報告書普遍對照SDGs揭露貢獻。',exam:'▸ SDGs共17項目標、169項指標（2030年截止）\n▸ 重要：SDG7清潔能源、SDG13氣候行動\n▸ SDG12負責任消費與生產',num:'17項目標 ／ 169項指標 ／ 2030年截止',who:'所有UN成員國政府及企業（自願對標）',rel:['ungc','gri','paris']},
sfdr:{zh:'SFDR',en:'永續金融揭露法規',prob:'金融機構大量推出「ESG基金」、「永續投資」，但標準不一，投資人無法判斷哪個真正有永續效益（綠色洗白）。SFDR提供統一分類。',how:'歐盟要求金融機構揭露永續相關風險和衝擊的法規。三類基金：第6條（無特定永續主張）、第8條（促進環境/社會特性）、第9條（以永續為投資目標）。要求揭露PAI（主要負面指標，14項強制+2項自選）。',tw:'台灣金管會參考SFDR制定本土永續金融分類指引。台灣金融業對歐盟客戶的基金銷售需符合SFDR分類。',exam:'▸ SFDR三類基金：6條/8條/9條（必考）\n▸ PAI：主要負面指標（Principal Adverse Impact）\n▸ 9條>8條>6條（嚴格程度）',num:'三類：第6條/8條/9條',who:'在歐盟市場提供金融產品服務的資產管理人',rel:['eutax','greenbond','esma','prisma']},
eutax:{zh:'EU Taxonomy',en:'歐盟永續金融分類法',prob:'什麼是「永續投資」？天然氣算不算？核能算不算？沒有統一定義。EU Taxonomy提供官方的「環境永續」定義。',how:'六大環境目標：①氣候變遷減緩 ②氣候變遷調適 ③水資源永續 ④循環經濟 ⑤污染防治 ⑥生物多樣性。任何活動被認定為「永續」必須：對至少一項目標有實質貢獻（TSC）、不顯著損害其他五項目標（DNSH）。',tw:'台灣金融業參考EU Taxonomy建立本土永續金融分類架構。影響台灣企業的綠色融資、綠色債券認定標準。',exam:'▸ EU Taxonomy六大環境目標（重點記前三項）\n▸ DNSH原則：不顯著損害（Do No Significant Harm）\n▸ TSC：對至少一項目標有實質貢獻',num:'六大環境目標 ／ DNSH原則',who:'歐盟金融機構 + CSRD適用企業',rel:['sfdr','greenbond','csrd','circular']},
esma:{zh:'ESMA ESG評級監管',en:'ESMA ESG Rating Regulation',prob:'MSCI、Sustainalytics等ESG評級機構影響力巨大，但不受任何監管，方法論不透明，同一企業評分差異巨大。',how:'歐盟金融監管局（ESMA）從2026年7月起，要求在歐盟提供ESG評級服務的機構取得授權。要求：方法論透明、避免利益衝突、揭露數據來源。',tw:'MSCI、Sustainalytics等評級機構需向ESMA申請授權，可能影響其對台灣企業的評分方法論。台灣金管會參考ESMA做法研議相關規範。',exam:'▸ ESMA 2026年7月起監管ESG評級機構\n▸ 主要機構：MSCI、Sustainalytics、富時羅素\n▸ 評級分歧問題（同企業不同機構評分差異大）',num:'2026年7月起監管授權',who:'在歐盟提供ESG評級服務的評級機構',rel:['issb','sfdr','gri']},
esgratin:{zh:'ESG評級',en:'ESG Rating (MSCI/Sustainalytics)',prob:'投資人想快速評估企業ESG表現，但閱讀每份永續報告書耗時費力。ESG評級機構提供綜合評分，但方法論不透明、各機構之間評分差異巨大。',how:'主要評級機構：MSCI（最廣泛，A-AAA等級）、Sustainalytics（以風險分數衡量）、富時羅素、標普全球。評分影響：進入ESG指數→吸引被動型基金資金流入。2026年ESMA開始監管評級機構。',tw:'台灣上市公司越來越重視MSCI ESG評級。台積電MSCI評級AA，在台灣企業中屬最高等級。',exam:'▸ 主要機構：MSCI、Sustainalytics\n▸ 評級分歧問題（相關性~0.6）\n▸ ESMA 2026年起監管評級機構\n▸ 影響ESG指數成分股',num:'評級相關性~0.6（機構間差異大）',who:'機構投資人 + 被評級的上市公司',rel:['esma','sfdr','issb','prisma']},
cap:{zh:'Cap-and-Trade',en:'總量管制與排放交易',prob:'如何確保排放量不超標，同時讓企業自己找到最便宜的減碳方式？Cap-and-Trade是最主流的答案。',how:'政府設定排放總量上限（cap），每年遞減；企業若排放超過分配配額，需從市場購買碳權；排放低於配額者可出售盈餘碳權。比起碳稅，cap確保排放量不超上限，但碳價波動較大。',tw:'台灣目前採碳費（不是cap-and-trade），但環境部已規劃2026-2027年試辦台灣版ETS，屆時轉換為真正的cap-and-trade體系。',exam:'▸ Cap-and-trade vs 碳稅（量確定vs價確定）\n▸ EU ETS是全球最大cap-and-trade\n▸ 台灣碳費≠cap-and-trade（但類似）\n▸ 台灣ETS試辦：2026-2027',num:'EU ETS年遞減4.3% ／ 台灣ETS試辦2026-2027',who:'被納入碳市場管制的企業（依各地ETS規定）',rel:['euets','twcf','vcm','eua']},
cfvst:{zh:'碳費 vs 碳稅',en:'Carbon Fee vs Carbon Tax',prob:'「碳費」和「碳稅」聽起來很像，但法律性質、收入用途、靈活性都不一樣。台灣採碳費而非碳稅，這個選擇有重要含義。',how:'碳稅：透過立法課稅，收入進一般財政，法律效力強。碳費：行政收費，由主管機關（環境部）收取，收入進氣候基金（專款），調整費率較靈活，但法律效力稍弱。台灣選擇碳費，主要考量政治可行性和政策靈活性。',tw:'台灣採碳費（而非碳稅），環境部可較靈活調整費率。但費率低（300元≈€9）仍是主要批評。碳費只是第一步，未來ETS才是主要工具。',exam:'▸ 碳稅（立法課稅）vs 碳費（行政收費）（必考）\n▸ 台灣採碳費（非碳稅）\n▸ 碳費收入→氣候基金（專款）\n▸ Cap-and-trade vs 碳稅/費（量vs價）',num:'台灣初期300元/噸（碳費）',who:'了解碳定價機制的企業和從業者',rel:['twcf','euets','cap']},
ghgpro:{zh:'GHG Protocol',en:'溫室氣體盤查議定書',prob:'企業都說要減碳，但用什麼方法計算碳排放？GHG Protocol就是全球通用的「碳排放計算方法學聖經」。',how:'由WRI與WBCSD聯合開發，是全球最廣泛使用的企業溫室氣體盤查框架。定義了Scope 1/2/3的計算方法，提供活動數據×排放係數的計算邏輯。ISSB、CSRD、台灣環境部的盤查要求均以GHG Protocol為基礎。',tw:'台灣環境部的溫室氣體盤查規定參考GHG Protocol架構。台灣企業的碳盤查報告幾乎全部依循GHG Protocol。',exam:'▸ GHG Protocol是全球最廣泛的盤查框架\n▸ 定義Scope 1/2/3（必考起源）\n▸ 市場基礎法vs位置基礎法（Scope 2）\n▸ ISSB、CSRD、台灣法規的基礎',num:'全球>90%的Fortune 500企業使用',who:'所有進行GHG盤查的企業',rel:['scope','iso14064','issb']},
scope:{zh:'Scope 1/2/3',en:'溫室氣體排放三範疇',prob:'企業排放的溫室氣體來源複雜——有自己燃燒的、有用電間接的、有供應鏈裡的。GHG Protocol設計了三個範疇清楚分類。',how:'Scope 1：直接排放（燃燒化石燃料、製程排放、逸散如冷媒外洩）。Scope 2：購入電力的間接排放（有市場基礎法和位置基礎法）。Scope 3：供應鏈上下游所有其他間接排放，分15個子類。Scope 3通常佔企業總排放的70-90%。',tw:'台灣金管會要求上市櫃公司揭露Scope 1&2；Scope 3為鼓勵性揭露。但ISSB S2要求全部揭露，未來台灣將跟進。',exam:'▸ 三個範疇定義（超高頻必考）\n▸ Scope 3有15個子類別\n▸ 市場基礎法vs位置基礎法（Scope 2）\n▸ Scope 3佔企業總排放70-90%',num:'Scope 3共15個子類 ／ 通常佔70-90%排放',who:'所有進行GHG盤查的企業',rel:['issb','ghgpro','iso14064','sbti','csrd']},
iso14064:{zh:'ISO 14064',en:'GHG盤查驗證國際標準',prob:'企業說自己的碳排放是X噸，但怎麼確認這個數字是真的？ISO 14064提供盤查方法學和第三方查證的標準。',how:'三個部分：ISO 14064-1（組織層級盤查，6大類別）、ISO 14064-2（專案層級盤查）、ISO 14064-3（查證標準）。組織邊界設定三種方法：①營運控制法（台灣主流）②財務控制法 ③股權比例法。',tw:'台灣強制盤查（>2.5萬噸）的企業需依ISO 14064-1盤查，並取得ISO 14064-3查證。查驗機構（BSI、SGS等）需取得ISO 14065認可。',exam:'▸ 14064-1（組織）vs 14064-2（專案）vs 14064-3（查證）\n▸ 組織邊界三種方法（營運控制法是台灣主流）\n▸ 6大排放類別\n▸ 查證 vs 確證的差異',num:'6大排放類別 ／ 三種組織邊界方法',who:'所有需要正式GHG盤查和查證的企業',rel:['ghgpro','scope','iso14067','twcf']},
iso14067:{zh:'ISO 14067',en:'產品碳足跡標準',prob:'供應商出口歐洲、回應客戶要求時，需要知道每一個產品產生了多少碳。ISO 14067就是計算產品碳足跡（PCF）的標準。',how:'以LCA（生命週期評估）方法計算產品碳足跡，涵蓋原料取得→製造→運輸→使用→廢棄全流程。兩種系統邊界：搖籃到大門（生產階段）和搖籃到墳墓（全生命週期）。CBAM要求的「內嵌排放量」計算依此標準。',tw:'台灣碳標籤制度依ISO 14067。CBAM要求台灣鋼鐵、鋁業提供內嵌排放量，計算依據就是ISO 14067。',exam:'▸ PCF=產品碳足跡（Product Carbon Footprint）\n▸ 搖籃到大門 vs 搖籃到墳墓（必考差異）\n▸ CBAM「內嵌排放量」依此計算\n▸ LCA四階段（目標範疇→清單分析→衝擊評估→詮釋）',num:'搖籃到大門 or 搖籃到墳墓兩種邊界',who:'需計算產品碳足跡的製造商（特別是出口歐盟）',rel:['cbam','iso14064','iso14068','trec']},
iso14068:{zh:'ISO 14068-1',en:'碳中和標準',prob:'企業想宣稱「碳中和產品」，但如果只是買了劣質碳信用抵換就宣稱碳中和，這是漂綠。ISO 14068提供碳中和的嚴格標準和查證要求。',how:'三步驟：①量化（依ISO 14064或14067）②減少（先盡力減碳）③移除或抵換剩餘（只有在充分減碳後才能用CDR或高品質VCM抵換）。需取得第三方查證才能對外宣稱碳中和。',tw:'台灣企業宣稱「碳中和產品或服務」必須依ISO 14068並取得查證，否則屬漂綠。台灣環境部已公告此標準為官方依循規範。',exam:'▸ 碳中和三步驟：量化→減少→抵換/移除\n▸ 碳中和 vs 淨零差異\n▸ 必須取得第三方查證\n▸ 先減碳再抵換（順序重要）',num:'三步驟：量化→減少→抵換/移除',who:'宣稱碳中和的企業和產品',rel:['vcm','cdr','iso14064','iso14067']},
supchain:{zh:'供應鏈減碳壓力',en:'Supply Chain Decarbonization',prob:'台灣是全球供應鏈的核心，蘋果、BMW、Nike等品牌對供應商的ESG要求越來越嚴格。不減碳，可能就失去訂單。',how:'主要壓力來源：①蘋果（2030年100%RE + Scope 3減碳），要求台灣供應商加入RE100、設SBTi目標 ②BMW（2030年Scope 3減少40%）③CSRD Scope 3揭露要求迫使歐洲品牌向台灣供應商要求碳數據 ④CSDDD要求人權盡職調查報告。',tw:'台灣製造業（半導體、電子、鋼鐵、紡織）面臨的最直接ESG壓力就來自客戶。這是推動台灣企業做碳盤查、申請SBTi最強的外部動力。',exam:'▸ 供應鏈減碳的主要驅動：客戶要求（蘋果/BMW等）\n▸ CSRD Scope 3揭露要求影響供應鏈\n▸ PACT框架：標準化PCF數據交換\n▸ SBTi是客戶要求的主要減碳承諾工具',num:'蘋果2030年Scope 3目標 ／ BMW 2030減40%',who:'台灣製造業供應商（半導體、電子、鋼鐵、紡織）',rel:['csrd','csddd','sbti','re100','iso14067']},
vcm:{voluntary:true,zh:'VCM',en:'自願性碳市場',prob:'企業想宣稱「碳中和」，但自己的減碳還不夠。可以購買別人的碳信用來抵換——但哪些碳信用是真實有效的？VCM就是這個市場加上品質管控機制。',how:'企業或個人自願購買碳信用以抵換排放的市場。碳信用來源：再生能源、植林、CCUS、藍碳等。主要認證機構：Verra（VCS標準）、Gold Standard。ICVCM制定CCP標籤，識別高品質碳信用。',tw:'TCEX（台灣碳交易所）是本土VCM平台，2023年成立。目前以國際碳信用交易為主，本土碳信用（自願減量額度）即將上路。',exam:'▸ VCM vs 強制碳市場（EU ETS）的差異\n▸ CCP是VCM品質認證標準\n▸ Verra（VCS）、Gold Standard是主要認證機構\n▸ 碳信用用於ISO 14068碳中和聲明',num:'全球VCM市場規模：數百億美元',who:'自願購買碳信用的企業和個人',rel:['ccp','eua','redd','itmo','tcex','iso14068']},
ccp:{zh:'CCP',en:'碳信用核心原則',prob:'VCM充斥低品質甚至造假的碳信用——企業買了，但碳排根本沒有真正被抵消。CCP是用來識別「真正有效」碳信用的品質標章。',how:'ICVCM（完整性理事會）制定的10項核心原則，包含：真實性、額外性（沒有這個計畫就不會減碳）、永久性、無雙重計算等。通過CCP認定的碳信用可獲CCP標籤，交易價格更高、更受機構投資人認可。',tw:'TCEX已開始引進CCP認可的碳信用，確保交易品質。台灣企業購買CCP碳信用用於ISO 14068碳中和聲明。',exam:'▸ CCP是ICVCM制定的品質認證標準\n▸ 核心10項原則（重點：額外性、永久性、無雙重計算）\n▸ VCMI是規範企業「如何使用」碳信用的配套框架',num:'10項核心原則',who:'碳信用買家（企業）和賣家（項目開發商）',rel:['vcm','pacm','cdm']},
eua:{zh:'EUA',en:'歐洲排放配額',prob:'EU ETS要運作，需要有一個可以交易的具體單位。EUA就是這個單位——可以買賣的一噸CO₂排放權。',how:'EU ETS的基本交易單位，1 EUA = 1噸CO₂e。企業每年清繳等量EUA抵消實際排放量。獲取途徑：①免費分配（逐年減少）②市場購買 ③政府拍賣。碳價€60-80/噸，波動受能源價格、天氣、政策影響。',tw:'CBAM的收費基準就是EU ETS碳價。台灣碳費（300元≈€9）遠低於EUA（€65），這個差距就是台灣出口商在CBAM上的額外成本。',exam:'▸ EUA=1噸CO₂e（EU ETS基本單位）\n▸ 與碳信用（VCM）的區別（強制vs自願）\n▸ CBAM費率與EUA碳價掛鉤',num:'€60-80/噸（現價） ／ 1 EUA = 1噸CO₂e',who:'EU ETS管制範圍內的歐洲企業',rel:['euets','vcm','cbam','cap']},
redd:{voluntary:true,zh:'REDD+',en:'減少森林砍伐碳匯',prob:'全球森林砍伐佔全球排碳約10-15%，如何用市場機制讓開發中國家有動力保護森林而不砍伐變現？',how:'聯合國REDD+框架：開發中國家透過保護森林或減少砍伐，獲得以森林碳匯為基礎的碳信用。主要挑戰：基準線設定、洩漏（這片不砍換到別片砍）、永久性（砍了怎辦）。',tw:'台灣企業可購買REDD+碳信用（經VCS認證的林業碳匯）用於自願碳中和。',exam:'▸ REDD+是開發中國家的林業碳匯機制\n▸ 主要挑戰：洩漏、基準線、永久性\n▸ 與VCM/VCS的關係',num:'全球森林砍伐佔排碳~10-15%',who:'開發中國家政府 + 購買林業碳信用的企業',rel:['vcm','ccp','cdr','fsc']},
tcex:{zh:'TCEX',en:'台灣碳交易所',prob:'台灣企業想購買碳信用用於碳中和聲明，但沒有官方認可的交易平台，碳信用品質無法保證。',how:'2023年成立於高雄，由台灣證交所與國發會合資設立。目前提供國際碳信用（CCP認可）交易平台；未來將整合本土自願減量碳信用；長期目標銜接台灣ETS。',tw:'TCEX是台灣碳市場的基礎設施。企業購買TCEX碳信用可用於ISO 14068碳中和聲明，未來也可能用於抵減部分碳費。',exam:'▸ TCEX成立背景：2023年、高雄、台灣證交所+國發會\n▸ 目前功能：國際碳信用交易\n▸ 台灣唯一官方VCM平台',num:'2023年成立 ／ 台灣唯一官方VCM平台',who:'台灣企業（購買碳信用）',rel:['vcm','twcf','itmo','iso14068']},
trec:{zh:'T-REC',en:'台灣再生能源憑證',prob:'企業想讓Scope 2（購電）達到零碳，但台灣電力大部分仍是火力發電。T-REC提供一個機制，讓企業的用電可以「掛牌」為再生能源。',how:'1張T-REC = 1,000度（1 MWh）再生能源電力。企業購買T-REC可作為Scope 2「市場基礎法」的零排放依據。取得途徑：①直接購買（台電T-REC交易平台）②搭配CPPA長期購電合約。',tw:'T-REC是目前台灣企業達成Scope 2零碳的主要工具（CPPA供應仍不足）。台灣T-REC需求快速增長，價格也持續上升。',exam:'▸ 1張T-REC = 1,000度（1 MWh）再生能源\n▸ Scope 2市場基礎法的依據\n▸ T-REC vs CPPA差異（當期購買 vs 長期合約）\n▸ RE100達成的主要工具',num:'1張 = 1 MWh ／ 市場基礎法依據',who:'需要Scope 2零碳的台灣企業',rel:['re100','cppa','scope','twpath']},
cppa:{zh:'CPPA',en:'企業購電合約',prob:'T-REC是當期購買，價格波動。企業如果想鎖定長期綠電價格並確保穩定供應，需要直接與發電商簽長期合約。',how:'Corporate Power Purchase Agreement，企業直接與再生能源發電商簽訂長期購電合約（通常10-20年），取得綠電及T-REC，鎖定電價並確保供應穩定性。台灣電業法2017年修正後開放CPPA。台積電已與沃旭（Ørsted）等離岸風電商簽訂大型CPPA。',tw:'台積電是台灣CPPA最大買家。電網限制仍是主要障礙（綠電送不到需求端）。',exam:'▸ CPPA vs T-REC差異（長期合約 vs 當期購買）\n▸ 台灣電業法2017年開放\n▸ 鎖定長期綠電價格+確保穩定供應',num:'合約期通常10-20年',who:'有長期大量綠電需求的企業（如台積電）',rel:['trec','re100','scope','twpath']},
greenbond:{zh:'綠色債券',en:'Green Bond',prob:'企業需要大量資金投入再生能源、節能建築等綠色計畫，但一般債券的資金流向不受限制。綠色債券確保資金專用於綠色用途。',how:'募集資金專門用於符合環境效益的計畫（再生能源、節能建築、清潔交通）的債券，需符合ICMA《綠色債券原則》，並進行第三方驗證。與SLB的差異：綠色債券限定資金用途，SLB限定績效指標但資金不限用途。',tw:'台灣2023年綠色債券發行規模超過700億台幣。台積電、元大金等已發行綠色債券。台灣證交所設有綠色債券平台。',exam:'▸ 綠色債券 vs SLB：資金用途限定 vs 績效指標掛鉤（必考）\n▸ ICMA綠色債券原則（標準依據）\n▸ 需第三方驗證',num:'台灣2023年：>700億台幣',who:'需要綠色計畫融資的企業和政府',rel:['slb','eutax','sfdr','transitfin']},
slb:{zh:'SLB',en:'永續連結債券',prob:'綠色債券只適合有明確綠色投資計畫的企業。如果企業想整體轉型（如鋼廠要綠化），資金用途難以明確區分。SLB讓績效指標掛鉤利率，更靈活。',how:'利率與企業永續績效指標（SPT，如減碳目標達成率、再生能源使用比例）掛鉤的債券。若未達目標，利率加碼（懲罰機制）；達標維持原利率。資金用途不限。',tw:'台灣環境部、部分上市公司已發行SLB。SLB適合資金用途難以拆分的企業（零售業、食品業）。',exam:'▸ SLB vs 綠色債券：績效指標 vs 資金用途（必考）\n▸ SPT=永續績效目標（發行人自設）\n▸ 未達標→利率加碼',num:'全球SLB市場快速成長',who:'希望整體轉型但資金用途難以明確的企業',rel:['greenbond','sbti','transitfin']},
transitfin:{zh:'轉型金融',en:'Transition Finance',prob:'綠色債券和SLB主要服務已經很「綠」的企業，但最需要資金的是高碳排行業（鋼鐵、水泥、化工）的轉型。轉型金融就是專為這些「棕色」企業設計的。',how:'協助高碳排行業（鋼鐵、航空、石化、水泥）走向低碳的金融產品和服務。GFANZ（格拉斯哥金融聯盟，130兆美元）是主要推動機構。轉型計畫必須可信、有時間表且符合巴黎協定路徑。',tw:'台灣鋼鐵業（中鋼）、石化業（台塑）是轉型金融的潛在受益者。台灣金融業正研究如何設計符合國際標準的轉型金融產品。',exam:'▸ 轉型金融 vs 綠色金融（服務高碳排轉型 vs 已很綠的企業）\n▸ GFANZ：格拉斯哥金融聯盟\n▸ 轉型計畫需符合巴黎協定路徑',num:'GFANZ管理資產：130兆美元',who:'高碳排行業（鋼鐵、水泥、航空、石化）的融資需求',rel:['greenbond','slb','paris','sbti']},
prisma:{voluntary:true,zh:'PRI',en:'責任投資原則',prob:'機構投資人管理的資金龐大，他們的投資決策直接影響企業的ESG表現。PRI建立一套框架，讓機構投資人把ESG因素納入投資分析和決策。',how:'UN-supported Principles for Responsible Investment，聯合國主導。六項原則：納入ESG因素進入投資分析、實踐負責任的所有權、要求被投資企業揭露ESG等。目前超過5,000家機構投資人簽署，管理資產超過130兆美元。',tw:'台灣退休基金（勞退、公退）已開始將ESG因素納入投資評估。台灣金融業簽署PRI數量快速增加。',exam:'▸ PRI六項原則（重點：ESG納入投資分析）\n▸ 管理資產：>130兆美元\n▸ 驅動企業ESG揭露的重要力量',num:'>5,000家機構 ／ 管理資產>130兆美元',who:'機構投資人（資產管理公司、退休基金、保險公司）',rel:['sfdr','cdp','issb','greenbond']},
esco:{zh:'ESCO',en:'能源服務公司',prob:'工廠知道節能可省錢，但沒有初期投資資金怎麼辦？ESCO模式讓企業不需自己出錢就能進行節能改造。',how:'Energy Service Company。ESCO公司替企業執行節能改善，投資由ESCO預先墊付，再以節省下來的能源費用逐月回收成本（EPC合約）。M&V（測量與查核）驗證實際節能量。企業零初期成本、按期分享節能效益。',tw:'台灣能源局推動ESCO保證節能量制度。台灣中小企業可申請綠色融資搭配ESCO服務。ISO 50001能源管理系統常配合ESCO導入。',exam:'▸ ESCO核心：EPC合約（ESCO墊付投資，節能費回收）\n▸ M&V：測量與查核（驗證節能量）\n▸ 台灣能源局有ESCO補助計畫',num:'企業零初期成本 ／ 節能費回收投資',who:'有節能需求但缺乏初期投資資金的工廠',rel:['twpath','iso50001']},
iso50001:{zh:'ISO 50001',en:'能源管理系統',prob:'企業想系統性地管理能源使用，持續降低能耗，而不是碰到電費帳單才想到節能。ISO 50001提供一套PDCA循環的能源管理系統。',how:'能源管理系統（EnMS）標準，採用PDCA循環：能源政策→能源規劃→實施→查核→管理審查。重要概念：EnB（能源基準線）、EnPI（能源績效指標）、SEU（顯著能源使用）。',tw:'台灣能源局已要求電力、鋼鐵、石化等能源密集行業建立EnMS，並以ISO 50001為依循標準。可結合ESCO服務降低導入成本。',exam:'▸ ISO 50001採用PDCA循環\n▸ SEU=顯著能源使用（必記）\n▸ EnB=能源基準線；EnPI=能源績效指標\n▸ 台灣能源密集行業強制建立EnMS',num:'PDCA循環 ／ SEU/EnB/EnPI三核心概念',who:'能源密集行業（電力、鋼鐵、石化、半導體等）',rel:['esco','twpath','scope']},
saf:{zh:'SAF',en:'永續航空燃料',prob:'航空業難以電氣化（電池太重），但繼續燒傳統航空煤油無法達成淨零。SAF用生物質或合成方式生產，可直接用於現有飛機引擎。',how:'Sustainable Aviation Fuel。原料：廢食用油（UCO）、農業廢料、木質素、電合成（Power-to-Liquid）。減碳效果：vs 傳統航油減碳70-90%（全生命週期）。目前比傳統航油貴3-5倍；2023年全球SAF只佔航空燃料0.1%。歐盟要求2025年起2%摻混比例。',tw:'長榮、華航已在部分航線測試SAF混摻。台灣桃園機場目標成為亞太SAF供應樞紐。台灣生質能源供應鏈正在建立。',exam:'▸ SAF=永續航空燃料（減碳70-90%）\n▸ CORSIA可用SAF100%抵減義務\n▸ 目前比傳統航油貴3-5倍\n▸ 歐盟2025年起2%摻混要求',num:'減碳70-90% ／ 目前佔比僅0.1%',who:'航空公司（長榮、華航）、機場、SAF生產商',rel:['corsia','imo','p2x','greenamm']},
p2x:{zh:'Power-to-X',en:'P2X 綠能轉化技術',prob:'再生能源（太陽能、風能）是間歇性的——白天過剩、夜晚不足。P2X把過剩的綠電轉化成可儲存、可輸送的能源載體（氫、氨、甲醇等）。',how:'Power-to-X是綠氫的上位概念。X可以是：氫（P2H）、氨（P2A）、甲醇（P2M，航運燃料）、e-fuel（P2L，液態合成燃料，航空業）。技術鏈：再生能源→電解水→綠氫→合成各種X。',tw:'台灣離岸風電過剩電力可用於P2H製造綠氫，再合成綠氨或e-fuel出口。台灣正評估P2X作為能源出口戰略。',exam:'▸ P2X=Power-to-X（綠氫的上位概念）\n▸ P2H→P2A→P2M→P2L（轉化鏈）\n▸ 解決再生能源儲存+跨境輸送問題\n▸ 適用難以直接電氣化的行業',num:'技術鏈：RE→電解→綠氫→合成X',who:'能源業、航運業、航空業、化工業',rel:['greenh2','greenamm','saf','imo']},
netzero:{voluntary:true,zh:'Net Zero / 淨零',en:'淨零排放目標',prob:'碳中和只需要把剩餘排放用碳信用抵換，但如果碳信用品質不好，等於白說。淨零要求先大幅削減（>90%），再用碳移除（CDR）抵銷剩餘。',how:'企業或國家的GHG排放量，在大幅削減後（通常≥90%），剩餘排放被碳移除（CDR）所抵銷，達到排放與移除的淨平衡。IPCC要求全球2050年達到淨零。SBTi淨零標準要求：Scope 1&2削減≥90%，然後才能用高品質CDR抵銷。',tw:'台灣「2050淨零排放路徑」是國家目標，12項關鍵策略為執行架構。台灣碳費、ETS、能源轉型都是達成淨零的政策工具。',exam:'▸ 淨零 vs 碳中和差異（先削減≥90%才能抵換）（必考）\n▸ IPCC：2050年全球淨零\n▸ SBTi淨零標準：Scope 1&2削減≥90%',num:'2050年全球淨零目標 ／ 削減≥90%才可抵換',who:'設定淨零目標的企業和國家政府',rel:['sbti','cdr','paris','twpath']},
cdr:{zh:'CDR',en:'碳移除技術',prob:'即使全力節能減碳，部分行業（如鋼鐵、水泥、航空）仍有「難以消除的剩餘排放」。淨零的最後一塊拼圖，就是把這些CO₂從大氣中移除掉。',how:'自然移除：植林造林、土壤碳匯、藍碳（紅樹林、海草床）——成本低但永久性較弱。工程移除：DAC（直接空氣捕捉）、BECCS（生物能源+碳捕捉）——成本高但永久性強。CDR是淨零達成的必要補充，但不能取代實質減碳。',tw:'台灣林業碳匯、海洋藍碳（大肚溪口濕地）是本土CDR重要來源，可申請TCEX的碳信用。台灣2050淨零路徑將CDR列為必要技術。',exam:'▸ CDR分自然碳匯 vs 工程移除\n▸ 用於抵銷「難以消除的剩餘排放」\n▸ 不能取代實質減碳（SBTi要求先減90%）\n▸ DAC成本最高但永久性最佳',num:'需抵銷全球剩餘排放 ／ 成本$50-1,000/噸不等',who:'設定淨零目標的企業和國家',rel:['netzero','dac','ccus','bluec','vcm']},
dac:{zh:'DAC',en:'Direct Air Capture 直接空氣碳捕捉',prob:'CCUS從工廠煙道捕捉CO₂，但已排放到大氣中的CO₂怎麼辦？DAC直接從空氣中捕捉CO₂，是最靈活但最昂貴的負碳技術。',how:'直接從大氣中捕捉CO₂（約400ppm）。技術類型：固態DAC（吸附劑）和液態DAC（鹼液吸收）。捕捉的CO₂可封存地下（永久移除）或用於合成燃料（e-fuel）。成本目前$300-1,000/噸，IRA 45Q最高補貼$180/噸。',tw:'台灣目前無商業規模DAC，主要關注CCUS。但台積電等企業已評估採購DAC碳信用以達成淨零目標。',exam:'▸ DAC vs CCUS差異（大氣 vs 工廠煙道）\n▸ DAC成本最高（$300-1,000/噸）但永久性最佳\n▸ IRA 45Q補貼：最高$180/噸\n▸ 是高品質CDR的代表',num:'成本：$300-1,000/噸 ／ 永久性最佳',who:'設定淨零目標的科技公司、航空業（需高品質CDR）',rel:['ccus','cdr','netzero','ira']},
ccus:{zh:'CCUS',en:'碳捕捉利用與封存',prob:'鋼鐵、水泥、化工等行業難以完全電氣化，仍有大量製程排碳。CCUS在排放源頭把CO₂抓住，避免進入大氣。',how:'Carbon Capture, Utilization and Storage。從工業煙道氣捕捉CO₂，再利用（製成化學品、燃料）或封存（地質構造注入）。CCUS（含利用）vs CCS（只封存）。成本約$50-100/噸。IRA 45Q補貼最高$85/噸（封存）。',tw:'台灣CCUS面臨的挑戰：適合地質封存的場址有限（台灣多地震）。目前中鋼與工研院合作在高爐試驗CO₂捕捉技術。',exam:'▸ CCUS vs CCS（含利用 vs 只封存）\n▸ CCUS vs DAC（煙道 vs 大氣）\n▸ 工程型碳移除（非自然碳匯）\n▸ IRA 45Q：$85/噸封存補貼',num:'成本：$50-100/噸 ／ IRA 45Q：$85/噸',who:'鋼鐵、水泥、化工、發電等高碳排工業',rel:['dac','cdr','ira','cbam']},
greenh2:{zh:'綠氫 / 藍氫',en:'Green / Blue Hydrogen',prob:'鋼鐵、航運、重工業很難用電力替代化石燃料，但氫能可以。問題是現有「灰氫」（天然氣重組，不捕碳）仍大量排碳，需要「綠氫」或「藍氫」取代。',how:'綠氫：用再生能源電解水（零碳），成本$4-10/kg，是終極目標。藍氫：天然氣重組+CCUS（過渡期低碳），成本較低。灰氫：現有主流，不捕碳，高排放。IRA 45V對綠氫最高補貼$3/kg，大幅降低成本。',tw:'台灣中油、台電已啟動氫能示範計畫。台灣氫能以「進口藍氫+本土綠氫」雙軌策略。台中發電廠試驗天然氣混氫發電。',exam:'▸ 綠氫（電解水）vs 藍氫（天然氣+CCUS）vs 灰氫（天然氣，不捕碳）\n▸ IRA 45V綠氫補貼：最高$3/kg\n▸ 應用：鋼鐵DRI、航運、重工業',num:'綠氫：$4-10/kg ／ IRA 45V：最高$3/kg',who:'鋼鐵業、航運業、重工業、電力業',rel:['ira','ccus','p2x','greenamm','imo']},
greenamm:{zh:'綠氨',en:'Green Ammonia',prob:'航運業尋找接替重燃油的零碳燃料。綠氨（用綠氫合成）是最有潛力的選項之一——能量密度高、儲存基礎設施可改建。',how:'用綠氫（H₂）和氮氣（N₂，空氣中取得）合成氨（NH₃）。優點：液化溫度高（-33°C），比液氫（-253°C）儲存容易；能量密度比液氫高。IMO 2050的零碳燃料路徑中，氨是主要候選之一。',tw:'台灣中油已評估氨進口和利用。台灣發電業測試氨混燃。台灣造船業關注氨燃料船設計。',exam:'▸ 綠氨=綠氫+氮氣合成\n▸ IMO零碳燃料候選之一\n▸ 燃燒氨→NOx需處理（挑戰）',num:'氨沸點-33°C（比液氫-253°C易儲存）',who:'航運業、電力業、農業（化肥原料）',rel:['greenh2','imo','p2x','saf']},
gbf:{zh:'GBF 30x30',en:'全球生物多樣性框架',prob:'全球生物多樣性危機：物種滅絕速度是自然速度的100倍，生態系統服務（水源、授粉、糧食）面臨崩潰風險。需要一個像巴黎協定一樣的全球框架。',how:'2022年COP15（昆明-蒙特婁）通過。核心目標「30x30」：到2030年保護30%陸地和30%海洋。23個目標涵蓋：減少生物多樣性有害補貼、減少農藥污染、恢復退化生態系。',tw:'台灣農業部推動生態系統服務評估與棲地保育。台灣珊瑚礁、濕地、山地森林是重要生物多樣性熱點。',exam:'▸ GBF核心：30x30目標（2030年保護30%陸地和海洋）\n▸ 2022年COP15昆明-蒙特婁通過\n▸ TNFD是GBF的企業層面執行工具\n▸ 與巴黎協定的平行地位',num:'2030年保護30%陸地+30%海洋',who:'UN成員國政府 + 農業、採礦、食品等依賴自然的企業',rel:['tnfd','sbtn','bluec','naturalcap']},
naturalcap:{voluntary:true,zh:'自然資本',en:'Natural Capital',prob:'企業在財務報表上看不到森林、地下水、土壤的價值，所以決策時常常忽視對這些資源的破壞。自然資本把生態系統服務轉化成可評估的財務語言。',how:'將生態系統提供的服務（潔淨水源、授粉、氣候調節、糧食生產）視為具有經濟價值的資本，進行量化評估。評估方法：TEEB（生態系統和生物多樣性經濟學）、ENCORE（自然資本風險工具）。',tw:'台灣農業部推動生態系統服務評估。濕地、森林碳匯在台灣是重要自然資本，也是CDR的潛在來源。',exam:'▸ 自然資本=生態系統服務的貨幣化評估\n▸ TNFD的評估基礎\n▸ ENCORE是主要評估工具',num:'全球自然資本每年提供>100兆美元服務',who:'農業、採礦、食品、基礎設施等高自然依賴行業',rel:['tnfd','gbf','cdr','bluec']},

function getLayer(key){return LAYER_DEFS.find(l=>l.terms.includes(key));}
function totalCount(){return LAYER_DEFS.reduce((s,l)=>s+l.terms.length,0);}
function allTermKeys(){return LAYER_DEFS.flatMap(l=>l.terms);}

/* ════════════════════════════════
   PANELS
════════════════════════════════ */
function togglePanel(name){
  if(openPanel===name){openPanel=null; el('add-panel').style.display='none'; return;}
  el('add-panel').style.display='none';
  openPanel=name;
  el('add-panel').style.display='block';
  if(name==='add'){
    populateLayerSelect('nl');
    el('na').value=''; el('nz').value=''; el('np').value=''; el('nh').value='';
    el('ntw').value=''; el('ne').value=''; el('nn').value=''; el('nw').value='';
    el('nvol').checked=false;
    el('na').focus();
  }
}

function closeModal(){
  el('edit-panel').style.display='none';
  el('ai-panel').style.display='none';
  el('modal-bg').style.display='none';
  el('ai-result-wrap').style.display='none';
  el('ai-loading').style.display='none';
  openPanel=null;
  document.body.style.overflow='';
}

function closeEdit(){closeModal();}
function closeAI(){closeModal();}

/* ════════════════════════════════
   LAYER SELECT POPULATOR
════════════════════════════════ */
function populateLayerSelect(id){
  const s=el(id);
  s.innerHTML=LAYER_DEFS.map(l=>`<option value="${l.id}">${l.num} ${l.name}</option>`).join('');
}

/* ════════════════════════════════
   ADD TERM
════════════════════════════════ */
function addTerm(){
  const abbr=el('na').value.trim();
  if(!abbr){el('na').style.outline='1px solid #D85A30'; el('na').focus(); return;}
  if(D[abbr]){alert('「'+abbr+'」已存在！請使用其他縮寫。'); return;}
  const layerId=el('nl').value;
  const layer=LAYER_DEFS.find(l=>l.id===layerId);
  if(!layer) return;
  D[abbr]={
    zh:el('nz').value.trim()||abbr,
    en:'',
    prob:el('np').value.trim()||'（待補充）',
    how:el('nh').value.trim()||'（待補充）',
    tw:el('ntw').value.trim()||'（待補充）',
    exam:el('ne').value.trim()||'',
    num:el('nn').value.trim()||'',
    who:el('nw').value.trim()||'',
    voluntary:el('nvol').checked,
    rel:[],
  };
  layer.terms.push(abbr);
  togglePanel('add');
  render();
  // Auto-select the new term
  setTimeout(()=>selectTerm(abbr),100);
}

/* ════════════════════════════════
   EDIT TERM
════════════════════════════════ */
function openEdit(key){
  editKey=key;
  const t=D[key]; if(!t) return;
  const layer=getLayer(key);
  el('ea').value=key;
  el('ez').value=t.zh||'';
  populateLayerSelect('el');
  if(layer) el('el').value=layer.id;
  el('ep').value=t.prob||'';
  el('eh').value=t.how||'';
  el('etw').value=t.tw||'';
  el('ee').value=t.exam||'';
  el('en2').value=t.num||'';
  el('ew').value=t.who||'';
  el('ai-panel').style.display='none';
  el('edit-panel').style.display='block';
  el('modal-bg').style.display='block';
  document.body.style.overflow='hidden';
  openPanel='edit';
}

function saveEdit(){
  if(!editKey||!D[editKey]) return;
  const t=D[editKey];
  const newLayerId=el('el').value;
  // Move between layers if needed
  const curLayer=getLayer(editKey);
  if(curLayer && curLayer.id!==newLayerId){
    curLayer.terms=curLayer.terms.filter(k=>k!==editKey);
    const newLayer=LAYER_DEFS.find(l=>l.id===newLayerId);
    if(newLayer) newLayer.terms.push(editKey);
  }
  t.zh=el('ez').value.trim();
  t.prob=el('ep').value.trim();
  t.how=el('eh').value.trim();
  t.tw=el('etw').value.trim();
  t.exam=el('ee').value.trim();
  t.num=el('en2').value.trim();
  t.who=el('ew').value.trim();
  closeEdit();
  render();
  renderDetail(editKey);
}

function openAI(key){
  aiKey=key; aiResult=null;
  const t=D[key]; if(!t) return;
  el('edit-panel').style.display='none';
  el('ai-panel').style.display='block';
  el('modal-bg').style.display='block';
  document.body.style.overflow='hidden';
  openPanel='ai';
  el('ai-result-wrap').style.display='none';
  el('ai-loading').style.display='none';
  el('ai-hint').value='';
  el('ai-run-btn').disabled=false;
}

async function runAI(){
  if(!aiKey||!D[aiKey]) return;
  const apikey=getApiKey(); if(!apikey) return;
  const t=D[aiKey];
  const hint=el('ai-hint').value.trim();
  el('ai-loading').style.display='block';
  el('ai-result-wrap').style.display='none';
  el('ai-run-btn').disabled=true;
  const prompt=`你是ESG永續領域的專家，請為以下ESG名詞重新生成說明內容，以台灣企業和從業者為受眾。
名詞縮寫：${aiKey}
中文名稱：${t.zh}
現有說明：
- 解決什麼問題：${t.prob||'無'}
- 怎麼運作：${t.how||'無'}
- 台灣影響：${t.tw||'無'}
${hint?'用戶補充說明：'+hint:''}

請以JSON格式回覆，包含以下欄位：prob（解決什麼問題，2-3句話）、how（怎麼運作，3-5句話）、tw（台灣影響，2-3句台灣具體案例）、exam（考試重點，每點以▸開頭，3-5點）、num（關鍵數字，20字以內）、who（適用對象，20字以內）。只回JSON，不要Markdown代碼塊或其他文字。`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apikey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,messages:[{role:'user',content:prompt}]})
    });
    const data=await resp.json();
    if(data.error){throw new Error(data.error.message);}
    const text=(data.content||[]).map(c=>c.text||'').join('');
    const clean=text.replace(/```json|```/g,'').trim();
    aiResult=JSON.parse(clean);
    el('ai-result').innerHTML=[
      {label:'解決什麼問題',val:aiResult.prob},
      {label:'怎麼運作',val:aiResult.how},
      {label:'台灣影響',val:aiResult.tw},
      {label:'考試重點',val:aiResult.exam},
      {label:'關鍵數字',val:aiResult.num},
      {label:'適用對象',val:aiResult.who},
    ].map(f=>`<div class="af"><div class="af-label">${f.label}</div><div class="af-val">${(f.val||'').replace(/\n/g,'<br>')}</div></div>`).join('');
    el('ai-result-wrap').style.display='block';
  }catch(e){
    el('ai-result').innerHTML=`<div style="color:#F0997B">生成失敗：${e.message}<br><small>請確認 API Key 是否正確，以及是否有足夠的 credits。</small></div>`;
    el('ai-result-wrap').style.display='block';
  }finally{
    el('ai-loading').style.display='none';
    el('ai-run-btn').disabled=false;
  }
}

function applyAI(){
  if(!aiKey||!aiResult||!D[aiKey]) return;
  const t=D[aiKey];
  if(aiResult.prob) t.prob=aiResult.prob;
  if(aiResult.how) t.how=aiResult.how;
  if(aiResult.tw) t.tw=aiResult.tw;
  if(aiResult.exam) t.exam=aiResult.exam;
  if(aiResult.num) t.num=aiResult.num;
  if(aiResult.who) t.who=aiResult.who;
  closeAI();
  renderDetail(aiKey);
}

async function runAIFill(){
  const abbr=el('na').value.trim();
  if(!abbr){el('na').style.outline='1px solid #D85A30'; el('na').focus(); alert('請先填入縮寫'); return;}
  const apikey=getApiKey(); if(!apikey) return;
  el('ai-fill-btn').disabled=true;
  el('ai-fill-loading').style.display='block';
  const zh=el('nz').value.trim();
  const prompt=`你是ESG永續領域的專家，請為以下ESG名詞生成說明內容，以台灣企業和從業者為受眾。
名詞縮寫：${abbr}${zh?' 中文名稱：'+zh:''}
請以JSON格式回覆，包含以下欄位：zh（中文名稱，10字以內）、prob（解決什麼問題，2-3句）、how（怎麼運作，3-5句）、tw（台灣影響，2-3句含具體案例）、exam（考試重點，每點以▸開頭，3-5點）、num（關鍵數字，20字以內）、who（適用對象，20字以內）。只回JSON，不要Markdown代碼塊。`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apikey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message);
    const text=(data.content||[]).map(c=>c.text||'').join('');
    const clean=text.replace(/```json|```/g,'').trim();
    const r=JSON.parse(clean);
    if(r.zh&&!el('nz').value.trim()) el('nz').value=r.zh;
    if(r.prob) el('np').value=r.prob;
    if(r.how) el('nh').value=r.how;
    if(r.tw) el('ntw').value=r.tw;
    if(r.exam) el('ne').value=r.exam;
    if(r.num) el('nn').value=r.num;
    if(r.who) el('nw').value=r.who;
  }catch(e){
    alert('AI 生成失敗：'+e.message);
  }finally{
    el('ai-fill-btn').disabled=false;
    el('ai-fill-loading').style.display='none';
  }
}

function saveAPIKey(){
  const k=el('apikey-input').value.trim();
  localStorage.setItem('esg_apikey',k);
  togglePanel('settings');
  alert(k?'API Key 已儲存！':'API Key 已清除。');
}

/* ════════════════════════════════
   DRAG AND DROP
════════════════════════════════ */
function clearDragState(){
  dragData=null; dropInfo=null;
  if(prevInd){prevInd.classList.remove('drag-before'); prevInd=null;}
  document.querySelectorAll('.layer-body').forEach(b=>b.classList.remove('drag-over'));
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('dragging'));
}

/* ════════════════════════════════
   RENDER
════════════════════════════════ */
function render(){
  const wrap=el('layers');
  wrap.innerHTML='';
  LAYER_DEFS.forEach(L=>{
    const visTerms=L.terms.filter(k=>{
      if(!searchQ) return true;
      const t=D[k]; if(!t) return false;
      return k.toLowerCase().includes(searchQ)||
        (t.zh&&t.zh.toLowerCase().includes(searchQ))||
        (t.en&&t.en.toLowerCase().includes(searchQ))||
        (t.prob&&t.prob.includes(searchQ))||
        (t.how&&t.how.includes(searchQ));
    });
    if(searchQ&&visTerms.length===0) return;
    const div=document.createElement('div');
    div.className='layer';
    // Head
    const head=document.createElement('div');
    head.className='layer-head';
    head.style.background=L.fill;
    head.innerHTML=`<div class="layer-num" style="background:${L.bc}">${L.num}</div>`+
      `<div class="layer-info"><div class="layer-name">${L.name}</div><div class="layer-desc">${L.desc}</div></div>`+
      `<span class="layer-badge" style="background:${L.fill};color:${L.tc};border:1px solid ${L.bc}">${L.badge}</span>`;
    div.appendChild(head);
    // Body
    const body=document.createElement('div');
    body.className='layer-body';
    // Drop handlers on body
    body.addEventListener('dragover',(function(lid){return function(e){
      e.preventDefault();
      this.classList.add('drag-over');
      if(!dropInfo||dropInfo.layerId!==lid){
        if(prevInd){prevInd.classList.remove('drag-before'); prevInd=null;}
        dropInfo={layerId:lid,beforeKey:null};
      }
    };})(L.id));
    body.addEventListener('dragleave',function(e){if(!this.contains(e.relatedTarget))this.classList.remove('drag-over');});
    body.addEventListener('drop',(function(lid){return function(e){
      e.preventDefault();
      this.classList.remove('drag-over');
      if(!dragData) return;
      const srcLayer=LAYER_DEFS.find(l=>l.id===dragData.layerId);
      if(!srcLayer) return;
      const idx=srcLayer.terms.indexOf(dragData.key);
      if(idx<0) return;
      srcLayer.terms.splice(idx,1);
      const tgtLayer=LAYER_DEFS.find(l=>l.id===lid);
      if(!tgtLayer){srcLayer.terms.splice(idx,0,dragData.key); return;}
      if(dropInfo&&dropInfo.beforeKey&&dropInfo.layerId===lid){
        const bi=tgtLayer.terms.indexOf(dropInfo.beforeKey);
        if(bi>=0) tgtLayer.terms.splice(bi,0,dragData.key);
        else tgtLayer.terms.push(dragData.key);
      } else {
        tgtLayer.terms.push(dragData.key);
      }
      clearDragState();
      if(activeKey){const al=getLayer(activeKey); if(!al) activeKey=null;}
      render();
      if(activeKey) renderDetail(activeKey);
    };})(L.id));
    // Chips
    L.terms.forEach(function(key){
      const t=D[key]; if(!t) return;
      const inSearch=!searchQ||visTerms.includes(key);
      const isActive=activeKey===key;
      const chip=document.createElement('span');
      chip.className='chip'+(isActive?' active':'')+((!inSearch&&searchQ)?' dimmed':'');
      chip.style.cssText=`background:${L.fill};color:${L.tc};border-color:${isActive?L.bc:'transparent'}`;
      chip.textContent=(t.zh||key)+(t.voluntary?' ✦':'');
      chip.title='點擊查看說明 · 拖曳可移動';
      chip.draggable=true;
      chip.addEventListener('click',(function(k){return function(){selectTerm(k);};})(key));
      chip.addEventListener('dragstart',(function(lid,k,el){return function(e){
        dragData={layerId:lid,key:k};
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain',k);
        setTimeout(function(){el.classList.add('dragging');},0);
      };})(L.id,key,chip));
      chip.addEventListener('dragend',clearDragState);
      chip.addEventListener('dragover',(function(lid,k,cel){return function(e){
        e.preventDefault(); e.stopPropagation();
        if(prevInd&&prevInd!==cel){prevInd.classList.remove('drag-before');}
        cel.classList.add('drag-before');
        prevInd=cel;
        dropInfo={layerId:lid,beforeKey:k};
      };})(L.id,key,chip));
      body.appendChild(chip);
    });
    div.appendChild(body);
    wrap.appendChild(div);
  });
  // Update count
  el('hdr-count').textContent=totalCount()+'個名詞 · '+LAYER_DEFS.length+'層'+(searchQ?' ·「'+searchQ+'」':'');
}

/* ════════════════════════════════
   DETAIL PANEL
════════════════════════════════ */
function selectTerm(key){
  if(activeKey===key){activeKey=null; closeDetailPanel(); render(); return;}
  activeKey=key;
  render();
  renderDetail(key);
}

function renderDetail(key){
  const t=D[key]; if(!t) return;
  const L=getLayer(key);
  const panel=el('detail');
  panel.classList.remove('closed');
  panel.classList.add('open');
  const inner=el('detail-inner');
  // Related term chips
  const relChips=(t.rel||[]).filter(k=>D[k]).map(k=>{
    const rt=D[k]; const rl=getLayer(k);
    return `<span class="p-chip" onclick="selectTerm('${k}')" style="background:${rl?rl.fill:'rgba(255,255,255,.05)'};color:${rl?rl.tc:'var(--text2)'}">${rt.zh||k}</span>`;
  }).join('');
  inner.innerHTML=
    `<div class="p-close"><button onclick="closeDetailPanel()">✕ 關閉</button></div>`+
    (L?`<span class="p-badge" style="background:${L.fill};color:${L.tc};border:1px solid ${L.bc}">${L.num} ${L.name}</span>`:'')+'<br>'+
    `<div class="p-title">${t.zh||key}</div>`+
    `<div class="p-en">${key}${t.en?' · '+t.en:''}</div>`+
    `<div class="p-actions">`+
    `<button class="hbtn" onclick="openEdit('${key}')">✏ 編輯</button>`+
    `<button class="hbtn" onclick="openAI('${key}')">✦ AI 重新生成</button>`+
    `</div>`+
    (t.prob?`<div class="p-sec">解決什麼問題</div><div class="p-box">${t.prob.replace(/\n/g,'<br>')}</div>`:'')+
    (t.how?`<div class="p-sec">怎麼運作</div><div class="p-box">${t.how.replace(/\n/g,'<br>')}</div>`:'')+
    (t.tw?`<div class="p-sec">台灣影響</div><div class="p-box">${t.tw.replace(/\n/g,'<br>')}</div>`:'')+
    `<div class="p-grid">`+
    (t.exam?`<div class="p-cell" style="grid-column:1/-1"><div class="p-lbl">考試重點</div><div class="p-val">${t.exam}</div></div>`:'')+
    (t.num?`<div class="p-cell"><div class="p-lbl">關鍵數字</div><div class="p-val">${t.num}</div></div>`:'')+
    (t.who?`<div class="p-cell"><div class="p-lbl">適用對象</div><div class="p-val">${t.who}</div></div>`:'')+
    `</div>`+
    (relChips?`<div class="p-sec">相關名詞</div><div class="p-chips">${relChips}</div>`:'');
}

function closeDetailPanel(){
  activeKey=null;
  const panel=el('detail');
  panel.classList.add('closed');
  panel.classList.remove('open');
  render();
}

/* ════════════════════════════════
   SEARCH
════════════════════════════════ */
function onSearch(v){
  searchQ=v.trim().toLowerCase();
  render();
}

/* ════════════════════════════════
   HELPERS
════════════════════════════════ */
function el(id){return document.getElementById(id);}

/* ════════════════════════════════
   INIT
════════════════════════════════ */
render();
</script>
