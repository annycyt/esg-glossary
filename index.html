<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG 永續領域架構關係圖</title>
<style>
:root{
  --bg:#0e1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#252d40;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#dde2f0;--text2:#8e98b5;--text3:#4e5875;
  --font:'IBM Plex Sans TC','Noto Sans TC',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* ── header ── */
#hdr{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--border2);min-height:0}
#hdr h1{font-size:12px;font-weight:500;white-space:nowrap}
#hdr .sub{font-size:10px;color:var(--text3);display:none}
#srch{flex:1;max-width:200px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text);font-family:var(--font);outline:none}
#srch:focus{border-color:rgba(255,255,255,0.25)}
#srch::placeholder{color:var(--text3)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3);white-space:nowrap}
.leg-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}

/* ── layout ── */
#body{display:flex;flex:1;overflow:hidden;position:relative}
#map-wrap{flex:1;overflow:auto;padding:20px 16px 40px}
#map-wrap::-webkit-scrollbar{width:4px;height:4px}
#map-wrap::-webkit-scrollbar-track{background:transparent}
#map-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── panel: side panel on desktop, bottom sheet on mobile ── */
#panel{width:360px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border2);overflow-y:auto;display:flex;flex-direction:column;transition:width .25s,opacity .2s}
#panel.closed{width:0;opacity:0;overflow:hidden;border:none}
#panel-inner{padding:14px 14px;min-width:360px}
#panel-inner::-webkit-scrollbar{width:4px}

/* mobile: panel becomes full-screen overlay from bottom */
@media(max-width:700px){
  #body{flex-direction:column}
  .legend{display:none}
  #hdr .sub{display:none}
  #panel{
    position:fixed;left:0;right:0;bottom:0;
    width:100%!important;
    max-height:72vh;
    border-left:none;
    border-top:2px solid var(--border2);
    border-radius:14px 14px 0 0;
    transform:translateY(100%);
    transition:transform .3s ease;
    opacity:1!important;
    z-index:200;
  }
  #panel.open{transform:translateY(0)}
  #panel-inner{min-width:0;padding:12px 14px 28px}
  .p-grid{grid-template-columns:1fr}
  /* drag handle */
  #panel-inner::before{
    content:'';display:block;width:36px;height:4px;
    background:var(--border2);border-radius:2px;
    margin:0 auto 12px;
  }
}

.p-close{display:flex;justify-content:flex-end;margin-bottom:8px}
.p-close button{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:var(--font)}
.p-close button:hover{background:var(--bg4)}
.p-badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 9px;border-radius:20px;margin-bottom:8px;letter-spacing:.04em}
.p-title{font-size:15px;font-weight:500;margin-bottom:2px}
.p-en{font-size:11px;color:var(--text3);margin-bottom:10px;font-family:var(--mono)}
.p-sec{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin:10px 0 4px;font-weight:500}
.p-box{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:12px;line-height:1.75;color:var(--text2)}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.p-cell{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:7px 9px}
.p-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:3px;font-weight:500}
.p-val{font-size:11px;line-height:1.65;color:var(--text2);white-space:pre-wrap}
.p-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:10px;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--text2);cursor:pointer;border:1px solid var(--border2);transition:all .1s;font-family:var(--font)}
.chip:hover{background:rgba(255,255,255,.1);color:var(--text)}
.p-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:140px;color:var(--text3);font-size:12px;text-align:center;gap:8px;padding:20px}

/* ── SVG node styles ── */
.nd{cursor:pointer;transition:opacity .1s}
.nd:hover rect,.nd:hover .pill{opacity:.85}
.nd.dim{opacity:.22}
.nd.hi rect,.nd.hi .pill{stroke-width:1.5!important}
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

<div id="hdr">
  <div>
    <h1>ESG 永續領域架構關係圖</h1>
    <div class="sub">105 個名詞 · 10 大分類 · 點擊節點查看完整說明</div>
  </div>
  <input id="srch" placeholder="搜尋名詞 / 縮寫…" autocomplete="off">
  <div class="legend" id="legend"></div>
</div>

<div id="body">
  <div id="map-wrap"><svg id="svg"></svg></div>
  <div id="panel" class="closed"><div id="panel-inner">
    <div class="p-empty">點擊任一節點<br>查看完整說明</div>
  </div></div>
</div>

</div>
<script>
/* ════════════════════════════════════════════
   DATA
════════════════════════════════════════════ */
const CATS={
  'climate': {label:'氣候協議',    color:'#1D9E75', dimColor:'#0a4530'},
  'intl':    {label:'國際法規',    color:'#378ADD', dimColor:'#0c2d52'},
  'disc':    {label:'揭露框架',    color:'#7F77DD', dimColor:'#221e52'},
  'carbon':  {label:'碳市場',      color:'#BA7517', dimColor:'#3d2508'},
  'social':  {label:'社會面 S',    color:'#D85A30', dimColor:'#471a0a'},
  'gov':     {label:'治理面 G',    color:'#888780', dimColor:'#282826'},
  'nature':  {label:'自然生態',    color:'#639922', dimColor:'#1c300a'},
  'finance': {label:'永續金融',    color:'#D4537E', dimColor:'#451829'},
  'tech':    {label:'減碳技術',    color:'#5DCAA5', dimColor:'#0d3d30'},
  'tw':      {label:'台灣專區',    color:'#E24B4A', dimColor:'#441515'},
};

const D={
unfccc:{zh:'UNFCCC',en:'聯合國氣候框架公約',cat:'climate',
  prob:'各國燒煤燒油，大氣CO₂濃度飆升，地球暖化。但沒有任何機構能要求主權國家減碳——UNFCCC就是為了填補這個空缺而誕生的全球第一個氣候談判框架。',
  how:'1992年里約地球高峰會通過，198個締約方加入。核心原則：CBDR-RC「共同但有區別的責任」——已開發國家（附件一，41國）歷史排碳多，要率先減；開發中國家依自身能力跟進。每年召開COP締約方大會評估進展。',
  tw:'台灣不是UNFCCC締約方（非UN成員）。但台灣主動對標UNFCCC精神，制定氣候法、NDC、2050淨零路徑，以非正式觀察員角色參與COP。',
  exam:'▸ UNFCCC最終目標：穩定大氣GHG濃度\n▸ CBDR-RC原則定義（必考）\n▸ 附件一（已開發41國）vs 非附件一\n▸ COP第一屆：1995年柏林\n▸ 1992年通過、1994年生效',
  num:'1992年通過 ／ 1994年生效 ／ 198締約方',
  who:'全球主權國家政府（政府層級）',
  rel:['kyoto','paris','cop','ipcc']},

kyoto:{zh:'京都議定書',en:'Kyoto Protocol',cat:'climate',
  prob:'UNFCCC只是框架，沒有具體的減碳數字。1990年代科學已確認人為排碳造成暖化，需要給已開發國家設定法律約束的減量目標。',
  how:'只約束UNFCCC「附件一」的41個已開發國家（中印不受約束）。要求2008-2012年間平均減碳5.2%（vs 1990年基準）。各國目標不同：歐盟-8%、美國-7%（後退出）、日本-6%。設計三個彈性機制：CDM（幫開發中國家減碳算自己的）、JI（已開發國家互相合作）、ET（直接買賣碳配額）。',
  tw:'台灣非附件一，京都議定書無直接法律約束力。但CDM機制孕育了現在VCM自願碳市場的前身。',
  exam:'▸ 附件一國家平均減量5.2%（vs 1990）（高頻）\n▸ 第一期2008-2012；第二期2013-2020\n▸ 三彈性機制：CDM、JI、ET（必考）\n▸ 2005年2月16日生效；CDM 2026年落日',
  num:'附件一41國 ／ 平均-5.2% ／ 2008-2012',
  who:'UNFCCC附件一已開發國家（具法律約束力）',
  rel:['cdm','paris','unfccc']},

cdm:{zh:'CDM / JI / ET',en:'京都三彈性機制',cat:'climate',
  prob:'已開發國家在自己國內減碳成本很高，但在開發中國家做同樣減碳便宜很多。有沒有辦法讓錢花在最有效率的地方？',
  how:'CDM（清潔發展機制）：日本出資在印尼建太陽能，減了100噸算給日本。核發CER碳信用。JI（共同執行）：已開發國家互助。ET（排放交易）：已開發國家直接買賣碳配額。EU ETS就是ET邏輯的延伸。CDM 2026年正式落日，被巴黎協定第6條（ITMO/PACM）取代。',
  tw:'CDM時代台灣有部分企業參與林業碳匯專案。VCM的運作邏輯直接繼承自CDM。',
  exam:'▸ 三機制英文全名：CDM/JI/ET（高頻必考）\n▸ CDM核發CER；PACM核發A6.4ER\n▸ CDM 2026年落日→被第6.4條取代\n▸ ET是EU ETS的制度原型',
  num:'CDM已核發~20億噸CER ／ 2026年落日',
  who:'京都附件一國家 + 開發中國家（東道主）',
  rel:['vcm','itmo','pacm','euets']},

paris:{zh:'巴黎協定',en:'Paris Agreement',cat:'climate',
  prob:'京都議定書只管已開發國家，中國印度完全不受約束，全球排碳繼續上升。需要一個覆蓋所有國家的新框架。',
  how:'2015年COP21通過，196個締約方全部加入。核心架構：① 溫度目標：2°C以內，努力1.5°C ② NDC機制：各國自訂目標，每5年更新（棘輪條款）③ 全球盤點GST每5年一次 ④ 第六條ITMO國際碳市場 ⑤ 氣候融資每年1,000億美元。',
  tw:'台灣非締約方，但2023年氣候法明訂2050淨零為國家目標。NDC 3.0設定2030年減28±2%（vs 2005年）。所有減碳政策均以1.5°C路徑為科學依據。',
  exam:'▸ 1.5°C努力目標 vs 2°C主要目標（超高頻）\n▸ NDC每5年更新、棘輪條款（只能更嚴）\n▸ 2016年11月4日生效\n▸ 第六條ITMO國際碳市場機制',
  num:'2°C主要 ／ 1.5°C努力 ／ 196締約方',
  who:'UNFCCC全體締約方（含開發中國家）',
  rel:['ndc','cop','sbti','itmo','pacm','unfccc']},

ndc:{zh:'NDC',en:'Nationally Determined Contributions',cat:'climate',
  prob:'以前氣候協議是聯合國告訴你要減多少，沒人願意簽。巴黎協定改成「你自己說要減多少」——棘輪機制讓每次更新只能更嚴格。',
  how:'主要國家承諾：🇪🇺歐盟-55%（vs 1990）🇺🇸美國-50-52%（vs 2005）🇨🇳中國2030達峰、2060淨零 🇮🇳印度2070淨零 🇯🇵日本-46%（vs 2013）🇹🇼台灣-28±2%（2030）、-38±2%（2035）。現行NDC合計只能達2.5-3.2°C情境，距1.5°C差距巨大。',
  tw:'台灣NDC 3.0（2024）是最新版本，2030目標比NDC 2.0更嚴格4個百分點。非UNFCCC締約方但主動提交。',
  exam:'▸ NDC棘輪條款（只能更嚴不能放寬）（必考）\n▸ 現行差距：2.5-3.2°C（排放差距報告）\n▸ INDC是巴黎協定生效前的過渡名稱\n▸ 台灣NDC 3.0：2030年-28±2%（vs 2005）',
  num:'5年更新週期 ／ 現行差距2.5-3.2°C',
  who:'UNFCCC所有締約方政府（自願提交）',
  rel:['paris','cop','sbti']},

cop:{zh:'COP 大事記',en:'Conference of the Parties',cat:'climate',
  prob:'UNFCCC通過後需要一個每年召開的場合讓各國代表檢視進度、談判細節。COP就是全球最重要的氣候政治舞台。',
  how:'重要里程碑：COP1（1995柏林）首屆 → COP3（1997京都）京都議定書 → COP15（2009哥本哈根）失望收場 → COP21（2015巴黎）巴黎協定 → COP26（2021格拉斯哥）強化1.5°C美國重返 → COP27（2022）損失與損害基金 → COP28（2023杜拜）首次全球盤點GST1、排放峰值、RE增3倍 → COP29（2024巴庫）NCQG → COP30（2025貝倫）巴黎十周年。',
  tw:'台灣以NGO、學術機構身分出席COP，無投票權。COP決議直接影響台灣CBAM應對、碳費設計、金管會法規走向。',
  exam:'▸ COP3=京都議定書；COP21=巴黎協定（必考）\n▸ COP27=損失與損害基金\n▸ COP28=首次全球盤點GST1\n▸ 2020年因COVID-19未舉行實體會議',
  num:'COP3=京都 ／ COP21=巴黎 ／ COP28=首次GST',
  who:'UNFCCC全體締約方政府代表',
  rel:['paris','ndc','unfccc']},

ipcc:{zh:'IPCC',en:'Intergovernmental Panel on Climate Change',cat:'climate',
  prob:'政策談判需要科學依據——哪個溫度目標才安全？現在暖化了幾度？IPCC就是回答這些問題的機構。',
  how:'1988年成立。不做新研究，整合全球頂尖科學家的研究成果，每5-6年發布評估報告（AR）。AR6（2023年）：2023年全球均溫比工業化前高1.45°C；溫度每升0.5°C，極端氣候衝擊呈非線性惡化；維持1.5°C需2030年前減碳43%。',
  tw:'台灣科學家參與IPCC報告撰寫。IPCC的1.5°C目標是台灣NDC、SBTi、氣候法的科學基礎。',
  exam:'▸ IPCC不做研究，整合科學共識\n▸ AR6（2023）：均溫+1.45°C\n▸ 1.5°C目標的科學依據來源\n▸ 溫度每升0.5°C影響呈非線性',
  num:'1988年成立 ／ AR6（2023）最新 ／ 195成員國',
  who:'聯合國政府間機構，整合全球科學家研究',
  rel:['paris','ndc','unfccc']},

itmo:{zh:'ITMO（第6.2條）',en:'Intl Transferred Mitigation Outcomes',cat:'climate',
  prob:'CDM落日後，各國還是想透過跨境合作實現更便宜的減碳。巴黎第六條就是新版的國際碳市場——這次要確保不「重複計算」。',
  how:'第6.2條「合作方法」：國家A（日本）投資國家B（越南）做減碳，減量成果轉讓給日本用於NDC目標，稱為ITMO。關鍵是「相應調整」：越南把這噸從自己NDC帳戶扣掉，日本加進自己帳戶，確保不重複計算。',
  tw:'台灣企業參與ITMO需透過政府授權。目前台灣正評估如何在TCEX平台上銜接ITMO機制。',
  exam:'▸ ITMO = 國際轉讓減緩成果\n▸ 相應調整（Corresponding Adjustment）是核心\n▸ 第6.2條（雙邊）vs 第6.4條PACM（聯合國集中）\n▸ 與CDM差異：需相應調整、防雙重計算',
  num:'2021年COP26後正式啟動 ／ 需相應調整',
  who:'巴黎協定締約方政府（需官方授權）',
  rel:['pacm','vcm','cdm','tcex']},

pacm:{zh:'PACM（第6.4條）',en:'Paris Agreement Crediting Mechanism',cat:'climate',
  prob:'CDM品質良莠不齊、環境效益存疑。PACM是CDM的升級版，由聯合國集中管理，標準更嚴格。',
  how:'由聯合國A6.4監督機構統一管理，核發A6.4ER碳信用。比ITMO更中央化。CDM專案需重新申請才能轉換。強制扣除2%用於全球減排（OMGE）、5%用於調適基金。',
  tw:'台灣企業可作為計畫開發者或買家參與PACM。TCEX已開始引進符合PACM標準的碳信用。',
  exam:'▸ PACM vs CDM（更嚴格、聯合國集中管理）\n▸ CDM 2026落日→PACM取代\n▸ A6.4ER是新碳信用名稱（取代CER）\n▸ 扣除2%OMGE + 5%調適基金',
  num:'CDM 2026落日 ／ A6.4ER取代CER',
  who:'巴黎協定締約方 + 授權企業實體',
  rel:['cdm','itmo','vcm','ccp']},

// 國際法規
csrd:{zh:'CSRD',en:'企業永續報告指令',cat:'intl',
  prob:'以前歐盟只要求少數大型企業做非財務報告，而且格式五花八門。CSRD要大幅擴大適用範圍、統一格式、強制查證。',
  how:'取代NFRD。採「雙重重大性」評估，強制第三方查證。適用：①歐盟大型企業 ②在歐盟上市公司 ③在歐盟年營業額>1.5億歐元的非歐盟企業。分階段：2024→2025→2026→2028。',
  tw:'台灣企業三種情境：①在歐盟有子公司 ②在歐盟年營業額>1.5億歐元 ③是歐洲品牌供應商（需提供Scope 3數據）。台積電、鴻海、廣達需配合客戶提供CSRD所需數據。',
  exam:'▸ CSRD取代NFRD（必考）\n▸ ESRS是CSRD底層準則（12項）\n▸ 雙重重大性：財務+衝擊兩維度\n▸ 非歐盟門檻：在歐盟年營業額>1.5億歐元\n▸ 分四階段2024-2028',
  num:'1.5億歐元非歐盟門檻 ／ 2024-2028四階段',
  who:'歐盟大型企業 + 部分非歐盟企業（含台灣子公司）',
  rel:['esrs','csddd','issb','gri','doubmat','cbam']},

esrs:{zh:'ESRS',en:'歐洲永續報告準則',cat:'intl',

const NW=156, NH=48, VGAP=18, HGAP=40;
const GROUP_ITEM_H=46, GROUP_ITEM_GAP=12;
const GROUP_HEADER_H=44, GROUP_BRACE_PAD=20;

/* ── build trunk positions ── */
function trunkLayout(nodes, x, y){
  const out={};
  nodes.forEach(n=>{
    out[n.id]={x, y};
    let cy=y+NH+VGAP;
    (n.children||[]).forEach(c=>{
      const sub=trunkLayout([c], x+NW+HGAP, cy);
      Object.assign(out, sub);
      cy+=sub[c.id].__h+(VGAP*0.5);
    });
    const childrenIds=(n.children||[]).map(c=>c.id);
    let totalH=NH;
    if(childrenIds.length){
      const last=childrenIds[childrenIds.length-1];
      totalH=Math.max(NH, (out[last].y+out[last].__h||NH)- y);
    }
    out[n.id].__h=totalH;
  });
  return out;
}

let trunkPos = trunkLayout(TRUNK, 40, 40);
let trunkMaxX=0, trunkMaxY=0;
Object.values(trunkPos).forEach(p=>{
  trunkMaxX=Math.max(trunkMaxX, p.x+NW);
  trunkMaxY=Math.max(trunkMaxY, p.y+NH+(p.__h||NH));
});

/* ── build group positions ── */
const groupPos={};
const GROUPS_START_X = trunkMaxX + 80;
const GROUPS_PER_ROW = 3;
const GROUP_COL_W = NW + 90;
const GROUP_START_Y = 40;

GROUPS.forEach((g, gi)=>{
  const col = gi % GROUPS_PER_ROW;
  const row = Math.floor(gi / GROUPS_PER_ROW);
  const gx = GROUPS_START_X + col * (GROUP_COL_W + 60);
  // calculate Y offset from previous rows
  let gy = GROUP_START_Y;
  if(row > 0){
    let prevRowMaxY = GROUP_START_Y;
    for(let pi=0; pi < row * GROUPS_PER_ROW; pi++){
      const pg = GROUPS[pi];
      if(!pg) continue;
      const pgCol = pi % GROUPS_PER_ROW;
      if(pgCol === col){
        const pgItems = pg.ids.length;
        const pgH = GROUP_HEADER_H + GROUP_BRACE_PAD + pgItems*(GROUP_ITEM_H+GROUP_ITEM_GAP) + 30;
        prevRowMaxY = Math.max(prevRowMaxY, GROUP_START_Y + pgH);
      }
    }
    gy = prevRowMaxY + 40;
  }
  // recalculate properly per column
  const prevColGroupsInSameCol = [];
  for(let pi=0; pi < gi; pi++){
    if(pi % GROUPS_PER_ROW === col) prevColGroupsInSameCol.push(GROUPS[pi]);
  }
  let gyFinal = GROUP_START_Y;
  prevColGroupsInSameCol.forEach(pg=>{
    const pgH = GROUP_HEADER_H + GROUP_BRACE_PAD + pg.ids.length*(GROUP_ITEM_H+GROUP_ITEM_GAP) + 30;
    gyFinal += pgH + 40;
  });

  groupPos[g.cat]={x: gx, y: gyFinal};
  g.ids.forEach((id, ii)=>{
    groupPos[id]={
      x: gx + 30,
      y: gyFinal + GROUP_HEADER_H + GROUP_BRACE_PAD + ii*(GROUP_ITEM_H+GROUP_ITEM_GAP)
    };
  });
});

/* total canvas size */
let totalW=0, totalH=0;
[...Object.values(trunkPos), ...Object.values(groupPos)].forEach(p=>{
  totalW=Math.max(totalW, (p.x||0)+NW+60);
  totalH=Math.max(totalH, (p.y||0)+GROUP_ITEM_H+60);
});

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */
const svg=document.getElementById('svg');
svg.setAttribute('width', totalW);
svg.setAttribute('height', totalH);
svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

function hex2rgba(hex, a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function el(tag, attrs={}, parent=svg){
  const e=document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  parent.appendChild(e);
  return e;
}

function node(id, x, y, w, h, color, zhLabel, enLabel, selected=false){
  const g=el('g');
  g.classList.add('nd');
  g.dataset.id=id;

  const alpha = selected ? 0.9 : 0.18;
  const strokeAlpha = selected ? 1 : 0.55;
  const strokeW = selected ? 2 : 0.8;

  el('rect',{x,y,width:w,height:h,rx:7,
    fill:hex2rgba(color, alpha),
    stroke:hex2rgba(color, strokeAlpha),
    'stroke-width':strokeW}, g);

  // line1 = abbr/English code (bold), line2 = Chinese name (light)
  const hasTwo = enLabel && enLabel.trim();
  const line1El=el('text',{
    x: x+w/2, y: y+(hasTwo ? h/2-7 : h/2),
    'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'IBM Plex Mono, IBM Plex Sans TC, Noto Sans TC, sans-serif',
    'font-size':'11','font-weight':'700',
    'letter-spacing':'0.03em',
    fill: selected ? '#ffffff' : hex2rgba(color, 1)
  }, g);
  line1El.textContent=truncStr(zhLabel, 18);

  if(hasTwo){
    const line2El=el('text',{
      x: x+w/2, y: y+h/2+8,
      'text-anchor':'middle','dominant-baseline':'central',
      'font-family':'IBM Plex Sans TC, Noto Sans TC, sans-serif',
      'font-size':'9','font-weight':'400',
      fill: selected ? 'rgba(255,255,255,0.75)' : hex2rgba(color, 0.7)
    }, g);
    line2El.textContent=truncStr(enLabel, 26);
  }

  g.style.cursor='pointer';
  g.addEventListener('click', ()=>selectNode(id));
  return g;
}

function truncStr(s, maxLen){
  return s && s.length > maxLen ? s.slice(0, maxLen-1)+'…' : (s||'');
}

function line(x1,y1,x2,y2,color,dasharray=''){
  return el('line',{x1,y1,x2,y2,
    stroke:hex2rgba(color,0.5),'stroke-width':0.9,
    ...(dasharray?{'stroke-dasharray':dasharray}:{})});
}

function path(d, color, dasharray=''){
  return el('path',{d, fill:'none',
    stroke:hex2rgba(color,0.45),'stroke-width':0.9,
    ...(dasharray?{'stroke-dasharray':dasharray}:{})});
}

function renderAll(selectedId=null){
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  /* ── trunk edges ── */
  function drawTrunkEdges(nodes){
    nodes.forEach(n=>{
      const p=trunkPos[n.id];
      (n.children||[]).forEach(c=>{
        const cp=trunkPos[c.id];
        if(!p||!cp) return;
        const x1=p.x+NW, y1=p.y+NH/2;
        const x2=cp.x, y2=cp.y+NH/2;
        const mx=(x1+x2)/2;
        path(`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, CATS.climate.color);
        drawTrunkEdges([c]);
      });
    });
  }
  drawTrunkEdges(TRUNK);

  /* ── trunk nodes ── */
  function drawTrunkNodes(nodes){
    nodes.forEach(n=>{
      const p=trunkPos[n.id];
      const d=D[n.id];
      if(!p||!d) return;
      node(n.id, p.x, p.y, NW, NH, CATS[d.cat].color, d.abbr||d.zh, d.zh, n.id===selectedId);
      drawTrunkNodes(n.children||[]);
    });
  }
  drawTrunkNodes(TRUNK);

  /* ── group blocks ── */
  GROUPS.forEach(g=>{
    const cat=CATS[g.cat];
    const gp=groupPos[g.cat];
    if(!gp) return;

    /* header */
    node(g.cat+'_header', gp.x, gp.y, NW, GROUP_HEADER_H, cat.color,
      cat.label, g.ids.length+' 個名詞');

    /* brace spine */
    const spineX = gp.x + 14;
    const firstItemY = gp.y + GROUP_HEADER_H + GROUP_BRACE_PAD;
    const lastItemY = firstItemY + (g.ids.length-1)*(GROUP_ITEM_H+GROUP_ITEM_GAP);
    const connectorY = gp.y + GROUP_HEADER_H + GROUP_BRACE_PAD/2;

    /* header → spine */
    line(gp.x+NW/2, gp.y+GROUP_HEADER_H, gp.x+NW/2, connectorY, cat.color);
    line(gp.x+NW/2, connectorY, spineX, connectorY, cat.color);
    line(spineX, connectorY, spineX, lastItemY+GROUP_ITEM_H/2, cat.color);

    /* ticks + items */
    g.ids.forEach((id, ii)=>{
      const ip=groupPos[id];
      if(!ip) return;
      const itemMidY=ip.y+GROUP_ITEM_H/2;
      line(spineX, itemMidY, ip.x, itemMidY, cat.color);
      const d2=D[id];
      node(id, ip.x, ip.y, NW, GROUP_ITEM_H, cat.color, d2.abbr||d2.zh, d2.zh, id===selectedId);
    });
  });

  /* ── search dim ── */
  const q=document.getElementById('srch').value.trim().toLowerCase();
  if(q){
    const matches=new Set(Object.keys(D).filter(id=>{
      const d=D[id];
      return (d.zh+d.en+(d.prob||'')+(d.how||'')).toLowerCase().includes(q);
    }));
    svg.querySelectorAll('.nd[data-id]').forEach(g=>{
      const id=g.dataset.id;
      if(id && !id.endsWith('_header') && !matches.has(id)){
        g.classList.add('dim');
      }
    });
  }
}

renderAll();

/* ════════════════════════════════════════════
   PANEL
════════════════════════════════════════════ */
let currentId=null;

function selectNode(id){
  if(id && id.endsWith('_header')) return;
  if(!D[id]) return;
  currentId=id;
  renderAll(id);
  showPanel(D[id]);
}

function showPanel(d){
  const panel=document.getElementById('panel');
  const isMobile=window.innerWidth<=700;
  if(isMobile){panel.classList.remove('closed');panel.classList.add('open');}
  else{panel.classList.remove('closed');}
  const cat=CATS[d.cat];
  const col=cat.color;
  function h2r(hex,a){return hex2rgba(hex,a);}
  document.getElementById('panel-inner').innerHTML=`
    <div class="p-close"><button onclick="closePanel()">關閉 ×</button></div>
    <span class="p-badge" style="background:${h2r(col,.18)};color:${col}">${cat.label}</span>
    <div class="p-title">${d.zh}</div>
    <div class="p-en">${d.en||''}</div>
    <div class="p-sec">解決什麼問題</div>
    <div class="p-box">${(d.prob||'').replace(/\n/g,'<br>')}</div>
    <div class="p-sec">怎麼運作</div>
    <div class="p-box">${(d.how||'').replace(/\n/g,'<br>')}</div>
    <div class="p-grid">
      <div class="p-cell"><div class="p-lbl">台灣影響</div><div class="p-val">${d.tw||''}</div></div>
      <div class="p-cell"><div class="p-lbl">考試重點</div><div class="p-val">${d.exam||''}</div></div>
      <div class="p-cell"><div class="p-lbl">關鍵數字</div><div class="p-val" style="color:${col};font-weight:500">${d.num||''}</div></div>
      <div class="p-cell"><div class="p-lbl">適用對象</div><div class="p-val">${d.who||''}</div></div>
    </div>
    <div class="p-sec">關聯名詞</div>
    <div class="p-chips">${(d.rel||[]).map(r=>D[r]?`<span class="chip" onclick="jumpTo('${r}')">${D[r].zh} <span style="opacity:.55;font-size:9px">${D[r].en}</span></span>`:'').join('')}</div>
  `;
}

function jumpTo(id){
  if(!D[id]) return;
  currentId=id;
  renderAll(id);
  showPanel(D[id]);
  /* scroll to node */
  const p=groupPos[id]||trunkPos[id];
  if(p){
    const wrap=document.getElementById('map-wrap');
    wrap.scrollTo({left:p.x-100, top:p.y-100, behavior:'smooth'});
  }
}

function closePanel(){
  const panel=document.getElementById('panel');
  panel.classList.add('closed');
  panel.classList.remove('open');
  currentId=null;
  renderAll(null);
}

/* ── search ── */
let searchTimer=null;
document.getElementById('srch').addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>renderAll(currentId), 200);
});

/* ── legend ── */
const leg=document.getElementById('legend');
Object.entries(CATS).forEach(([k,v])=>{
  const d=document.createElement('div');
  d.className='leg';
  d.innerHTML=`<div class="leg-dot" style="background:${v.color}"></div>${v.label}`;
  leg.appendChild(d);
});

/* ════ LOAD CUSTOM NODES FROM LOCALSTORAGE ════ */
function loadCustomNodes(){
  try{
    const saved=localStorage.getItem('esg_custom_nodes');
    if(!saved) return;
    const nodes=JSON.parse(saved);
    nodes.forEach(n=>{
      if(!D[n.id]){ D[n.id]=n; const g=GROUPS.find(g=>g.cat===n.cat); if(g&&!g.ids.includes(n.id)) g.ids.push(n.id); }
    });
    if(nodes.length) rebuildLayout();
  }catch(e){console.warn('load error',e);}
}

function saveCustomNodes(){
  const custom=Object.values(D).filter(n=>n._custom);
  localStorage.setItem('esg_custom_nodes',JSON.stringify(custom));
}

function rebuildLayout(){
  GROUPS.forEach((g,gi)=>{
    const col=gi%GROUPS_PER_ROW;
    const prevColGroups=[];
    for(let pi=0;pi<gi;pi++){ if(pi%GROUPS_PER_ROW===col) prevColGroups.push(GROUPS[pi]); }
    let gyFinal=GROUP_START_Y;
    prevColGroups.forEach(pg=>{ const pgH=GROUP_HEADER_H+GROUP_BRACE_PAD+pg.ids.length*(GROUP_ITEM_H+GROUP_ITEM_GAP)+30; gyFinal+=pgH+40; });
    const gx=GROUPS_START_X+col*(GROUP_COL_W+60);
    groupPos[g.cat]={x:gx,y:gyFinal};
    g.ids.forEach((id,ii)=>{ groupPos[id]={x:gx+30,y:gyFinal+GROUP_HEADER_H+GROUP_BRACE_PAD+ii*(GROUP_ITEM_H+GROUP_ITEM_GAP)}; });
  });
  let tw=0,th=0;
  [...Object.values(trunkPos),...Object.values(groupPos)].forEach(p=>{ tw=Math.max(tw,(p.x||0)+NW+60); th=Math.max(th,(p.y||0)+GROUP_ITEM_H+60); });
  svg.setAttribute('width',tw); svg.setAttribute('height',th); svg.setAttribute('viewBox',`0 0 ${tw} ${th}`);
  renderAll(currentId);
}

// Explicit abbr map for all nodes
// abbr = short code shown on node (line1, bold)
// zh   = Chinese name shown on node (line2, light)
const ABBR_MAP={
  unfccc:'UNFCCC', kyoto:'京都議定書', cdm:'CDM / JI / ET', paris:'巴黎協定',
  ndc:'NDC', cop:'COP', ipcc:'IPCC', itmo:'ITMO', pacm:'PACM',

  sfdr:'SFDR', eutax:'EU Taxonomy', greenbond:'綠色債券',

loadCustomNodes();
</script>

  </div>
  <div class="add-row">
    <div style="flex:1" class="field-group"><div class="add-label">關鍵數字</div><input class="add-input" id="f-num" placeholder="例：2026年生效 ／ 門檻€1.5億"></div>
    <div style="flex:1" class="field-group"><div class="add-label">適用對象</div><input class="add-input" id="f-who" placeholder="例：歐盟大型企業"></div>
  </div>
  <div class="btn-row">
    <button class="btn-cancel" onclick="closeAddModal()">取消</button>
    <button class="btn-add" id="btn-add" onclick="addNode()">加入關係圖</button>
  </div>
  <div id="custom-list"></div>

  <div class="add-section-title">備份與還原</div>
  <div class="btn-row" style="margin-bottom:6px">
    <button class="btn-cancel" style="flex:1;text-align:center" onclick="exportNodes()">⬇ 匯出備份 JSON</button>
    <label class="btn-cancel" style="flex:1;text-align:center;cursor:pointer">
      ⬆ 匯入備份 JSON
      <input type="file" accept=".json" style="display:none" onchange="importNodes(event)">
    </label>
  </div>
  <div style="font-size:10px;color:var(--text3);text-align:center;padding-bottom:4px">換裝置或清快取前請先匯出備份</div>
</div>
</div>

<script>
function openAddModal(){ document.getElementById('add-modal').classList.add('open'); refreshCustomList(); updateSavedCount(); document.getElementById('f-abbr').focus(); }
function closeAddModal(){ document.getElementById('add-modal').classList.remove('open'); }
function handleModalClick(e){ if(e.target===document.getElementById('add-modal')) closeAddModal(); }
function updateSavedCount(){ const c=Object.values(D).filter(n=>n._custom); document.getElementById('saved-count').textContent=c.length?`已有 ${c.length} 個自訂名詞`:''; }

async function generateWithAI(){
  const abbr=document.getElementById('f-abbr').value.trim();
  const zh=document.getElementById('f-zh').value.trim();
  const en=document.getElementById('f-en').value.trim();
  const cat=document.getElementById('f-cat').value;
  const catLabel=CATS[cat]?.label||cat;
  if(!abbr){ showErr('請先填入縮寫 / 簡稱'); return; }
  const btn=document.getElementById('btn-gen'); const icon=document.getElementById('gen-icon');
  btn.disabled=true; icon.textContent='↻'; icon.classList.add('spin'); hideErr();
  const catOptions='climate=氣候協議,intl=國際法規,disc=揭露框架,carbon=碳市場,social=社會面S,gov=治理面G,nature=自然生態,finance=永續金融,tech=減碳技術,tw=台灣專區';
  const prompt=`你是ESG永續領域的專家教師。請針對以下名詞，用繁體中文生成結構化說明，輸出純 JSON 格式（不要加任何說明文字或 markdown）。

名詞：${abbr}${zh?'（'+zh+'）':''}${en?'，英文全名：'+en:''}

請輸出以下 JSON 結構（cat 請從以下選項選一個最合適的值：${catOptions}）：
{
  "zh": "中文名稱（2-10字）",
  "en": "英文全名或簡短英文描述",
  "cat": "最合適的分類代碼（如 intl、disc、carbon 等）",
  "prob": "解決什麼問題（50-120字，白話描述這個機制存在的原因）",
  "how": "怎麼運作（80-200字，具體說明機制內容，可用①②③分點）",
  "tw": "台灣影響（40-100字，對台灣企業的實際影響，具體舉例）",
  "exam": "考試重點（用▸開頭，列3-5個重點，每點一行）",
  "num": "關鍵數字（用 ／ 分隔）",
  "who": "適用對象（簡短說明）"
}`;
  try{
    const res=await fetch('https://esg-ai-proxy.annycyt.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    const text=data.content?.map(c=>c.text||'').join('').trim();
    if(!text) throw new Error('API沒有回應內容');
    const jsonMatch=text.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('無法解析 AI 回應');
    const parsed=JSON.parse(jsonMatch[0]);
    if(parsed.cat && CATS[parsed.cat]) document.getElementById('f-cat').value=parsed.cat;
    if(parsed.zh) document.getElementById('f-zh').value=parsed.zh;
    if(parsed.en) document.getElementById('f-en').value=parsed.en;
    if(parsed.prob) document.getElementById('f-prob').value=parsed.prob;
    if(parsed.how) document.getElementById('f-how').value=parsed.how;
    if(parsed.tw) document.getElementById('f-tw').value=parsed.tw;
    if(parsed.exam) document.getElementById('f-exam').value=parsed.exam;
    if(parsed.num) document.getElementById('f-num').value=parsed.num;
    if(parsed.who) document.getElementById('f-who').value=parsed.who;
  }catch(e){ showErr('AI 生成失敗：'+e.message+'。請手動填寫各欄位。'); }
  finally{ btn.disabled=false; icon.classList.remove('spin'); icon.textContent='✦'; }
}

function showErr(msg){ const el=document.getElementById('gen-err'); el.textContent=msg; el.style.display='block'; }
function hideErr(){ document.getElementById('gen-err').style.display='none'; }

function addNode(){
  const abbr=document.getElementById('f-abbr').value.trim();
  const zh=document.getElementById('f-zh').value.trim();
  const cat=document.getElementById('f-cat').value;
  if(!abbr){ showErr('縮寫 / 簡稱是必填的'); return; }
  if(!zh && !document.getElementById('f-prob').value.trim()){ showErr('請填入中文名稱或說明（或先點 AI 生成）'); return; }
  const id='custom_'+abbr.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now();
  const node={id, zh:zh||abbr, en:document.getElementById('f-en').value.trim(), cat,
    prob:document.getElementById('f-prob').value.trim()||'（使用者新增）',
    how:document.getElementById('f-how').value.trim(),
    tw:document.getElementById('f-tw').value.trim(),
    exam:document.getElementById('f-exam').value.trim(),
    num:document.getElementById('f-num').value.trim(),
    who:document.getElementById('f-who').value.trim(),
    rel:[], _custom:true};
  D[id]=node;
  const g=GROUPS.find(g=>g.cat===cat); if(g&&!g.ids.includes(id)) g.ids.push(id);
  saveCustomNodes(); rebuildLayout();
  ['f-abbr','f-zh','f-en','f-prob','f-how','f-tw','f-exam','f-num','f-who'].forEach(fid=>{ const el=document.getElementById(fid); if(el) el.value=''; });
  hideErr(); refreshCustomList(); updateSavedCount();
  setTimeout(()=>{ currentId=id; renderAll(id); showPanel(D[id]); },100);
  closeAddModal();
}

function deleteCustomNode(id){
  if(!confirm('確定要刪除「'+(D[id]?.zh||id)+'」嗎？')) return;
  delete D[id];
  GROUPS.forEach(g=>{ const i=g.ids.indexOf(id); if(i>-1) g.ids.splice(i,1); });
  saveCustomNodes(); rebuildLayout(); refreshCustomList(); updateSavedCount();
  if(currentId===id) closePanel();
}

function exportNodes(){
  const custom=Object.values(D).filter(n=>n._custom);
  if(!custom.length){ alert('還沒有自訂名詞可以匯出'); return; }
  const json=JSON.stringify(custom, null, 2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='esg_custom_nodes_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importNodes(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const nodes=JSON.parse(e.target.result);
      if(!Array.isArray(nodes)) throw new Error('格式錯誤');
      let added=0;
      nodes.forEach(n=>{
        if(!n.id||!n.zh||!n.cat) return;
        if(!D[n.id]){
          n._custom=true;
          D[n.id]=n;
          const g=GROUPS.find(g=>g.cat===n.cat);
          if(g&&!g.ids.includes(n.id)) g.ids.push(n.id);
          added++;
        }
      });
      saveCustomNodes();
      rebuildLayout();
      refreshCustomList();
      updateSavedCount();
      alert(`成功匯入 ${added} 個名詞！${nodes.length-added>0?'（'+（nodes.length-added)+'個已存在，略過）':''}`);
    }catch(err){
      alert('匯入失敗：'+err.message+'\n請確認是由本工具匯出的 JSON 檔案');
    }
    event.target.value='';
  };
  reader.readAsText(file);
}

function refreshCustomList(){
  const custom=Object.values(D).filter(n=>n._custom);
  const el=document.getElementById('custom-list');
  if(!custom.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="add-section-title">已新增的名詞（${custom.length} 個）</div>`+
    custom.map(n=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)"><div><span style="font-size:12px;color:#dde2f0;font-weight:500">${n.zh}</span><span style="font-size:10px;color:#4e5875;margin-left:6px">${CATS[n.cat]?.label||n.cat}</span></div><button onclick="deleteCustomNode('${n.id}')" style="background:rgba(226,75,74,.15);border:1px solid rgba(226,75,74,.3);color:#E24B4A;border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:'IBM Plex Sans TC',sans-serif">刪除</button></div>`).join('');
}
</script>
</body>
</html>
