<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG 永續領域功能分類圖</title>
<style>
:root{
  --bg:#f5efe6;
  --bg2:#ede4d8;
  --bg3:#e4d9ca;
  --bg4:#d9ccba;
  --card:#ffffffcc;
  --border:rgba(120,90,60,0.12);
  --border2:rgba(120,90,60,0.22);
  --text:#2d1f0e;
  --text2:#6b4f35;
  --text3:#a07f5e;
  --font:'IBM Plex Sans TC','Noto Sans TC',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --shadow:0 2px 12px rgba(120,90,60,0.10);
  --panel-w:380px;

  /* layer colors */
  --l1:#1a6b4a; --l1b:#e8f5ef; --l1t:#0d4a30;
  --l2:#b5400a; --l2b:#fdf0e8; --l2t:#7a2800;
  --l3:#4a5fb5; --l3b:#edf0fc; --l3t:#2a3a8a;
  --l4:#7a3fa0; --l4b:#f3edfb; --l4t:#4e2070;
  --l5:#b58a0a; --l5b:#fdf8e8; --l5t:#7a5c00;
  --l6:#2a7a8a; --l6b:#e8f5f8; --l6t:#1a4f5a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* ── HEADER ── */
#hdr{
  flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:8px 16px;background:var(--bg2);
  border-bottom:1px solid var(--border2);
  box-shadow:0 1px 4px rgba(120,90,60,0.08);
}
#hdr-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;letter-spacing:.01em}
#srch-wrap{position:relative;flex:1;max-width:260px}
#srch{
  width:100%;background:var(--card);border:1px solid var(--border2);
  border-radius:8px;padding:6px 10px 6px 30px;
  font-size:12px;color:var(--text);font-family:var(--font);outline:none;
}
#srch:focus{border-color:var(--l1);box-shadow:0 0 0 2px rgba(26,107,74,.12)}
#srch::placeholder{color:var(--text3)}
.srch-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text3);pointer-events:none}
#btn-add-node{
  display:flex;align-items:center;gap:5px;padding:6px 12px;
  background:var(--l1);color:#fff;border:none;border-radius:8px;
  font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);
  white-space:nowrap;transition:background .15s;
}
#btn-add-node:hover{background:var(--l1t)}
#hdr-count{font-size:11px;color:var(--text3);margin-left:auto;white-space:nowrap}

/* ── BODY ── */
#body{display:flex;flex:1;overflow:hidden}
#resizer{
  width:12px;flex-shrink:0;cursor:col-resize;
  background:transparent;
  position:relative;z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
}
#resizer::after{
  content:'';position:absolute;top:0;left:50%;
  transform:translateX(-50%);
  width:3px;height:100%;
  background:var(--border2);
  border-radius:2px;
  transition:background .15s, width .15s;
}
#resizer:hover::after,#resizer.dragging::after{
  background:var(--l1);
  width:4px;
}
@media(max-width:700px){#resizer{display:none}}
#lanes-wrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 120px}
#lanes-wrap::-webkit-scrollbar{width:5px}
#lanes-wrap::-webkit-scrollbar-track{background:transparent}
#lanes-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── LANE ── */
.lane{
  border-radius:12px;border:1.5px solid;margin-bottom:10px;
  overflow:hidden;background:var(--card);
  box-shadow:var(--shadow);
}
.lane-hdr{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 14px;cursor:default;
}
.lane-num{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px;
}
.lane-info{flex:1}
.lane-title{font-size:13px;font-weight:600;margin-bottom:2px}
.lane-desc{font-size:12px;opacity:.75;line-height:1.55}
.lane-badge{
  font-size:10px;font-weight:500;padding:3px 10px;
  border-radius:20px;border:1.5px solid;white-space:nowrap;
  align-self:flex-start;flex-shrink:0;
}
.lane-body{padding:8px 12px 12px;display:flex;flex-wrap:wrap;gap:6px}
.lane-drag-hint{
  width:100%;font-size:10px;color:var(--text3);
  text-align:right;padding-bottom:4px;
}

/* ── TERM CHIP ── */
.term{
  display:inline-flex;align-items:center;gap:4px;
  font-size:13px;font-weight:500;padding:6px 12px;
  border-radius:20px;border:1.5px solid;cursor:pointer;
  transition:all .12s;user-select:none;
  background:rgba(255,255,255,.7);
}
.term:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.1)}
.term.selected{color:#fff!important;border-color:transparent!important}
.term.dim{opacity:.2;pointer-events:none}
.term-plus{font-size:14px;opacity:.6;line-height:1}

/* drag */
.term.dragging{opacity:.4}
.term.drag-over{box-shadow:0 0 0 2px #1a6b4a}
.drop-line{
  display:none;width:2px;height:28px;background:#1a6b4a;
  border-radius:1px;align-self:center;
}
.drop-line.show{display:block}

/* ── DETAIL PANEL ── */
#panel{
  width:var(--panel-w);flex-shrink:0;min-width:var(--panel-w);
  background:var(--bg2);border-left:1.5px solid var(--border2);
  overflow-y:auto;display:flex;flex-direction:column;
  transition:opacity .18s;
}
#panel.closed{display:none}
#panel-inner{padding:16px 15px;min-width:var(--panel-w)}
.p-close{display:flex;justify-content:flex-end;margin-bottom:8px}
.p-close-btn{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);border-radius:6px;padding:4px 12px;
  font-size:13px;cursor:pointer;font-family:var(--font);
}
.p-close-btn:hover{background:var(--bg4)}
.p-layer-badge{
  display:inline-block;font-size:12px;font-weight:500;
  padding:3px 10px;border-radius:20px;margin-bottom:8px;
  border:1.5px solid;
}
.p-title{font-size:20px;font-weight:600;margin-bottom:2px}
.p-actions{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.p-act-btn{
  font-size:13px;padding:5px 11px;border-radius:6px;cursor:pointer;
  border:1px solid var(--border2);background:var(--card);
  color:var(--text2);font-family:var(--font);transition:all .1s;
}
.p-act-btn:hover{background:var(--bg3);color:var(--text)}
.p-sec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:12px 0 5px;font-weight:600}
.p-sec-toggle{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;
  padding:6px 2px;border-radius:4px;
  margin:10px 0 2px;
}
.p-sec-toggle:active{background:var(--bg3)}
.p-sec-toggle:hover .p-sec-arrow{color:var(--text2)}
.p-sec-toggle:hover{color:var(--text2)}
.p-sec-arrow{
  font-size:18px;transition:transform .25s;display:inline-block;
  color:var(--text2);line-height:1;margin-left:4px;
}
.p-sec-arrow.collapsed{transform:rotate(-90deg)}
.p-collapsible{
  overflow:hidden;
  transition:max-height .25s ease, opacity .2s;
  max-height:2000px;opacity:1;
}
.p-collapsible.collapsed{max-height:0;opacity:0}
.p-box{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:9px 11px;margin-bottom:6px;
  font-size:14px;line-height:1.8;color:var(--text2);
}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.p-grid.full{grid-template-columns:1fr}
.p-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 9px}
.p-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:3px;font-weight:600}
.p-val{font-size:14px;line-height:1.75;color:var(--text2)}
.p-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rel-chip{
  font-size:13px;padding:4px 10px;border-radius:4px;
  background:var(--bg3);color:var(--text2);cursor:pointer;
  border:1px solid var(--border2);transition:all .1s;
}
.rel-chip:hover{background:var(--bg4);color:var(--text)}

/* ── ADD / EDIT PANEL ── */
#side-panel{
  width:var(--panel-w);flex-shrink:0;min-width:var(--panel-w);
  background:var(--bg2);border-left:1.5px solid var(--border2);
  overflow-y:auto;display:flex;flex-direction:column;
  transition:opacity .18s;
}
#side-panel.closed{display:none}
#side-inner{padding:16px 15px;min-width:var(--panel-w)}
.s-title{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text)}
.s-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:4px;font-weight:600}
.s-input{
  width:100%;background:var(--card);border:1.5px solid var(--border2);
  border-radius:8px;padding:7px 10px;font-size:12px;color:var(--text);
  font-family:var(--font);outline:none;margin-bottom:8px;
}
.s-input:focus{border-color:var(--l1);box-shadow:0 0 0 2px rgba(26,107,74,.1)}
.s-select{
  width:100%;background:var(--card);border:1.5px solid var(--border2);
  border-radius:8px;padding:7px 10px;font-size:12px;color:var(--text);
  font-family:var(--font);outline:none;margin-bottom:8px;cursor:pointer;
}
.s-textarea{
  width:100%;background:var(--card);border:1.5px solid var(--border2);
  border-radius:8px;padding:7px 10px;font-size:12px;color:var(--text);
  font-family:var(--font);outline:none;resize:vertical;min-height:68px;
  line-height:1.65;margin-bottom:8px;
}
.s-textarea:focus,.s-input:focus{border-color:var(--l1)}
.s-row{display:flex;gap:8px}
.s-row>div{flex:1}
.btn-ai-gen{
  width:100%;padding:8px;border-radius:8px;border:none;cursor:pointer;
  font-size:12px;font-weight:500;font-family:var(--font);
  background:linear-gradient(135deg,var(--l1),var(--l3));
  color:#fff;margin-bottom:8px;display:flex;align-items:center;
  justify-content:center;gap:7px;transition:opacity .15s;
}
.btn-ai-gen:disabled{opacity:.5;cursor:not-allowed}
.spin{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-row{display:flex;gap:7px;margin-top:4px}
.btn-primary{
  flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;
  font-size:12px;font-weight:500;background:var(--l1);color:#fff;
  font-family:var(--font);transition:background .15s;
}
.btn-primary:hover{background:var(--l1t)}
.btn-secondary{
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;
  background:var(--card);border:1.5px solid var(--border2);
  color:var(--text2);font-family:var(--font);
}
.btn-secondary:hover{background:var(--bg3)}
.btn-danger{
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;
  background:rgba(180,50,30,.08);border:1px solid rgba(180,50,30,.25);
  color:#b4321e;font-family:var(--font);
}
.s-err{font-size:11px;color:#b4321e;margin-bottom:6px;display:none}
.s-sec-title{
  font-size:9px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--l1);margin:12px 0 7px;font-weight:600;
  border-top:1px solid var(--border);padding-top:10px;
}

/* AI preview */
#ai-preview{
  display:none;background:var(--bg3);border:1.5px solid var(--border2);
  border-radius:10px;padding:12px;margin-bottom:10px;
}
#ai-preview.show{display:block}
.preview-title{font-size:11px;font-weight:600;color:var(--text);margin-bottom:8px}
.preview-field{margin-bottom:6px}
.preview-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:2px;font-weight:600}
.preview-val{font-size:11px;color:var(--text2);line-height:1.6;white-space:pre-wrap}
.preview-actions{display:flex;gap:6px;margin-top:10px}

/* ── MOBILE ── */
@media(max-width:700px){
  #hdr-title{font-size:11px}
  #hdr-count{display:none}
  #panel,#side-panel{
    position:fixed;left:0;right:0;bottom:0;
    width:100%!important;max-height:75vh;
    border-left:none;border-top:2px solid var(--border2);
    border-radius:14px 14px 0 0;transform:translateY(100%);
    transition:transform .3s ease;opacity:1!important;z-index:200;
  }
  #panel.open,#side-panel.open{transform:translateY(0)}
  #panel-inner,#side-inner{min-width:0;padding:12px 14px 32px}
  #panel-inner::before,#side-inner::before{
    content:'';display:block;width:36px;height:4px;
    background:var(--border2);border-radius:2px;margin:0 auto 12px;
  }
  .p-grid{grid-template-columns:1fr}
}

/* API key modal */
#api-modal{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(45,31,14,.35);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;
}
#api-modal.open{display:flex}
#api-box{
  background:var(--bg2);border:1.5px solid var(--border2);
  border-radius:14px;width:90%;max-width:400px;padding:22px 20px;
}
.api-title{font-size:14px;font-weight:600;margin-bottom:6px}
.api-desc{font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:14px}
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

<!-- HEADER -->
<div id="hdr">
  <div id="hdr-title">ESG 永續領域功能分類圖</div>
  <div id="srch-wrap">
    <svg class="srch-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 2.5 2.5"/></svg>
    <input id="srch" placeholder="搜尋名詞…" autocomplete="off">
  </div>
  <button id="btn-add-node" onclick="openAddPanel()">＋ 新增名詞</button>
  <div id="hdr-count"></div>
</div>

<!-- BODY -->
<div id="body">

  <!-- LANES -->
  <div id="lanes-wrap">
    <div style="font-size:10px;color:var(--text3);text-align:right;padding:4px 2px 6px">拖曳名詞可移動至其他功能層</div>
    <div id="lanes-container"></div>
  </div>

  <!-- RESIZER -->
  <div id="resizer" title="拖曳調整寬度"></div>

  <!-- DETAIL PANEL -->
  <div id="panel" class="closed">
    <div id="panel-inner">
      <div class="p-close"><button class="p-close-btn" onclick="closePanel()">關閉 ×</button></div>
      <div id="panel-content"></div>
    </div>
  </div>

  <!-- ADD/EDIT SIDE PANEL -->
  <div id="side-panel" class="closed">
    <div id="side-inner">
      <div class="p-close"><button class="p-close-btn" onclick="closeSidePanel()">關閉 ×</button></div>
      <div id="side-content"></div>
    </div>
  </div>

</div>
</div>

<!-- API KEY MODAL -->
<div id="api-modal" onclick="handleApiModalClick(event)">
  <div id="api-box">
    <div class="api-title">⚙ API 設定</div>
    <div class="api-desc">輸入你的 Gemini API Key，用於 AI 自動生成說明。完全免費（每天 1,500 次），API Key 只存在你的瀏覽器。<br><br>取得 Gemini API Key：<a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--l1)">aistudio.google.com/app/apikey</a></div>
    <div class="s-label">Gemini API Key</div>
    <input class="s-input" id="api-gemini-key" type="password" placeholder="AIza..." style="margin-bottom:10px">
    <div class="s-label">Cloudflare Worker 網址（用於 KV 同步）</div>
    <input class="s-input" id="api-worker-url" placeholder="https://esg-ai-proxy.annycyt.workers.dev" style="margin-bottom:14px">
    <div class="btn-row">
      <button class="btn-secondary" onclick="closeApiModal()">取消</button>
      <button class="btn-primary" onclick="saveApiSettings()">儲存</button>
    </div>
    <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:14px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:10px;line-height:1.6">
        如果本機有編輯紀錄但其他裝置沒有同步，點此強制推送所有本機資料到雲端。
      </div>
      <button onclick="forcePushToKV()" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--font)">
        ☁ 強制推送本機資料到雲端
      </button>
      <div id="force-push-status" style="font-size:11px;margin-top:6px;color:var(--text3)"></div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   LAYER DEFINITIONS
════════════════════════════════════════════ */
const LAYER_DEFS = [
  {
    id:'l1', num:1, color:'#1a6b4a', bg:'#e8f5ef', text:'#0d4a30',

    terms:['ipcc','unfccc','kyoto','paris','ndc','cop','sdgs','cdm','itmo','pacm']

    badge:'有罰則',
    terms:['csrd','esrs','csddd','cbam','euets','eudr','ppwr','corsia','imo','ira','secrule','twlaw','twcf','uflpa','msa','clitigation']
  },
  {
    id:'l3', num:3, color:'#4a5fb5', bg:'#edf0fc', text:'#2a3a8a',
    title:'主流自願準則（市場實質強制）',
    desc:'法律上沒有罰款，但主要投資人、客戶、評級機構都要求你遵循──不遵循等同於市場懲罰。',
    badge:'市場壓力',
    terms:['issb','gri','tcfd','tnfd','cdp','sasb','doubmat','sbti','netzero','re100','ungp','ungc','ilo','rba','sa8000','oecd','fpic','sbtn','sfdr','eutax','esma','esgratin','equator','cbcr']
  },
  {
    id:'l4', num:4, color:'#7a3fa0', bg:'#f3edfb', text:'#4e2070',
    title:'運作機制',
    desc:'把政策目標轉化成實際制度設計，如定價、盤查方法學、計算標準──「怎麼做」的系統。',
    badge:'機制層',
    terms:['cap','cfvst','ghgpro','scope','iso14064','iso14067','iso14068','supchain']
  },
  {
    id:'l5', num:5, color:'#b58a0a', bg:'#fdf8e8', text:'#7a5c00',
    title:'市場工具 & 金融產品',
    desc:'具體的金融或市場工具──機制層的「貨幣」，讓減碳行為可以被量化、交易和融資。',
    badge:'工具層',
    terms:['vcm','ccp','eua','redd','tcex','trec','cppa','greenbond','slb','transitfin','prisma','esco','iso50001']
  },
  {
    id:'l6', num:6, color:'#2a7a8a', bg:'#e8f5f8', text:'#1a4f5a',
    title:'概念術語 & 技術解方',
    desc:'新聞和報告中常見的縮寫與技術方向──了解定義和在整個體系中的位置。',
    badge:'概念層',
    terms:['netzero_c','cdr','dac','ccus','saf','greenh2','greenamm','egs','smr','p2x','gbf','naturalcap','bluec','epr','fsc','circular','twpath','dei']
  }
];

/* ════════════════════════════════════════════
   DATA
════════════════════════════════════════════ */
const D = {
ipcc:{zh:'IPCC',en:'Intergovernmental Panel on Climate Change',
  prob:'政策談判需要科學依據。哪個溫度目標才安全？現在暖化了幾度？IPCC就是回答這些問題的機構，為氣候政策提供科學共識基礎。',

cap:{zh:'Cap-and-Trade',en:'總量管制與排放交易',

  how:'政府設定排放總量上限（cap），每年遞減；企業若排放超過分配配額，需從市場購買碳權；排放低於配額者可出售盈餘碳權。比起碳稅，cap確保排放量不超上限，但碳價波動較大。',

cfvst:{zh:'碳費 vs 碳稅',en:'Carbon Fee vs Carbon Tax',
  prob:'「碳費」和「碳稅」聽起來很像，但法律性質、收入用途、靈活性都不一樣。台灣採碳費而非碳稅，這個選擇有重要含義。',
  how:'碳稅：透過立法課稅，收入進一般財政，法律效力強，修改需立法院通過，難度高。碳費：行政收費，由主管機關（環境部）收取，收入進氣候基金（專款），調整費率較靈活，但法律效力稍弱。台灣選擇碳費，主要考量政治可行性和政策靈活性。',
  tw:'台灣採碳費（而非碳稅），環境部可較靈活調整費率。但費率低（300元≈€9）仍是主要批評。碳費只是第一步，未來ETS才是主要工具。',
  exam:'▸ 碳稅（立法課稅）vs 碳費（行政收費）（必考）\n▸ 台灣採碳費（非碳稅）\n▸ 碳費收入→氣候基金（專款）\n▸ Cap-and-trade vs 碳稅/費（量vs價）',
  num:'台灣初期300元/噸（碳費）',
  who:'了解碳定價機制的企業和從業者',rel:['twcf','euets','cap']},

ghgpro:{zh:'GHG Protocol',en:'溫室氣體盤查議定書',

  how:'由WRI與WBCSD聯合開發，是全球最廣泛使用的企業溫室氣體盤查框架。定義了Scope 1/2/3的計算方法，提供活動數據×排放係數的計算邏輯。ISSB、CSRD、台灣環境部的盤查要求均以GHG Protocol為基礎。',
  tw:'台灣環境部的溫室氣體盤查規定參考GHG Protocol架構。台灣企業的碳盤查報告幾乎全部依循GHG Protocol。',
  exam:'▸ GHG Protocol是全球最廣泛的盤查框架\n▸ 定義Scope 1/2/3（必考起源）\n▸ 市場基礎法vs位置基礎法（Scope 2）\n▸ ISSB、CSRD、台灣法規的基礎',
  num:'全球>90%的Fortune 500企業使用',

scope:{zh:'Scope 1/2/3',en:'溫室氣體排放三範疇',
  prob:'企業排放的溫室氣體來源複雜——有自己燃燒的、有用電間接的、有供應鏈裡的。GHG Protocol設計了三個範疇清楚分類。',
  how:'Scope 1：直接排放（燃燒化石燃料、製程排放、逸散如冷媒外洩）。Scope 2：購入電力的間接排放（有市場基礎法和位置基礎法）。Scope 3：供應鏈上下游所有其他間接排放，分15個子類。Scope 3通常佔企業總排放的70-90%。',
  tw:'台灣金管會要求上市櫃公司揭露Scope 1&2；Scope 3為鼓勵性揭露。但ISSB S2要求全部揭露，未來台灣將跟進。',
  exam:'▸ 三個範疇定義（超高頻必考）\n▸ Scope 3有15個子類別\n▸ 市場基礎法vs位置基礎法（Scope 2）\n▸ Scope 3佔企業總排放70-90%',
  num:'Scope 3共15個子類 ／ 通常佔70-90%排放',
  who:'所有進行GHG盤查的企業',rel:['issb','ghgpro','iso14064','sbti','csrd']},

iso14064:{zh:'ISO 14064',en:'GHG盤查驗證國際標準',
  prob:'企業說自己的碳排放是X噸，但怎麼確認這個數字是真的？ISO 14064提供盤查方法學和第三方查證的標準。',
  how:'三個部分：ISO 14064-1（組織層級盤查，6大類別）、ISO 14064-2（專案層級盤查）、ISO 14064-3（查證標準）。組織邊界設定三種方法：①營運控制法（台灣主流）②財務控制法③股權比例法。ISO 14065是查驗機構的認可標準。',
  tw:'台灣強制盤查（>2.5萬噸）的企業需依ISO 14064-1盤查，並取得ISO 14064-3查證。查驗機構（BSI、SGS等）需取得ISO 14065認可。',
  exam:'▸ 14064-1（組織）vs 14064-2（專案）vs 14064-3（查證）\n▸ 組織邊界三種方法（營運控制法是台灣主流）\n▸ 6大排放類別\n▸ 查證 vs 確證的差異',
  num:'6大排放類別 ／ 三種組織邊界方法',
  who:'所有需要正式GHG盤查和查證的企業',rel:['ghgpro','scope','iso14067','twcf']},

iso14067:{zh:'ISO 14067',en:'產品碳足跡標準',
  prob:'供應商出口歐洲、回應客戶要求時，需要知道每一個產品「從搖籃到大門」或「從搖籃到墳墓」產生了多少碳。ISO 14067就是計算產品碳足跡（PCF）的標準。',
  how:'以LCA（生命週期評估）方法計算產品碳足跡，涵蓋原料取得→製造→運輸→使用→廢棄全流程。兩種系統邊界：搖籃到大門（Cradle-to-Gate，生產階段）和搖籃到墳墓（Cradle-to-Grave，全生命週期）。CBAM要求的「內嵌排放量」計算依此標準。',
  tw:'台灣碳標籤制度依ISO 14067。CBAM要求台灣鋼鐵、鋁業提供內嵌排放量，計算依據就是ISO 14067。',
  exam:'▸ PCF=產品碳足跡（Product Carbon Footprint）\n▸ 搖籃到大門 vs 搖籃到墳墓（必考差異）\n▸ CBAM「內嵌排放量」依此計算\n▸ LCA四階段（目標範疇→清單分析→衝擊評估→詮釋）',
  num:'搖籃到大門 or 搖籃到墳墓兩種邊界',
  who:'需計算產品碳足跡的製造商（特別是出口歐盟）',rel:['cbam','iso14064','iso14068']},

iso14068:{zh:'ISO 14068-1',en:'碳中和標準',
  prob:'企業想宣稱「碳中和產品」，但如果只是買了劣質碳信用就宣稱碳中和，這是漂綠。ISO 14068提供碳中和的嚴格標準和查證要求。',
  how:'碳中和≠淨零（碳中和可用抵換，但需符合嚴格條件）。三步驟：①量化（依ISO 14064或14067）②減少（先盡力減碳）③移除或抵換剩餘（只有在充分減碳後才能用CDR或高品質VCM抵換）。需取得第三方查證才能對外宣稱碳中和。',
  tw:'台灣企業宣稱「碳中和產品或服務」必須依ISO 14068並取得查證，否則屬漂綠。台灣環境部已公告此標準為官方依循規範。',
  exam:'▸ 碳中和三步驟：量化→減少→抵換/移除\n▸ 碳中和 vs 淨零差異\n▸ 必須取得第三方查證\n▸ 先減碳再抵換（順序重要）',
  num:'三步驟：量化→減少→抵換/移除',
  who:'宣稱碳中和的企業和產品',rel:['vcm','cdr','iso14064','iso14067']},

  how:'企業或個人自願購買碳信用以抵換排放的市場。碳信用來源：再生能源、植林、CCUS、藍碳等。主要認證機構：Verra（VCS標準）、Gold Standard。ICVCM制定CCP標籤，識別高品質碳信用。',
  tw:'TCEX（台灣碳交易所）是本土VCM平台，2023年成立。目前以國際碳信用交易為主，本土碳信用（自願減量額度）即將上路。',
  exam:'▸ VCM vs 強制碳市場（EU ETS）的差異\n▸ CCP是VCM品質認證標準\n▸ Verra（VCS）、Gold Standard是主要認證機構\n▸ 碳信用用於ISO 14068碳中和聲明',

  prob:'VCM充斥低品質甚至造假的碳信用——企業買了，但碳排根本沒有真正被抵消。CCP是用來識別「真正有效」碳信用的品質標章。',
  how:'ICVCM（完整性理事會）制定的10項核心原則，包含：真實性、額外性（沒有這個計畫就不會減碳）、永久性、無雙重計算等。通過CCP認定的碳信用可獲CCP標籤，交易價格更高、更受機構投資人認可。',

  prob:'企業想讓Scope 2（購電）達到零碳，但台灣電力大部分仍是火力發電。T-REC提供一個機制，讓企業的用電可以「掛牌」為再生能源。',
  how:'1張T-REC = 1,000度（1 MWh）再生能源電力。企業購買T-REC可作為Scope 2「市場基礎法」的零排放依據。取得途徑：①直接購買（台電T-REC交易平台）②搭配CPPA長期購電合約。台積電、鴻海等大廠大量購買T-REC以達成RE100目標。',
  tw:'T-REC是目前台灣企業達成Scope 2零碳的主要工具。台灣T-REC需求快速增長，價格也持續上升。',
  exam:'▸ 1張T-REC = 1,000度（1 MWh）再生能源\n▸ Scope 2市場基礎法的依據\n▸ T-REC vs CPPA差異（當期購買 vs 長期合約）\n▸ RE100達成的主要工具',
  num:'1張 = 1 MWh ／ 市場基礎法依據',
  who:'需要Scope 2零碳的台灣企業',rel:['re100','cppa','scope','twpath']},

cppa:{zh:'CPPA',en:'企業購電合約',
  prob:'T-REC是當期購買，價格波動。企業如果想鎖定長期綠電價格並確保穩定供應，需要直接與發電商簽長期合約。',
  how:'Corporate Power Purchase Agreement，企業直接與再生能源發電商簽訂長期購電合約（通常10-20年），取得綠電及T-REC，鎖定電價並確保供應穩定性。台灣電業法2017年修正後開放CPPA。台積電已與沃旭（Ørsted）等離岸風電商簽訂大型CPPA。',
  tw:'台積電是台灣CPPA最大買家。電網限制仍是主要障礙（綠電送不到需求端）。',
  exam:'▸ CPPA vs T-REC差異（長期合約 vs 當期購買）\n▸ 台灣電業法2017年開放\n▸ 鎖定長期綠電價格+確保穩定供應',
  num:'合約期通常10-20年',
  who:'有長期大量綠電需求的企業（如台積電）',rel:['trec','re100','scope','twpath']},

greenbond:{zh:'綠色債券',en:'Green Bond',
  prob:'企業需要大量資金投入再生能源、節能建築等綠色計畫，但一般債券的資金流向不受限制。綠色債券確保資金專用於綠色用途。',
  how:'募集資金專門用於符合環境效益的計畫（再生能源、節能建築、清潔交通）的債券，需符合ICMA《綠色債券原則》，並進行第三方驗證。與SLB的差異：綠色債券限定資金用途，SLB限定績效指標但資金不限用途。',
  tw:'台灣2023年綠色債券發行規模超過700億台幣。台積電、元大金等已發行綠色債券。台灣證交所設有綠色債券平台。',
  exam:'▸ 綠色債券 vs SLB：資金用途限定 vs 績效指標掛鉤（必考）\n▸ ICMA綠色債券原則（標準依據）\n▸ 需第三方驗證',
  num:'台灣2023年：>700億台幣',
  who:'需要綠色計畫融資的企業和政府',rel:['slb','eutax','sfdr','transitfin']},

slb:{zh:'SLB',en:'永續連結債券',
  prob:'綠色債券只適合有明確綠色投資計畫的企業。如果企業想整體轉型，資金用途難以明確區分。SLB讓績效指標掛鉤利率，更靈活。',
  how:'利率與企業永續績效指標（SPT，如減碳目標達成率、再生能源使用比例）掛鉤的債券。若未達目標，利率加碼（懲罰機制）；達標維持原利率。資金用途不限。ICMA《SLB原則》提供指引。',
  tw:'台灣環境部、部分上市公司已發行SLB。SLB適合資金用途難以拆分的企業（零售業、食品業）。',
  exam:'▸ SLB vs 綠色債券：績效指標 vs 資金用途（必考）\n▸ SPT=永續績效目標（發行人自設）\n▸ 未達標→利率加碼',
  num:'全球SLB市場快速成長',
  who:'希望整體轉型但資金用途難以明確的企業',rel:['greenbond','sbti','transitfin']},

transitfin:{zh:'轉型金融',en:'Transition Finance',
  prob:'綠色債券和SLB主要服務已經很「綠」的企業，但最需要資金的是高碳排行業（鋼鐵、水泥、化工）的轉型。轉型金融就是專為這些「棕色」企業設計的。',
  how:'協助高碳排行業（鋼鐵、航空、石化、水泥）走向低碳的金融產品和服務。GFANZ（格拉斯哥金融聯盟，130兆美元）是主要推動機構。轉型計畫必須可信、有時間表且符合巴黎協定路徑。',
  tw:'台灣鋼鐵業（中鋼）、石化業（台塑）是轉型金融的潛在受益者。台灣金融業正研究如何設計符合國際標準的轉型金融產品。',
  exam:'▸ 轉型金融 vs 綠色金融（服務高碳排轉型 vs 已很綠的企業）\n▸ GFANZ：格拉斯哥金融聯盟\n▸ 轉型計畫需符合巴黎協定路徑',
  num:'GFANZ管理資產：130兆美元',
  who:'高碳排行業（鋼鐵、水泥、航空、石化）的融資需求',rel:['greenbond','slb','paris','sbti']},

esco:{zh:'ESCO',en:'能源服務公司',
  prob:'工廠知道節能可省錢，但沒有初期投資資金怎麼辦？ESCO模式讓企業不需自己出錢就能進行節能改造。',
  how:'Energy Service Company。ESCO公司替企業執行節能改善，投資由ESCO預先墊付，再以節省下來的能源費用逐月回收成本（EPC合約，Energy Performance Contract）。M&V（測量與查核）驗證實際節能量。企業零初期成本、按期分享節能效益。',
  tw:'台灣能源局推動ESCO保證節能量制度。台灣中小企業可申請綠色融資搭配ESCO服務。ISO 50001能源管理系統常配合ESCO導入。',
  exam:'▸ ESCO核心：EPC合約（ESCO墊付投資，節能費回收）\n▸ M&V：測量與查核（驗證節能量）\n▸ 台灣能源局有ESCO補助計畫',
  num:'企業零初期成本 ／ 節能費回收投資',
  who:'有節能需求但缺乏初期投資資金的工廠',rel:['twpath','iso50001']},

iso50001:{zh:'ISO 50001',en:'能源管理系統',
  prob:'企業想系統性地管理能源使用，持續降低能耗，而不是碰到電費帳單才想到節能。ISO 50001提供一套PDCA循環的能源管理系統。',
  how:'能源管理系統（EnMS）標準，採用PDCA循環：能源政策→能源規劃→實施→查核→管理審查。重要概念：EnB（能源基準線）、EnPI（能源績效指標）、SEU（顯著能源使用）。台灣工廠導入可申請能源局補助。',
  tw:'台灣能源局已要求電力、鋼鐵、石化等能源密集行業建立EnMS，並以ISO 50001為依循標準。可結合ESCO服務降低導入成本。',
  exam:'▸ ISO 50001採用PDCA循環\n▸ SEU=顯著能源使用（必記）\n▸ EnB=能源基準線；EnPI=能源績效指標\n▸ 台灣能源密集行業強制建立EnMS',
  num:'PDCA循環 ／ SEU/EnB/EnPI三核心概念',
  who:'能源密集行業（電力、鋼鐵、石化、半導體等）',rel:['esco','twpath','scope']},

// 概念層
netzero_c:{zh:'Net Zero / 淨零',en:'Net Zero Emissions 概念',
  prob:'什麼叫「淨零」？它和「碳中和」有什麼不一樣？在新聞和報告中這兩個詞常被混用，但含義不同。',
  how:'淨零=排放量大幅削減（≥90%）後，剩餘排放被碳移除（CDR）抵銷，達排放與移除的淨平衡。碳中和=把剩餘排放用碳信用抵換即可（標準較低）。IPCC要求全球2050年達到淨零。SBTi淨零標準要求：Scope 1&2削減≥90%，Scope 3削減≥90%，然後才能用高品質CDR抵銷。',
  tw:'台灣「2050淨零排放路徑」是國家目標，12項關鍵策略為執行架構。',
  exam:'▸ 淨零 vs 碳中和差異（先削減≥90%才能抵換）（必考）\n▸ IPCC：2050年全球淨零\n▸ SBTi淨零標準：Scope 1&2削減≥90%',
  num:'2050年全球淨零目標 ／ 削減≥90%才可抵換',
  who:'設定淨零目標的企業和國家政府',rel:['sbti','cdr','paris','twpath']},

cdr:{zh:'CDR',en:'Carbon Dioxide Removal 碳移除',
  prob:'即使全力節能減碳，部分行業（如鋼鐵、水泥、航空）仍有「難以消除的剩餘排放」。淨零的最後一塊拼圖，就是把這些CO₂從大氣中移除掉。',
  how:'自然移除：植林造林、土壤碳匯、藍碳（紅樹林、海草床）——成本低但永久性較弱。工程移除：DAC（直接空氣捕捉）、BECCS（生物能源+碳捕捉）——成本高但永久性強。CDR是淨零達成的必要補充，但不能取代實質減碳。',
  tw:'台灣林業碳匯、海洋藍碳（大肚溪口濕地）是本土CDR重要來源，可申請TCEX的碳信用。台灣2050淨零路徑將CDR列為必要技術。',
  exam:'▸ CDR分自然碳匯 vs 工程移除\n▸ 用於抵銷「難以消除的剩餘排放」\n▸ 不能取代實質減碳（SBTi要求先減90%）\n▸ DAC成本最高但永久性最佳',
  num:'需抵銷全球剩餘排放 ／ 成本$50-1,000/噸不等',
  who:'設定淨零目標的企業和國家',rel:['netzero_c','dac','ccus','bluec','vcm']},

dac:{zh:'DAC',en:'Direct Air Capture 直接空氣碳捕捉',
  prob:'CCUS從工廠煙道捕捉CO₂，但已排放到大氣中的CO₂怎麼辦？DAC直接從空氣中捕捉CO₂，是最靈活但最昂貴的負碳技術。',
  how:'直接從大氣中捕捉CO₂（約400ppm），不需要工廠煙道。技術類型：固態DAC（吸附劑）和液態DAC（鹼液吸收）。捕捉的CO₂可封存地下（永久移除）或用於合成燃料（e-fuel）。成本目前$300-1,000/噸，IRA 45Q最高補貼$180/噸。',
  tw:'台灣目前無商業規模DAC，主要關注CCUS。但台積電等企業已評估採購DAC碳信用以達成淨零目標。',
  exam:'▸ DAC vs CCUS差異（大氣 vs 工廠煙道）\n▸ DAC成本最高（$300-1,000/噸）但永久性最佳\n▸ IRA 45Q補貼：最高$180/噸\n▸ 是高品質CDR的代表',
  num:'成本：$300-1,000/噸 ／ 永久性最佳',
  who:'設定淨零目標的科技公司、航空業（需高品質CDR）',rel:['ccus','cdr','netzero_c','ira']},

ccus:{zh:'CCUS',en:'碳捕捉利用與封存',
  prob:'鋼鐵、水泥、化工等行業難以完全電氣化，仍有大量製程排碳。CCUS在排放源頭把CO₂抓住，避免進入大氣。',
  how:'Carbon Capture, Utilization and Storage。從工業煙道氣捕捉CO₂，再利用（製成化學品、燃料）或封存（地質構造注入）。CCUS（含利用）vs CCS（只封存）。成本約$50-100/噸。IRA 45Q補貼最高$85/噸（封存）。台灣中鋼、台電正在試驗CCUS。',
  tw:'台灣CCUS面臨的挑戰：適合地質封存的場址有限（台灣多地震）。目前中鋼與工研院合作在高爐試驗CO₂捕捉技術。',
  exam:'▸ CCUS vs CCS（含利用 vs 只封存）\n▸ CCUS vs DAC（煙道 vs 大氣）\n▸ 工程型碳移除（非自然碳匯）\n▸ IRA 45Q：$85/噸封存補貼',
  num:'成本：$50-100/噸 ／ IRA 45Q：$85/噸',
  who:'鋼鐵、水泥、化工、發電等高碳排工業',rel:['dac','cdr','ira','cbam']},

saf:{zh:'SAF',en:'永續航空燃料',
  prob:'航空業難以電氣化（電池太重），但繼續燒傳統航空煤油無法達成淨零。SAF用生物質或合成方式生產，可直接用於現有飛機引擎。',
  how:'Sustainable Aviation Fuel。原料：廢食用油（UCO）、農業廢料、木質素、電合成（Power-to-Liquid）。減碳效果：vs 傳統航油減碳70-90%（全生命週期）。現狀：比傳統航油貴3-5倍；2023年全球SAF只佔航空燃料0.1%。歐盟要求2025年起歐盟機場SAF摻混比例達2%（2050年達70%）。',
  tw:'長榮、華航已在部分航線測試SAF混摻。台灣桃園機場目標成為亞太SAF供應樞紐。台灣生質能源供應鏈正在建立。',
  exam:'▸ SAF=永續航空燃料（減碳70-90%）\n▸ CORSIA可用SAF100%抵減義務\n▸ 目前比傳統航油貴3-5倍\n▸ 歐盟2025年起2%摻混要求',
  num:'減碳70-90% ／ 目前佔比僅0.1%',
  who:'航空公司（長榮、華航）、機場、SAF生產商',rel:['corsia','imo','p2x','greenamm']},

greenh2:{zh:'綠氫 / 藍氫',en:'Green / Blue Hydrogen',
  prob:'鋼鐵、航運、重工業很難用電力替代化石燃料，但氫能可以。問題是現有「灰氫」（天然氣重組，不捕碳）仍大量排碳，需要「綠氫」或「藍氫」取代。',
  how:'綠氫：用再生能源電解水（零碳），成本$4-10/kg，是終極目標。藍氫：天然氣重組+CCUS（過渡期低碳），成本較低。灰氫：現有主流，不捕碳，高排放。IRA 45V對綠氫最高補貼$3/kg，大幅降低成本。',
  tw:'台灣中油、台電已啟動氫能示範計畫。台灣氫能以「進口藍氫+本土綠氫」雙軌策略。台中發電廠試驗天然氣混氫發電。',
  exam:'▸ 綠氫（電解水）vs 藍氫（天然氣+CCUS）vs 灰氫（天然氣，不捕碳）\n▸ IRA 45V綠氫補貼：最高$3/kg\n▸ 應用：鋼鐵DRI、航運、重工業',
  num:'綠氫：$4-10/kg ／ IRA 45V：最高$3/kg',
  who:'鋼鐵業、航運業、重工業、電力業',rel:['ira','ccus','p2x','greenamm','imo']},

greenamm:{zh:'綠氨',en:'Green Ammonia',
  prob:'航運業尋找接替重燃油的零碳燃料。綠氨（用綠氫合成）是最有潛力的選項之一——能量密度高、儲存基礎設施可改建。',
  how:'用綠氫（H₂）和氮氣（N₂，空氣中取得）合成氨（NH₃）。優點：液化溫度高（-33°C），比液氫（-253°C）儲存容易；能量密度比液氫高；現有氨儲運基礎設施可改建。IMO 2050的零碳燃料路徑中，氨是主要候選之一。挑戰：燃燒氨會產生NOx排放需處理。',
  tw:'台灣中油已評估氨進口和利用。台灣發電業測試氨混燃。台灣造船業關注氨燃料船設計。',
  exam:'▸ 綠氨=綠氫+氮氣合成\n▸ IMO零碳燃料候選之一\n▸ 燃燒氨→NOx需處理（挑戰）',
  num:'氨沸點-33°C（比液氫-253°C易儲存）',
  who:'航運業、電力業、農業（化肥原料）',rel:['greenh2','imo','p2x','saf']},

egs:{zh:'EGS',en:'增強型地熱系統',
  prob:'傳統地熱只能用在有天然熱水的地方（冰島、台灣東部）。EGS利用石油業鑽探技術，可以在幾乎任何地方開採地熱，提供24小時不間斷的零碳基載電力。',
  how:'Enhanced Geothermal System。在高溫岩石中鑽兩個深孔，注水進一個孔，被地熱加熱後從另一個孔取出熱水發電。AI資料中心需要穩定、大量的電力，EGS被視為最符合需求的零碳基載電力。Google、Amazon已投資EGS新創公司。',
  tw:'台灣地熱資源豐富（宜蘭、花蓮），目前以傳統地熱為主。台電正評估EGS技術應用於東台灣。',
  exam:'▸ EGS vs 傳統地熱（不需天然熱水）\n▸ 24小時基載電力（vs 太陽能/風能間歇性）\n▸ AI資料中心電力需求的潛在解方',
  num:'技術成熟度：商業化初期',
  who:'電力業、AI資料中心業主',rel:['greenh2','ccus']},

smr:{zh:'SMR',en:'小型模組化反應爐',
  prob:'傳統大型核電站建設週期長（15-20年）、成本高且超支嚴重。SMR體積小、可工廠預製、彈性部署，重新引起核能在淨零中的討論。',
  how:'Small Modular Reactor，300MW以下的小型核電站，可在工廠預製後運至現場組裝。代表廠商：NuScale（美國）、Rolls-Royce（英國）。建設週期5-7年。COP28呼籲到2050年核能裝機增加三倍。',
  tw:'台灣政府目前立場是非核家園，但民間討論日益熱烈。台電正研究SMR技術可行性，尚未做出政策決定。',
  exam:'▸ SMR vs 大型核電（體積小/工廠預製/週期短）\n▸ COP28：核能增加三倍呼籲\n▸ 300MW以下定義為SMR',
  num:'300MW以下 ／ 建設週期5-7年',
  who:'電力業、AI資料中心業主、工業用熱需求',rel:['egs','greenh2']},

   STATE

let selectedId = null;
let sideMode = null; // 'add' | 'edit' | 'regen'
let editingId = null;
let pendingAiData = null;
let workerUrl = localStorage.getItem('esg_worker_url') || 'https://esg-ai-proxy.annycyt.workers.dev';

// ── KV sync ──
function dbg(msg){ /* silent */ }
async function kvGet(){
  try{
    dbg('GET 開始 worker:'+workerUrl);
    const res = await fetch(workerUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get-nodes'})});
    const data = await res.json();
    const nodes = data.nodes||[];
    dbg('GET 成功 '+nodes.length+'筆: '+nodes.map(n=>n.id+'@'+(n._ts||0)).join(', '));
    return nodes;
  }catch(e){
    dbg('GET 失敗: '+e.message);
    return [];
  }
}
async function kvSave(nodes){
  try{
    dbg('SAVE 開始 '+nodes.length+'筆: '+nodes.map(n=>n.id+'@'+(n._ts||0)).join(', '));
    const res = await fetch(workerUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save-nodes',nodes})});
    const data = await res.json();
    dbg('SAVE 結果: '+JSON.stringify(data));
  }catch(e){ dbg('SAVE 失敗: '+e.message); }
}

// Load custom nodes from KV
async function loadCustom(){
  const nodes = await kvGet();
  nodes.forEach(n=>{
    D[n.id] = n;
    const layer = LAYER_DEFS.find(l=>l.id===n.layerId);
    if(layer && !layer.terms.includes(n.id)) layer.terms.push(n.id);
  });
  if(nodes.length){ renderLanes(); updateCount(); }
}
function saveCustom(){
  const ts = Date.now();
  const custom = Object.values(D).filter(n=>n._custom).map(n=>({...n,_ts:ts}));
  kvSave(custom);
  localStorage.setItem('esg_custom_nodes_v3', JSON.stringify(custom));
}

function saveLayout(){
  // save all layer term orders + timestamp
  const ts = Date.now();
  const layout = {
    _ts: ts,
    layers: LAYER_DEFS.map(l=>({ id:l.id, terms:[...l.terms] }))
  };
  localStorage.setItem('esg_layout_v3', JSON.stringify(layout));
  // save to KV as a special node with id '__layout__'
  const allNodes = [
    ...Object.values(D).filter(n=>n._custom).map(n=>({...n,_ts:n._ts||ts})),
    ...Object.entries(D).filter(([k,v])=>v._edited&&!v._custom).map(([k,v])=>({...v,id:k,_ts:v._ts||ts})),
    { id:'__layout__', _layout:layout, _ts:ts }
  ];
  kvSave(allNodes);
}

function restoreLayoutFromLocal(){
  try{
    const s = localStorage.getItem('esg_layout_v3');
    if(!s) return false;
    const layout = JSON.parse(s);
    if(!layout.layers) return false;
    layout.layers.forEach(saved=>{
      const layer = LAYER_DEFS.find(l=>l.id===saved.id);
      if(!layer) return;
      // rebuild terms: keep saved order, only include ids that exist in D
      const reordered = saved.terms.filter(id=>D[id]);
      // add any new ids not in saved (newly added built-ins)
      layer.terms.forEach(id=>{ if(!reordered.includes(id)) reordered.push(id); });
      layer.terms = reordered;
    });
    return true;
  }catch(e){ return false; }
}
function saveEdited(){
  const ts = Date.now();
  const edited = Object.entries(D)
    .filter(([k,v])=>v._edited && !v._custom)
    .map(([k,v])=>({...v, id:k, _ts:ts}));
  dbg('saveEdited: '+edited.map(n=>n.id+'@'+n._ts).join(', '));
  localStorage.setItem('esg_edited_nodes_v3', JSON.stringify(edited));
  const custom = Object.values(D).filter(n=>n._custom).map(n=>({...n,_ts:n._ts||ts}));
  kvSave([...custom, ...edited]);
}
// sync status indicator
function showSyncStatus(msg, color='var(--text3)'){
  let el = document.getElementById('sync-status');
  if(!el){ el=document.createElement('div'); el.id='sync-status';
    el.style.cssText='font-size:10px;color:var(--text3);margin-left:4px;transition:opacity .3s';
    document.getElementById('hdr-count').after(el); }
  el.textContent=msg; el.style.color=color; el.style.opacity='1';
  if(color!=='var(--text3)') setTimeout(()=>{ el.style.opacity='0'; },3000);
}

// restore edited built-in nodes from localStorage immediately (no async wait)
function restoreEditedFromLocal(){
  try{
    const s = localStorage.getItem('esg_edited_nodes_v3');
    if(!s) return;
    JSON.parse(s).forEach(n=>{
      if(n.id && D[n.id]) Object.assign(D[n.id], n);
    });
  }catch(e){ console.warn('restoreEdited error',e); }
}
restoreEditedFromLocal();

// restore custom nodes from localStorage immediately
function restoreCustomFromLocal(){
  try{
    const s = localStorage.getItem('esg_custom_nodes_v3');
    if(!s) return;
    JSON.parse(s).forEach(n=>{
      D[n.id]=n;
      const layer=LAYER_DEFS.find(l=>l.id===n.layerId);
      if(layer&&!layer.terms.includes(n.id)) layer.terms.push(n.id);
    });
  }catch(e){}
}
restoreCustomFromLocal();
restoreLayoutFromLocal(); // restore saved term order
renderLanes(); updateCount();

async function loadCustomWithStatus(){
  showSyncStatus('⟳ 同步中…');
  try{
    const nodes = await kvGet();

    // build local timestamp map for edited nodes
    const localTs = {};
    try{
      JSON.parse(localStorage.getItem('esg_edited_nodes_v3')||'[]')
        .forEach(n=>{ if(n.id) localTs[n.id] = n._ts||0; });
      JSON.parse(localStorage.getItem('esg_custom_nodes_v3')||'[]')
        .forEach(n=>{ if(n.id) localTs[n.id] = n._ts||0; });
    }catch(e){}

    let customCount = 0;
    let kvWon = false;
    dbg('KV比對 localTs:'+JSON.stringify(localTs));
    nodes.forEach(n=>{
      const kvTs = n._ts||0;
      const lcTs = localTs[n.id]||0;
      const kvNewer = kvTs > lcTs;
      dbg('節點 '+n.id+' kvTs='+kvTs+' lcTs='+lcTs+' kvNewer='+kvNewer);

      if(n.id==='__layout__' && n._layout){
        const localLayoutTs = JSON.parse(localStorage.getItem('esg_layout_v3')||'{"_ts":0}')._ts||0;
        if(kvTs > localLayoutTs){
          localStorage.setItem('esg_layout_v3', JSON.stringify(n._layout));
          restoreLayoutFromLocal();
          kvWon = true;
        }
      } else if(n._custom){
        if(!D[n.id] || kvNewer){
          D[n.id] = n;
          const layer = LAYER_DEFS.find(l=>l.id===n.layerId);
          if(layer && !layer.terms.includes(n.id)) layer.terms.push(n.id);
          if(kvNewer) kvWon = true;
        }
        customCount++;
      } else if(n._edited && n.id && D[n.id]){
        if(kvNewer){
          Object.assign(D[n.id], n);
          kvWon = true;
        }
      }
    });

    // update localStorage with KV-won data
    // DO NOT push back to KV on load - only push when user actually edits
    const mergedCustom = Object.values(D).filter(n=>n._custom);
    const mergedEdited = Object.entries(D)
      .filter(([k,v])=>v._edited&&!v._custom)
      .map(([k,v])=>({...v,id:k}));
    if(mergedCustom.length) localStorage.setItem('esg_custom_nodes_v3', JSON.stringify(mergedCustom));
    if(mergedEdited.length) localStorage.setItem('esg_edited_nodes_v3', JSON.stringify(mergedEdited));

    renderLanes(); updateCount();
    const msg = [
      customCount>0 ? customCount+'個自訂' : '',
      kvWon ? '已從其他裝置同步' : ''
    ].filter(Boolean).join('・');
    showSyncStatus(msg?'✓ '+msg:'', 'var(--l1)');
  } catch(e){
    showSyncStatus('⚠ KV 同步失敗，使用本地備份','#b5400a');
  }
}

// load on start
loadCustomWithStatus();

/* ════════════════════════════════════════════
   POLLING - 每 30 秒檢查 KV 是否有新資料
════════════════════════════════════════════ */
(function(){
  // 記錄上次 KV 的資料指紋（用所有 _ts 加總）
  function getKvFingerprint(nodes){
    return nodes.reduce((sum,n)=>sum+(n._ts||0),0);
  }

  let lastFingerprint = 0;
  let pollTimer = null;

  async function poll(){
    // 如果使用者正在編輯，跳過這次（避免干擾）
    const sideOpen = !document.getElementById('side-panel').classList.contains('closed');
    if(sideOpen) return;

    try{
      const nodes = await kvGet();
      const fp = getKvFingerprint(nodes);
      if(fp === lastFingerprint) return; // 沒有變化，不處理
      lastFingerprint = fp;

      // 有新資料，套用更新
      let updated = 0;
      nodes.forEach(n=>{
        const kvTs = n._ts||0;
        if(n.id==='__layout__' && n._layout){
          const localLayoutTs = JSON.parse(localStorage.getItem('esg_layout_v3')||'{"_ts":0}')._ts||0;
          if(kvTs > localLayoutTs){
            localStorage.setItem('esg_layout_v3', JSON.stringify(n._layout));
            restoreLayoutFromLocal();
            updated++;
          }
        } else if(n._custom){
          const localTs = D[n.id]?._ts||0;
          if(kvTs > localTs){
            D[n.id] = n;
            const layer = LAYER_DEFS.find(l=>l.id===n.layerId);
            if(layer && !layer.terms.includes(n.id)) layer.terms.push(n.id);
            updated++;
          }
        } else if(n._edited && n.id && D[n.id]){
          const localTs = D[n.id]?._ts||0;
          if(kvTs > localTs){
            Object.assign(D[n.id], n);
            updated++;
          }
        }
      });

      if(updated > 0){
        // 更新 localStorage
        const custom = nodes.filter(n=>n._custom);
        const edited = nodes.filter(n=>n._edited&&!n._custom);
        if(custom.length) localStorage.setItem('esg_custom_nodes_v3', JSON.stringify(custom));
        if(edited.length) localStorage.setItem('esg_edited_nodes_v3', JSON.stringify(edited));

        renderLanes(document.getElementById('srch').value.trim());
        // 如果詳情面板開著，也刷新
        if(selectedId) showDetailPanel(selectedId);
        showSyncStatus('✓ 已從其他裝置同步 '+updated+' 個名詞','var(--l1)');
      }
    } catch(e){
      // polling 失敗靜默處理，不干擾使用者
    }
  }

  // 初始化指紋（從 localStorage 讀取）
  try{
    const c = JSON.parse(localStorage.getItem('esg_custom_nodes_v3')||'[]');
    const e = JSON.parse(localStorage.getItem('esg_edited_nodes_v3')||'[]');
    lastFingerprint = getKvFingerprint([...c,...e]);
  } catch(ex){}

  // 頁面可見時才 polling，背景時暫停（省電省流量）
  function startPoll(){ if(!pollTimer) pollTimer = setInterval(poll, 30000); }
  function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

  document.addEventListener('visibilitychange', ()=>{
    document.hidden ? stopPoll() : startPoll();
  });
  startPoll();
})();

function renderLanes(filterQ=''){
  const container = document.getElementById('lanes-container');
  container.innerHTML = '';
  LAYER_DEFS.forEach(layer=>{
    const matchTerms = layer.terms.filter(id=>{
      if(!D[id]) return false;
      if(!filterQ) return true;
      const d = D[id];
      return (d.zh+d.en+(d.prob||'')+(d.how||'')).toLowerCase().includes(filterQ.toLowerCase());
    });
    if(filterQ && matchTerms.length===0) return;

    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.dataset.lid = layer.id;
    lane.style.borderColor = layer.color + '55';
    lane.style.background = layer.bg + 'cc';

    lane.innerHTML = `
      <div class="lane-hdr">
        <div class="lane-num" style="background:${layer.color}">${layer.num}</div>
        <div class="lane-info">
          <div class="lane-title" style="color:${layer.text}">${layer.title}</div>
          <div class="lane-desc" style="color:${layer.text}">${layer.desc}</div>
        </div>
        <span class="lane-badge" style="color:${layer.color};border-color:${layer.color}55;background:${layer.bg}">${layer.badge}</span>
      </div>
      <div class="lane-body" id="body-${layer.id}"></div>
    `;
    container.appendChild(lane);

    const body = lane.querySelector('.lane-body');
    const termsToShow = filterQ ? matchTerms : layer.terms;
    termsToShow.forEach(id=>{
      if(!D[id]) return;
      const d = D[id];
      const chip = document.createElement('span');
      chip.className = 'term' + (id===selectedId?' selected':'') + (filterQ&&!matchTerms.includes(id)?' dim':'');
      chip.dataset.id = id;
      chip.dataset.lid = layer.id;
      chip.style.color = layer.color;
      chip.style.borderColor = layer.color + '55';
      if(id===selectedId){ chip.style.background=layer.color; chip.style.color='#fff'; }
      chip.draggable = true;
      chip.innerHTML = `${d.zh}<span style="font-size:10px;opacity:.6;margin-left:3px">${d.en?d.en.split(' ').slice(0,3).join(' '):''}</span>` + (d._custom ? ' <span class="term-plus" style="font-size:10px">✦</span>' : '');
      chip.addEventListener('click', ()=>toggleNode(id, layer.id));
      chip.addEventListener('dragstart', e=>handleDragStart(e, id, layer.id));
      chip.addEventListener('dragover', e=>handleDragOver(e));
      chip.addEventListener('drop', e=>handleDrop(e, id, layer.id));
      chip.addEventListener('dragleave', ()=>chip.classList.remove('drag-over'));
      body.appendChild(chip);
    });

    body.addEventListener('dragover', e=>{ e.preventDefault(); body.style.outline='2px dashed '+layer.color; });
    body.addEventListener('dragleave', ()=>{ body.style.outline=''; });
    body.addEventListener('drop', e=>handleDropLane(e, layer.id));
  });
  updateCount();
}

function renderMd(text){
  if(!text) return '';
  // escape HTML first (but preserve existing <br> and html tags from user)
  let t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // restore intentional <br> that may have been in original
  t = t.replace(/&lt;br&gt;/g,'<br>').replace(/&lt;br\/&gt;/g,'<br>');

  // tables: detect lines with | separators
  const lines = t.split('\n');
  let result = [];
  let tableLines = [];
  let inTable = false;

  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    const isTableRow = /^\s*\|/.test(line) && /\|\s*$/.test(line);
    const isSeparator = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(line);

    if(isTableRow && !isSeparator){
      if(!inTable){ inTable=true; tableLines=[]; }
      tableLines.push(line);
    } else if(isSeparator && inTable){
      // skip separator line, mark next rows as body
      tableLines.push('__SEP__');
    } else {
      if(inTable){
        // flush table
        result.push(buildTable(tableLines));
        tableLines=[]; inTable=false;
      }
      result.push(line);
    }
  }
  if(inTable && tableLines.length) result.push(buildTable(tableLines));
  t = result.join('\n');

  // horizontal rule
  t = t.replace(/^---+$/gm,'<hr style="border:none;border-top:1px solid var(--border2);margin:8px 0">');

  // inline markdown
  t = t
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+?)`/g,'<code style="background:rgba(0,0,0,.08);padding:1px 5px;border-radius:3px;font-family:monospace">$1</code>');

  // headers
  t = t.replace(/^### (.+)$/gm,'<div style="font-weight:600;font-size:1em;margin:10px 0 4px">$1</div>');
  t = t.replace(/^## (.+)$/gm,'<div style="font-weight:700;font-size:1.05em;margin:12px 0 5px">$1</div>');
  t = t.replace(/^# (.+)$/gm,'<div style="font-weight:700;font-size:1.1em;margin:14px 0 6px">$1</div>');

  // lists
  t = t.replace(/^[\-\*] (.+)$/gm,'<div style="padding-left:14px;margin:2px 0">• $1</div>');
  t = t.replace(/^\d+\. (.+)$/gm,(m,p1,offset,str)=>{
    const num = m.match(/^(\d+)/)[1];
    return '<div style="padding-left:14px;margin:2px 0">'+num+'. '+p1+'</div>';
  });

  // line breaks (but not inside table HTML)
  t = t.replace(/\n(?!<)/g,'<br>');
  return t;
}

function buildTable(lines){
  let hasHeader = lines.includes('__SEP__');
  let sepIdx = lines.indexOf('__SEP__');
  let headerLines = hasHeader ? lines.slice(0,sepIdx) : [];
  let bodyLines = hasHeader ? lines.slice(sepIdx+1) : lines;

  function parseRow(line){
    return line.split('|').slice(1,-1).map(c=>c.trim());
  }

  let html = '<div style="overflow-x:auto;margin:8px 0"><table style="border-collapse:collapse;width:100%;font-size:inherit">';
  if(headerLines.length){
    html += '<thead>';
    headerLines.forEach(l=>{
      html += '<tr>'+parseRow(l).map(c=>'<th style="border:1px solid var(--border2);padding:5px 8px;background:var(--bg3);text-align:left;font-weight:600">'+c+'</th>').join('')+'</tr>';
    });
    html += '</thead>';
  }
  if(bodyLines.length){
    html += '<tbody>';
    bodyLines.forEach(l=>{
      html += '<tr>'+parseRow(l).map(c=>'<td style="border:1px solid var(--border2);padding:5px 8px;vertical-align:top">'+c+'</td>').join('')+'</tr>';
    });
    html += '</tbody>';
  }
  html += '</table></div>';
  return html;
}

async function generateAI(mode){
  const btn = document.getElementById('btn-gen');
  const icon = document.getElementById('gen-icon');
  const errEl = document.getElementById('gen-err');
  btn.disabled = true;
  icon.textContent = '↻';
  icon.classList.add('spin');
  errEl.style.display = 'none';

  let abbr, en, hint='', targetId;
  if(mode==='add'){
    abbr = document.getElementById('f-abbr')?.value.trim();
    en = document.getElementById('f-en')?.value.trim();
    if(!abbr){ errEl.textContent='請先填入縮寫 / 簡稱'; errEl.style.display='block'; btn.disabled=false; icon.classList.remove('spin'); icon.textContent='✦'; return; }
  } else {
    targetId = editingId;
    abbr = D[targetId]?.zh;
    en = D[targetId]?.en;
    hint = document.getElementById('f-hint')?.value.trim();
  }

  // regen mode: free-form Q&A, answer goes to note
  if(mode==='regen'){
    if(!hint){ errEl.textContent='請輸入你的問題'; errEl.style.display='block'; btn.disabled=false; icon.classList.remove('spin'); icon.textContent='✦'; return; }
    const d = D[targetId];
    var prompt = `關於「${abbr}${en?' ('+en+')':''}」：${hint}`;

    try{
      const geminiKey = localStorage.getItem('esg_gemini_key')||'';
      if(!geminiKey){ throw new Error('請先點右上角 ⚙ 設定 Gemini API Key'); }
      const wUrl = workerUrl || 'https://esg-ai-proxy.annycyt.workers.dev';
      const res = await fetch(wUrl, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'gemini', geminiKey, prompt })
      });
      const data = await res.json();
      const answerText = (data.text||'').trim();
      if(!answerText) throw new Error(data.error||'沒有回應');

      pendingNoteText = answerText;
      document.getElementById('regen-preview').innerHTML = `
        <div class="s-sec-title">AI 回答預覽（將存入補充筆記）</div>
        <div style="background:var(--l5b);border:1px solid var(--l5)44;border-left:3px solid var(--l5);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--text2);white-space:pre-wrap;line-height:1.75;max-height:300px;overflow-y:auto">${renderMd(answerText)}</div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="document.getElementById('regen-preview').innerHTML='';pendingNoteText=null">放棄</button>
          <button class="btn-primary" onclick="applyRegen()">存入補充筆記</button>
        </div>
      `;
    } catch(e){
      errEl.textContent = 'AI 失敗：'+e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled=false; icon.classList.remove('spin'); icon.textContent='✦';
    }
    return;
  }

  const layerIds = 'l1=科學根源國際政治承諾,l2=強制法規有懲罰,l3=主流自願準則,l4=運作機制,l5=市場工具金融產品,l6=概念術語技術解方';
  var prompt = `請為ESG名詞「${abbr}${en?' ('+en+')':''}」生成繁體中文說明，只輸出純JSON不含其他文字：
{"zh":"中文名稱","en":"英文全名","layerId":"從以下選一個(${layerIds})","prob":"解決什麼問題","how":"怎麼運作，若有清單請逐一列出","detail":"子項目清單，無則空字串","tw":"台灣影響","exam":"考試重點","num":"關鍵數字","who":"適用對象"}`;

  try{
    const geminiKey = localStorage.getItem('esg_gemini_key')||'';
    if(!geminiKey){ throw new Error('請先點右上角 ⚙ 設定 Gemini API Key'); }
    const wUrl = workerUrl || 'https://esg-ai-proxy.annycyt.workers.dev';
    const res = await fetch(wUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'gemini',
        geminiKey,
        prompt
      })
    });
    const data = await res.json();
    const text = (data.text||'').trim();
    if(!text){
      const detail = data.error || data.raw || 'Gemini 無回應';
      throw new Error('Gemini API 沒有回應：'+detail);
    }
    // extract JSON robustly - find first { and last }
    const clean = text.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    const start = clean.indexOf('{');
    const end = clean.lastIndexOf('}');
    if(start===-1||end===-1) throw new Error('AI 回應中找不到 JSON：'+clean.slice(0,100));
    const jsonStr = clean.slice(start, end+1);
    let parsed;
    try{ parsed = JSON.parse(jsonStr); }
    catch(e){ throw new Error('JSON 解析失敗：'+e.message+' 內容：'+jsonStr.slice(0,100)); }
    pendingAiData = parsed;

    if(mode==='add'){
      // fill form fields
      if(parsed.zh) document.getElementById('f-zh').value = parsed.zh;
      if(parsed.en) document.getElementById('f-en').value = parsed.en;
      if(parsed.layerId) document.getElementById('f-layer').value = parsed.layerId;
      if(parsed.prob) document.getElementById('f-prob').value = parsed.prob;
      if(parsed.how) document.getElementById('f-how').value = parsed.how;
      if(parsed.tw) document.getElementById('f-tw').value = parsed.tw;
      if(parsed.exam) document.getElementById('f-exam').value = parsed.exam;
      if(parsed.num) document.getElementById('f-num').value = parsed.num;
      if(parsed.who) document.getElementById('f-who').value = parsed.who;
      if(parsed.detail) D['__pending_detail__'] = parsed.detail;
      // show which layer was selected
      const selLayer = LAYER_DEFS.find(l=>l.id===parsed.layerId);
      if(selLayer){
        const hint = document.createElement('div');
        hint.style.cssText = 'font-size:11px;color:var(--l1);margin-bottom:8px';
        hint.textContent = `✦ AI 自動選擇分類：${selLayer.num}. ${selLayer.title}`;
        document.getElementById('gen-err').after(hint);
        setTimeout(()=>hint.remove(), 4000);
      }
    } else {
      // regen: show preview
      const selLayer = LAYER_DEFS.find(l=>l.id===parsed.layerId);
      // regen → plain text into note, no formatting
      const noteText = [
        parsed.prob||'', parsed.how||'', parsed.tw||'',
        parsed.exam||'', parsed.num||'', parsed.who||''
      ].filter(Boolean).join('\n\n');
      pendingNoteText = noteText;

      document.getElementById('regen-preview').innerHTML = `
        <div class="s-sec-title">AI 生成內容預覽（將存入補充筆記）</div>
        <div style="background:var(--l5b);border:1px solid var(--l5)44;border-left:3px solid var(--l5);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:11px;color:var(--text2);white-space:pre-wrap;line-height:1.7;max-height:220px;overflow-y:auto">${noteText.replace(/</g,'&lt;')}</div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:8px">原本的說明欄位不會被更動，AI 內容只放進「補充筆記」</div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="document.getElementById('regen-preview').innerHTML='';pendingNoteText=null">放棄</button>
          <button class="btn-primary" onclick="applyRegen()">存入補充筆記</button>
        </div>
      `;
    }
  } catch(e){
    errEl.textContent = 'AI 生成失敗：'+e.message+'。請檢查 Worker 網址設定，或手動填寫各欄位。';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    icon.classList.remove('spin');
    icon.textContent = '✦';
  }
}

let pendingNoteText = null;

function applyRegen(){
  if(!editingId) return;
  const d = D[editingId];
  // only update note field, preserve all original content
  const newNote = pendingNoteText || '';
  const timestamp = new Date().toLocaleDateString('zh-TW');
  d.note = (d.note ? d.note + '\n\n---\n' : '') + '【AI 生成 ' + timestamp + '】\n' + newNote;
  pendingNoteText = null;
  pendingAiData = null;
  if(d._custom){ saveCustom(); }
  else { d._edited = true; saveEdited(); }
  closeSidePanel();
  renderLanes(document.getElementById('srch').value.trim());
  showDetailPanel(editingId);
}

/* ════════════════════════════════════════════
   DELETE
════════════════════════════════════════════ */
function deleteNode(id){
  if(!confirm('確定要刪除「'+(D[id]?.zh||id)+'」嗎？')) return;
  delete D[id];
  LAYER_DEFS.forEach(l=>{ l.terms = l.terms.filter(t=>t!==id); });
  saveCustom();
  if(selectedId===id){ selectedId=null; closePanel(); }
  renderLanes(document.getElementById('srch').value.trim());
}

/* ════════════════════════════════════════════
   DRAG & DROP
════════════════════════════════════════════ */
let dragId = null, dragFromLid = null;

function handleDragStart(e, id, lid){
  dragId = id; dragFromLid = lid;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function handleDragOver(e){
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}

function handleDrop(e, targetId, targetLid){
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');
  document.getElementById('lanes-container').querySelectorAll('.lane-body').forEach(b=>b.style.outline='');
  if(!dragId || dragId===targetId) return;

  const fromLayer = LAYER_DEFS.find(l=>l.id===dragFromLid);
  const toLayer = LAYER_DEFS.find(l=>l.id===targetLid);
  if(!fromLayer || !toLayer) return;

  // Remove from old layer
  fromLayer.terms = fromLayer.terms.filter(t=>t!==dragId);
  // Insert before target in new layer
  const idx = toLayer.terms.indexOf(targetId);
  if(dragFromLid===targetLid){
    toLayer.terms.splice(idx, 0, dragId);
  } else {
    toLayer.terms.splice(idx, 0, dragId);
  }

  saveLayout();
  dragId = null; dragFromLid = null;
  renderLanes(document.getElementById('srch').value.trim());
}

function handleDropLane(e, lid){
  e.preventDefault();
  document.getElementById('lanes-container').querySelectorAll('.lane-body').forEach(b=>b.style.outline='');
  if(!dragId) return;
  const fromLayer = LAYER_DEFS.find(l=>l.id===dragFromLid);
  const toLayer = LAYER_DEFS.find(l=>l.id===lid);
  if(!fromLayer || !toLayer || fromLayer===toLayer) return;
  fromLayer.terms = fromLayer.terms.filter(t=>t!==dragId);
  if(!toLayer.terms.includes(dragId)) toLayer.terms.push(dragId);
  saveLayout();
  dragId = null; dragFromLid = null;
  renderLanes(document.getElementById('srch').value.trim());
}

/* ════════════════════════════════════════════
   API SETTINGS
════════════════════════════════════════════ */
function openApiModal(){
  document.getElementById('api-gemini-key').value = localStorage.getItem('esg_gemini_key')||'';
  document.getElementById('api-worker-url').value = workerUrl;
  document.getElementById('api-modal').classList.add('open');
}
function closeApiModal(){
  document.getElementById('api-modal').classList.remove('open');
}
function handleApiModalClick(e){
  if(e.target===document.getElementById('api-modal')) closeApiModal();
}
function saveApiSettings(){
  const gkey = document.getElementById('api-gemini-key').value.trim();
  if(gkey) localStorage.setItem('esg_gemini_key', gkey);
  workerUrl = document.getElementById('api-worker-url').value.trim();
  localStorage.setItem('esg_worker_url', workerUrl);
  closeApiModal();
  showSyncStatus('✓ 設定已儲存','var(--l1)');
}

async function forcePushToKV(){
  const statusEl = document.getElementById('force-push-status');
  if(statusEl) statusEl.textContent = '⟳ 推送中…';
  try{
    const ts = Date.now();
    // collect ALL edited and custom nodes from D
    const custom = Object.values(D).filter(n=>n._custom).map(n=>({...n,_ts:ts}));
    const edited = Object.entries(D)
      .filter(([k,v])=>v._edited&&!v._custom)
      .map(([k,v])=>({...v,id:k,_ts:ts}));
    // include layout
    const layout = JSON.parse(localStorage.getItem('esg_layout_v3')||'null');
    const layoutNode = layout ? [{ id:'__layout__', _layout:layout, _ts:ts }] : [];
    const all = [...custom,...edited,...layoutNode];
    if(all.length===0){
      if(statusEl) statusEl.textContent = '沒有資料需要推送。';
      return;
    }
    await kvSave(all);
    // update localStorage with new ts
    if(custom.length) localStorage.setItem('esg_custom_nodes_v3', JSON.stringify(custom));
    if(edited.length) localStorage.setItem('esg_edited_nodes_v3', JSON.stringify(edited));
    if(statusEl) statusEl.textContent = '✓ 已推送 '+all.length+' 筆資料到雲端，其他裝置重新整理即可同步。';
    showSyncStatus('✓ 強制推送完成','var(--l1)');
  } catch(e){
    if(statusEl) statusEl.textContent = '✗ 推送失敗：'+e.message;
  }
}

/* ════════════════════════════════════════════
   RESIZABLE PANEL
════════════════════════════════════════════ */
(function(){
  if(window.innerWidth<=700) return;
  const resizer = document.getElementById('resizer');
  const panel = document.getElementById('panel');
  const inner = document.getElementById('panel-inner');
  if(!resizer||!panel) return;

  let isResizing = false;
  let startX = 0;
  let startWidth = 0;

  function setW(w){
    panel.style.width = w+'px';
    panel.style.minWidth = w+'px';
    if(inner) inner.style.minWidth = w+'px';
  }
  window._resizerSetW = setW;

  resizer.addEventListener('mousedown', e=>{
    e.preventDefault();
    e.stopPropagation();
    isResizing = true;
    startX = e.clientX;
    // read width directly from style (set by us, always in px)
    startWidth = parseInt(panel.style.width)||380;
    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
  });

  window.addEventListener('mousemove', e=>{
    if(!isResizing) return;
    e.preventDefault();
    const dx = startX - e.clientX;
    const newW = Math.min(Math.max(startWidth + dx, 260), window.innerWidth * 0.72);
    setW(Math.round(newW));
  });

  window.addEventListener('mouseup', ()=>{
    if(!isResizing) return;
    isResizing = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    const w = parseInt(panel.style.width)||0;
    if(w>0) localStorage.setItem('esg_panel_width', String(w));
  });
})();
